#
# NOT a requirements file — there are no versions and no hashes here,
# and nothing installs it. It records which pins in requirements/*.txt
# carry an environment marker, so that LOSING one is a red gate.
#
# Why: a lock re-resolved on a single platform (which is what
# Dependabot commits) silently drops every pin whose marker excludes it
# there. The locks install with --require-hashes on Windows and macOS
# too, so a dropped pin is an install failure on the platform that
# needed it — reported against the install step, never naming the
# package. `lock_toolchain.py --audit` diffs the locks against this
# file and names it.
#
# Versions are deliberately absent: a routine bump must not churn this
# file, or regenerating it becomes reflexive and it stops being a
# tripwire. Only a change in the SHAPE of the resolution moves a line.


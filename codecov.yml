# Codecov configuration.
#
# Codecov is a DASHBOARD here, not a gate. boost already enforces coverage
# itself, twice, and those checks are the authoritative ones:
#
#   * project floor  — pytest --cov with fail_under = 80 (pyproject.toml)
#   * patch floor    — diff-cover --fail-under=80 vs origin/main (ci.yml)
#
# Both run in-repo, offline, on every PR. Layering a third-party status check on
# top would mean a merge could be blocked by somebody else's uptime, and a gate
# you cannot run locally is a gate contributors cannot preempt. So every status
# below is `informational: true`: Codecov comments, draws the sunburst and tracks
# the trend, and never fails a build.
#
# Until CODECOV_TOKEN exists as a repo secret the upload step is skipped
# entirely (see ci.yml), so this file is inert rather than wrong.

coverage:
  precision: 1
  round: down
  # Match the repo's own floor so the dashboard and the gate tell the same story.
  range: "80...100"
  status:
    project:
      default:
        target: 80%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

comment:
  # One comment, rewritten in place, showing the diff and the file breakdown.
  layout: "condensed_header, diff, flags, components, condensed_files"
  behavior: once
  require_changes: true      # stay silent on a PR that changes no covered code

ignore:
  # Generated by setuptools-scm at build time and absent from a checkout — the
  # same carve-out [tool.mypy] and [tool.pyright] make.
  - "boost_cli/_version.py"
  # Dev/CI tooling and fixtures, not shipped code.
  - "scripts/**"
  - "tests/**"
  - "noxfile.py"

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "boost-skill-cli"
dynamic = ["version"]
description = "boost — Homebrew for AI coding skills"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Jonathan Reyes"}]
keywords = ["ai", "skills", "package-manager", "claude-code", "cursor", "windsurf", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/jonnyeclectic/boost"
Repository = "https://github.com/jonnyeclectic/boost"
Changelog = "https://github.com/jonnyeclectic/boost/releases"

[project.optional-dependencies]
# Opt-in dense semantic retrieval (RAG Phase 2). The default install stays
# zero-dependency; `pip install boost-skill-cli[rag]` adds a single-file
# on-disk vector store. Embeddings come from an API over urllib (Voyage or
# OpenAI, keyed by env var) — no client library required. Without this extra,
# or without an embeddings key, search degrades to the always-on BM25 engine.
rag = ["sqlite-vec>=0.1.6"]
# Opt-in eval extras. The Tier 1 gate (scripts/eval_retrieval.py) is pure-stdlib
# and required in CI; nothing here is imported by the CLI or the required gate.
# `pip install boost-skill-cli[eval]`. Powers:
#   - Tier 1b `--stats`: ranx statistical-significance testing between engines.
#   - Tier 2c (scripts/eval_explain.py): ragas `faithfulness` for `boost explain`.
# ragas 0.2.x hard-imports a ChatVertexAI path that langchain>=1.0 /
# langchain-community>=0.4 removed, so the langchain 0.3 stack is pinned — an
# unavoidable constraint of ragas's packaging, isolated to this opt-in extra.
eval = [
    "ranx>=0.3.20",
    "ragas>=0.2,<0.3",
    "langchain-core<0.4",
    "langchain-community<0.4",
    "langchain-openai<1",
]
# Opt-in Gherkin/BDD functional suite (tests/bdd) — reusable Given/When/Then
# scenarios over the same in-process CLI entrypoint tests/functional drives.
# Additive to, not a replacement for, the pytest functional suite; not part of
# `make check`. `pip install -e '.[bdd]'`.
bdd = ["behave>=1.2.6"]
# Opt-in micro-benchmarks (tests/perf, `make bench`) for perf-sensitive core
# paths (BM25 indexing/search, catalog scan). Not part of `make check` — a
# timing regression shouldn't block a merge the way a correctness gate does.
# `pip install -e '.[perf]'`.
perf = ["pytest-benchmark>=4.0"]

[project.scripts]
boost = "boost_cli.cli:main"

[tool.setuptools_scm]
# Version is derived from the latest git tag (vX.Y.Z) at build time, so tags
# are the single source of truth — no constant to bump, no drift. Writes the
# resolved version to boost_cli/_version.py (git-ignored).
version_file = "boost_cli/_version.py"

[tool.setuptools.packages.find]
include = ["boost_cli*"]

[tool.setuptools.package-data]
boost_cli = ["data/*.json"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Beyond the default E/F set, turn on families that catch real bug, readability
# and performance smells at zero new-tool cost (ruff already runs in the lint
# gate): flake8-bandit (S, Python SAST — shell=True, tempfile.mktemp, unsafe
# yaml.load, weak hashing), flake8-bugbear (B), flake8-simplify (SIM),
# flake8-comprehensions (C4), perflint (PERF) and Ruff-native (RUF).
extend-select = ["S", "B", "SIM", "C4", "PERF", "RUF"]
ignore = [
    # boost is a CLI that shells out to git by design: every subprocess call
    # passes an argument LIST (never a shell string) and resolves `git` via
    # PATH on purpose, so these two fire only on safe, intentional code.
    "S603",  # subprocess-without-shell-equals-true (list form is not injectable)
    "S607",  # start-process-with-partial-path (`git` on PATH is deliberate)
    # Best-effort cleanup/logging swallows are a pervasive, commented pattern
    # (logger teardown, corrupt-lock preservation, the crash handler) where a
    # raised exception would be worse than the one being swallowed.
    "S110",  # try-except-pass
    # Ambiguous-unicode: boost's output is deliberately typographic — em dashes,
    # arrows (→), middots (·) and the ❯ prompt ornament are the Aurora UI
    # language (see the BOOST-D design items), not typos to be "corrected".
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment
    # boost's scan/index/update loops wrap each item in try/except on purpose so
    # one corrupt file or unreachable tap is skipped, not fatal to the whole
    # batch. Hoisting the handler out of the loop would trade that resilience
    # for a negligible per-iteration saving.
    "PERF203",  # try-except-in-loop
]

[tool.ruff.lint.per-file-ignores]
# short throwaway names and lambda helpers are fine in tests; asserts are the
# whole point of a test suite, and tests legitimately open fixture URLs.
"tests/*" = ["E741", "E731", "S101", "S310"]

[tool.codespell]
# Spell-check user-facing text (see `make lint`: boost_cli, docs, README).
# Generated boards and the setuptools-scm version stub aren't ours to check.
skip = "docs/roadmap.html,docs/design-roadmap.html,docs/commands.html,boost_cli/_version.py,*.tar.gz"
# Valid English that codespell's dictionary flags as misspellings.
ignore-words-list = "unparseable,accreting"

[tool.mypy]
python_version = "3.9"
files = ["boost_cli"]

# boost_cli/_version.py is generated by setuptools-scm at build time and is
# absent from a plain checkout — don't fail type-checking when it's missing.
[[tool.mypy.overrides]]
module = "boost_cli._version"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:boost_cli.*"]

[tool.coverage.run]
source = ["boost_cli"]
parallel = false

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# pyright: a SECOND type checker alongside mypy. Its independent inference
# catches None-flow and narrowing bugs mypy's config lets slide — it found the
# `"taps": null` crash in registry.list_taps() that mypy passed clean.
# Scoped to boost_cli/core (the mutation-tested engine) so the gate is green and
# meaningful today; widening to commands/ is tracked on the roadmap.
# Dev/CI-only — never imported at runtime.
[tool.pyright]
include = ["boost_cli/core"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
# _version.py is generated by setuptools-scm at build time and absent from a
# plain checkout (same carve-out as [tool.mypy]).
ignore = ["boost_cli/_version.py"]
reportMissingImports = false   # optional extras ([rag] sqlite_vec) resolve at runtime

# import-linter: turn boost's assumed layering into an enforced contract, so a
# cross-layer import can't silently erode the engine. Run by `make lint`
# (lint-imports) and the CI lint job. Dev/CI-only — never imported at runtime.
[tool.importlinter]
root_package = "boost_cli"

[[tool.importlinter.contracts]]
name = "boost_cli is layered: cli -> commands -> core"
type = "layers"
# Higher layers may import lower ones, never the reverse: core/ (the engine)
# must import neither commands/ nor the CLI, and commands/ must not reach up
# into cli. This is the structural rule CLAUDE.md documents — core is the
# mutation-tested engine, commands/ is thin glue on top of it.
layers = ["cli", "commands", "core"]
containers = ["boost_cli"]
# The one intentional upward edge: `boost completions` reads COMMANDS — the
# command registry, which lives in cli.py by design (see CLAUDE.md) — to list
# every command. That single metadata lookup is allowlisted; any other
# commands -> cli import is still a violation.
ignore_imports = ["boost_cli.commands.configuration -> boost_cli.cli"]

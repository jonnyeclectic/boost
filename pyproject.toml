[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "boost-skill-cli"
dynamic = ["version"]
description = "boost — Homebrew for AI coding skills"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Jonathan Reyes"}]
keywords = ["ai", "skills", "package-manager", "claude-code", "cursor", "windsurf", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/jonnyeclectic/boost"
Repository = "https://github.com/jonnyeclectic/boost"
Changelog = "https://github.com/jonnyeclectic/boost/releases"

[project.scripts]
boost = "boost_cli.cli:main"

[tool.setuptools_scm]
# Version is derived from the latest git tag (vX.Y.Z) at build time, so tags
# are the single source of truth — no constant to bump, no drift. Writes the
# resolved version to boost_cli/_version.py (git-ignored).
version_file = "boost_cli/_version.py"

[tool.setuptools.packages.find]
include = ["boost_cli*"]

[tool.setuptools.package-data]
boost_cli = ["data/*.json"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint.per-file-ignores]
# short throwaway names and lambda helpers are fine in tests
"tests/*" = ["E741", "E731"]

[tool.mypy]
python_version = "3.9"
files = ["boost_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:boost_cli.*"]

[tool.coverage.run]
source = ["boost_cli"]
parallel = false

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

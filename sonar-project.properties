# SonarCloud / SonarQube analysis settings.
#
# Read by .github/workflows/sonarcloud.yml. Everything here is inert until the
# repo is onboarded to SonarCloud and SONAR_TOKEN exists as a secret — the
# workflow skips itself without one.
#
# The organization/project keys follow SonarCloud's default for a GitHub import
# (owner_repo). Correct them here if the import chooses different keys.
sonar.organization=jonnyeclectic
sonar.projectKey=jonnyeclectic_boost
sonar.projectName=boost

# What to analyze. `boost_cli` is the shipped engine; tests are declared
# separately so Sonar attributes issues to the right side and does not score the
# suite's asserts as duplication.
sonar.sources=boost_cli
sonar.tests=tests
sonar.python.version=3.9,3.12,3.14

# Coverage comes from the Cobertura report the CI suite already emits — Sonar
# reads it, it does not run the tests itself.
sonar.python.coverage.reportPaths=coverage.xml

# Generated or vendored files that are not ours to score.
sonar.exclusions=\
    boost_cli/_version.py,\
    boost_cli/data/registries.json,\
    docs/roadmap.html,\
    docs/design-roadmap.html,\
    docs/commands.html,\
    tests/visual/node_modules/**

# Duplication is a real signal in the engine and noise in the suite: parallel
# test cases are *supposed* to look alike, and flagging that trains people to
# ignore the metric.
sonar.cpd.exclusions=tests/**

sonar.sourceEncoding=UTF-8

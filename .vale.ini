; Vale — prose & terminology linting for the contributor-facing Markdown
; surfaces (the same set markdownlint covers). Two things are enforced:
;   1. Vale.Spelling with the boost vocabulary (.vale/styles/config/
;      vocabularies/boost/accept.txt) — catches future typos codespell's
;      dictionary misses, without nagging on the project's technical terms.
;   2. boost.Terminology — canonical casing for product names (GitHub, PyPI,
;      macOS, ...) in prose. Code spans and fences are never checked.
; Run locally:  vale README.md CONTRIBUTING.md docs/*.md
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = boost

[*.md]
BasedOnStyles = Vale, boost
; accept.txt is a spelling allowlist, not canonical casing — MCP vs mcp both fine.
Vale.Terms = NO

; Roadmap card bodies are HTML-in-Markdown copy rendered by build_roadmap.py,
; and .claude/ is agent-harness config — neither is standalone prose.
[docs/roadmap/items/*.md]
BasedOnStyles =

; docs/commit-audit.md is a generated record: a table of short SHAs, file paths
; and tool identifiers produced by an audit pass, not authored prose. Spelling
; it would mean adding ~27 one-off identifiers to the shared vocabulary, which
; would weaken the check everywhere else to lint one machine-written file.
[docs/commit-audit.md]
BasedOnStyles =

[.claude/**/*.md]
BasedOnStyles =

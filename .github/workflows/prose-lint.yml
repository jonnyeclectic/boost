name: prose-lint

# Vale over the contributor-facing Markdown surfaces (the same set
# markdownlint covers structurally). Two enforcement layers:
#   1. Vale.Spelling + the boost vocabulary (.vale/styles/config/vocabularies/
#      boost/accept.txt) — catches future typos codespell's dictionary misses,
#      without nagging on the project's 72 accepted technical terms.
#   2. boost.Terminology — canonical casing for product names (GitHub, PyPI,
#      macOS, CrewAI, ...) in prose. Code spans/fences are never checked.
# Config: .vale.ini at the repo root. Run locally:
#   vale README.md CONTRIBUTING.md SECURITY.md CLAUDE.md docs/*.md

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".vale.ini", ".vale/**", ".github/workflows/prose-lint.yml"]
  pull_request:
    paths: ["**/*.md", ".vale.ini", ".vale/**", ".github/workflows/prose-lint.yml"]

permissions: {}

jobs:
  vale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vale (pinned binary)
        # Same pinned-release pattern as the gitleaks/actionlint lint steps.
        run: |
          # Retried and checked, never piped: a truncated download fed to tar
          # failed this job as "Error is not recoverable".
          curl -fsSL --retry 5 --retry-all-errors -o vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.13.0/vale_3.13.0_Linux_64-bit.tar.gz
          echo "4378ee4bc7c2493760826270e55d5569cda35d7c89582e9fdc3070e2a1089193  vale.tar.gz" | sha256sum -c -
          tar xzf vale.tar.gz vale
          ./vale README.md CONTRIBUTING.md SECURITY.md CLAUDE.md docs/DEBUGGING.md docs/rag-architecture.md docs/security-design.md docs/code-review.md docs/semantic-search.md docs/bmad.md docs/openssf-badge.md docs/openssf-playbook.md docs/dependencies.md docs/verifying-releases.md MAINTAINERS.md SUPPORT.md GOVERNANCE.md docs/architecture/*.md examples/README.md style/README.md

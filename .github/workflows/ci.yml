name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run the full gate against each queued merge combination when the GitHub
  # merge queue is enabled, so two independently-green PRs can't land a broken
  # combination. merge_group runs on a gh-readonly-queue/* ref (not main), so it
  # never triggers the release workflow — publish still fires only on the real
  # push to main. Enabling the queue itself is a repo Setting (see CONTRIBUTING).
  merge_group:

# Least-privilege default for any job that doesn't declare its own block. Every
# job below currently does — and a job-level block REPLACES this one rather than
# merging with it — so this changes no job's effective token today. It is the
# floor for the next job someone adds, and it satisfies Scorecard's
# TokenPermissions check, which scores a workflow 0 for having no top-level
# default at all.
permissions:
  contents: read

# Cancel a pull request's previous run when a new push supersedes it, and NEVER
# cancel anything else.
#
# Measured over six consecutive successful runs, 31% of all job time here was
# spent queueing rather than executing — 104 job-minutes against 236 — and the
# median per-job queue swung 29x between runs (0.1 min when the repo was quiet,
# 2.9 min with a dozen loop/* branches and Dependabot PRs live). The cost is
# driven by how much runner footprint is in flight at once, not by the change
# under test, and sharding the mutation gate traded one runner slot for six.
# This was the only workflow in the repo with no concurrency group at all, so
# every superseded push left ~36 checks — six of them mutation shards — running
# to completion against a commit nobody was waiting on any more.
#
# Two things keep the release path out of it, and both matter.
#
# The condition: `cancel-in-progress: true` would also cancel a push to main,
# which publish.yml gates the release on via workflow_run — a merge that
# silently never ships — and a merge_group run, where a cancelled run never
# reports its required contexts and the queue then waits on a status that is
# never coming, the deadlock the comments further down this file describe.
#
# The KEY: non-PR events group on `github.sha`, not `github.ref`. Keying main on
# its ref would put every main push in one group, and `cancel-in-progress:
# false` does not mean "never cancel" — it means a newer run waits, and GitHub
# cancels the older *pending* run when a third arrives. Three quick merges would
# then leave a main commit whose ci never completes, so workflow_run never fires
# and that commit never releases. A sha is unique per commit, so main and the
# merge queue simply never share a group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install linters
        # Hash-pinned (requirements/lint-tools.txt, generated from the .in by
        # scripts/lock_toolchain.py) so an upstream linter release can't
        # retroactively redden the gate — see that file's header. pip enforces
        # every sha256, so a yanked or tampered transitive dependency fails the
        # install instead of silently changing what the gate checks.
        run: python -m pip -q install -r requirements/lint-tools.txt
      - name: ruff
        # scripts/ is in scope on purpose: the 28 build-and-gate tools decide
        # whether every PR merges, and leaving them unlinted is how two
        # unguarded zip() sites survived the B905 audit (see the
        # scripts-under-the-lint-gate roadmap card).
        run: ruff check boost_cli boost_langchain tests evals scripts
      - name: mypy
        run: mypy
      - name: pyright (second type checker)
        # Independent inference over boost_cli/core — catches the None-flow and
        # narrowing bugs mypy's config lets slide (it found the `"taps": null`
        # crash in registry.list_taps()). Config: [tool.pyright] in pyproject.
        run: pyright
      - name: layering (import-linter)
        # Enforce the architecture contract: core/ (the engine) imports neither
        # commands/ nor the CLI; commands/ never reaches up into cli. Config +
        # the one allowlisted edge live in pyproject.toml [tool.importlinter].
        run: lint-imports
      - name: dead-code radar (vulture)
        # Flag unused imports / unreachable code. min-confidence 80 excludes the
        # dynamically-dispatched cmd_* functions (called via importlib in cli.py),
        # so a finding is a real dead-code smell, not a false positive.
        run: vulture boost_cli --min-confidence 80
      - name: complexity radar (xenon)
        # Ratchet cyclomatic complexity: passes today (average is B) and fails if
        # the codebase's aggregate complexity regresses. Individual grandfathered
        # blocks are allowed up to F; a module or the average degrading is not.
        run: xenon --max-absolute F --max-modules E --max-average B boost_cli
      - name: docstring coverage (interrogate)
        # core/ is the contract-heavy engine; hold its docstring floor at 90%
        # (98.5% when this landed) so new public functions ship documented.
        # Flags/carve-outs: [tool.interrogate] in pyproject.
        run: interrogate boost_cli/core
      - name: modernization smells (refurb)
        # refurb's mypy-backed FURB checks catch the dated idioms ruff's ported
        # subset misses — try/except/pass that wants contextlib.suppress,
        # redundant list()/dict()/str() casts, `x or ""` on an already
        # non-optional value. ruff carries the pyupgrade (UP) half of this gate;
        # the PEP 585/604 rules are enforced since the pep585-604 sweep landed
        # (typing.List and friends are gone). UP031 stays declined — printf
        # formatting is house style (rationale in pyproject.toml [tool.ruff.lint]).
        run: refurb boost_cli
      - name: codespell (user-facing text)
        run: codespell boost_cli boost_langchain docs README.md
      - name: secret scan (gitleaks)
        # Scan the full history + working tree for leaked tokens, keys and
        # high-entropy secrets before they can reach a release. boost's own
        # synthetic secret-scanner fixtures are allowlisted in .gitleaks.toml;
        # everything else is scanned against the upstream default ruleset. The
        # binary is pinned; the lint checkout is fetch-depth: 0, so the whole
        # history is present to scan.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml
      - name: actionlint (workflow linting + shellcheck)
        # The release is fully automated across every workflow file — a malformed
        # ${{ }} expression or a bug in a run: block is a broken publish. Pin the
        # binary.
        #
        # actionlint does not lint run: blocks itself: it shells out to
        # shellcheck, and when shellcheck is absent it skips them and still
        # exits 0. This step used to rely on the runner image happening to
        # preinstall it — an unpinned, unversioned dependency on somebody
        # else's base image, silently revocable, whose removal would look
        # exactly like a passing lint. shellcheck now comes from
        # requirements/lint-tools.txt (installed above, hash-pinned), so assert
        # it is there rather than assume it.
        run: |
          command -v shellcheck
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
      - name: workflow SAST (zizmor)
        # boost's workflows embed github-script JS/shell and drive a Trusted-
        # Publisher release — zizmor statically flags template injection,
        # unpinned actions, over-broad GITHUB_TOKEN permissions and dangerous
        # triggers. Accepted findings are documented in .github/zizmor.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        # 1.27.0 was YANKED from PyPI for GHSA-f42p-wjw5-97qh; 1.28.0 is
        # the fix. Nothing in CI would have caught it: zizmor is invoked
        # through `pipx run` inside this step, so it is in no lock file,
        # pip-audit never resolves it and Dependabot never sees it. Every
        # `pipx run`/`npx` pin in .github/workflows/ has that same blind
        # spot — Scorecard's PinnedDependencies hits are about exactly
        # these invocations.
        run: pipx run zizmor==1.28.0 .github/workflows
      - name: registries.json is regenerated
        run: python scripts/build_registries.py --check
      - name: roadmap HTML is regenerated
        run: python scripts/build_roadmap.py --check
      - name: toolchain lock is regenerated
        # The hash-pinned requirements/*.txt are generated from the *.in files;
        # a stale lock means CI is installing something nobody declared. Needs
        # uv (the resolver) and the network, like the eval corpus step.
        run: |
          python -m pip -q install uv
          python scripts/lock_toolchain.py --check
      - name: accessibility gate (WCAG 2.1 AA)
        # Structural WCAG failures decidable from the markup (lang, alt, link and
        # button names, duplicate ids, heading order) plus the 1.4.3 contrast
        # ratios computed from the Aurora tokens themselves. Pure stdlib, so it
        # runs here rather than needing Node/Chrome; the axe-core sweep in
        # tests/visual covers what needs a live DOM.
        run: python scripts/a11y_check.py -v
      # Page-weight budget. `lighthouse` is NOT a required check, which is how
      # roadmap.html shipped two of three runs under its own perf floor on main
      # without anyone noticing. This cannot replace it — measured, a 33% cut in
      # laid-out body text moved that score by 0.00, so markup size is not a
      # predictor — but it is required, deterministic and pure stdlib, and it
      # turns "the board only grows" into a number printed on every run and a
      # ceiling that has to be raised on purpose.
      - name: page-weight budget (markup, DOM size, nesting)
        run: python scripts/page_budget.py -v
      - name: golden set is regenerated
        # evals/golden_set.json is generated from evals/make_golden.py's query
        # table and validated against the generated corpus, so a judgment can
        # never cite a skill the corpus does not contain.
        run: python evals/make_golden.py --check
      - name: command reference is regenerated
        # docs/commands.html is generated from the CLI's own COMMANDS + argparse
        # parsers, so it can't drift from the code. The script imports boost_cli
        # via a sys.path shim (no editable install needed, like the eval gate).
        run: python scripts/build_command_reference.py --check
      # Startup import-time budget: a lazy-import guard. For a CLI, cold-start
      # latency is the UX; this asserts the heavy/optional stack (sqlite_vec,
      # embedding/AI SDKs, scientific-python, boost's dense/embed engines)
      # never loads for common offline commands. Name-based, so it's
      # deterministic across runners/Python versions — never timing-flaky.
      - name: startup import-time budget (lazy-import guard)
        run: python scripts/import_budget.py --list
      # Performance-regression gate: complexity scaling, not wall-clock
      # baselines. Times scan/BM25-build/retrieve at 64 vs 512 synthetic items
      # and fails when the big/small ratio exceeds 3x-of-linear — an O(n²)
      # slip lands at ~64x and is caught decisively, while runner speed
      # cancels out of the ratio. Pure stdlib, same PYTHONPATH shim as eval.
      - name: perf gate (scaling ratios)
        run: PYTHONPATH=. python scripts/perf_gate.py -v
      # Tier 1 retrieval quality gate: golden-set retrieval over a PINNED corpus.
      # The golden set grades real catalog items by name, so the repos holding
      # them (tests/eval/taps.txt) are tapped first and checked out at the commit
      # each row pins — deterministic given that set (pure-stdlib BM25; no
      # ANTHROPIC_API_KEY). Regression-vs-baseline stays relaxed
      # (--regression-eps 1); the absolute floors are the real gate.
      #
      # THE FLAGS MUST MATCH `make eval` — tests/unit/test_eval_corpus.py fails
      # the build if they drift. They had drifted: this step floored recall alone
      # at 0.85 and claimed "measured 1.000 over the pinned corpus, wide margin",
      # while the corpus actually scores 0.863 — a buffer of 1.15 queries out of
      # 91. So the required check was tighter than the documented gate on one
      # metric and absent on the other three, the ones that exist to catch a
      # ranker that finds the answer every time and never ranks it first.
      # PYTHONPATH=. makes boost_cli importable without an editable install.
      #
      # THE CLONES ARE CACHED, and it is availability this buys, not speed.
      # `ensure_eval_corpus.sh` runs under `set -euo pipefail` in this required
      # job, so one of twenty personal repositories being deleted, renamed or
      # made private reddens EVERY open pull request at once, on changes with
      # nothing to do with retrieval. A cache hit is a corpus that no longer
      # needs those repositories to still exist.
      #
      # Only `repos/` and `config.json` — third-party bytes fixed by the SHA in
      # taps.txt, and the list of which repo is where. Everything this project
      # derives (the per-tap catalog JSON, the BM25 index) is deliberately left
      # out and rebuilt every run, so a cache can never answer for code that has
      # since changed. FORCE=1 says the same thing about the sentinel: it is not
      # cached, and even if a later edit to these paths let it in, the corpus
      # would still be re-pinned and re-counted rather than trusted.
      #
      # Keyed on the tap list's content, with NO restore-keys on purpose. A
      # near-miss restore would hand this job a corpus built for a different
      # taps.txt, carrying taps this file no longer pins — and the index is
      # built from every configured tap, so those extra entries would be scored
      # as if they were the pinned corpus. An exact key or nothing.
      - name: restore the pinned eval corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.eval-home/repos
            ${{ github.workspace }}/.eval-home/config.json
          key: eval-corpus-${{ hashFiles('tests/eval/taps.txt') }}
      - name: retrieval quality gate (Tier 1 golden set)
        env:
          # The scratch home `make eval` uses, so the cached path and the
          # documented one are one thing.
          BOOST_HOME: ${{ github.workspace }}/.eval-home
        run: |
          FORCE=1 bash scripts/ensure_eval_corpus.sh
          PYTHONPATH=. python scripts/eval_retrieval.py --build -k 10 \
            --fail-under 0.78 --floor hit@1=0.40 --floor MRR=0.52 --floor nDCG@k=0.58 \
            --regression-eps 1
      # Save explicitly rather than with the combined action, so a corpus that
      # failed to materialise or failed its counts is never the thing a later
      # run restores. The key is content-addressed, so a bad entry under it
      # would persist the failure instead of retrying it.
      - name: cache the pinned eval corpus
        if: success() && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.eval-home/repos
            ${{ github.workspace }}/.eval-home/config.json
          key: eval-corpus-${{ hashFiles('tests/eval/taps.txt') }}

  evals:
    # Evaluation-harness gate: recall@5/@10, MRR, nDCG@5/@10 with graded (3/2/1)
    # relevance over the hermetic golden set, plus a paired-bootstrap regression
    # test against the committed evals/baseline.json. Deliberately its own job
    # rather than a step in `lint`: unlike the Tier 1 gate there, it needs NO
    # network and NO API key — it generates its own corpus and taps it into a
    # disposable BOOST_HOME — so it must stay green even when GitHub is having a
    # bad day. Pure stdlib; nothing to install beyond Python and git.
    runs-on: ubuntu-latest
    # Measured well under a minute (corpus + BM25 index + 36 queries x 2 engines
    # + a 10k-resample bootstrap, all stdlib); 15 is slack for a cold runner.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: evaluation harness gate (floors + significance)
        run: python scripts/eval_gate.py --run

  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write  # coverage badge push (main only)
    defaults:
      run:
        # Windows' default runner shell is pwsh; Git for Windows ships a bash
        # on PATH, so pin bash everywhere and keep one script per step.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # floor, middle, ceiling — same shape as before, shifted by the >=3.12
        # floor. 3.13 is the middle rather than a second point near the edge.
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'   # harden-runner is Linux-only
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: venv bin dir (Windows uses Scripts/, not bin/)
        run: echo "VENV_BIN=.venv/$( [ "$RUNNER_OS" = Windows ] && echo Scripts || echo bin )" >> "$GITHUB_ENV"
      - name: install test deps
        run: |
          python -m venv .venv
          # Hash-pinned (requirements/test-tools.txt, generated by
          # scripts/lock_toolchain.py). Resolved universally from the >=3.12
          # floor, so this ONE file covers every leg of this matrix. The
          # dual markered pins that used to give 3.9 an older release of
          # attrs/coverage/hypothesis/iniconfig/pytest/typing-extensions
          # collapse to one pin each now that nothing below 3.12 resolves.
          # hypothesis powers the property-based parser tests.
          "$VENV_BIN/pip" -q install -r requirements/test-tools.txt
          # [rag] extra so the opt-in dense backend is exercised (py3-none
          # wheel; falls back to importorskip if a platform lacks it). Left
          # unlocked and best-effort: it is an optional runtime extra, not part
          # of the toolchain, and some matrix legs have no wheel for it.
          "$VENV_BIN/pip" -q install sqlite-vec || true
      - name: unit + functional (80% coverage gate)
        # Every failing test is re-emitted as a `::error::` workflow command so
        # it lands as a check-run annotation. The step conclusion already says
        # WHICH STEP broke; the annotation is what says WHICH TEST. Without it
        # the only place that answer exists is the raw job log, which is not
        # reachable from every environment (it redirects to blob storage that
        # egress policies and proxies routinely block) — and "the suite failed
        # somewhere" costs a whole CI round-trip to narrow down.
        #
        # `shell: bash` on this job already means `-eo pipefail`, so the pipe
        # into tee reports pytest's status rather than tee's; `|| rc=$?` is what
        # keeps -e from killing the step before the annotations are emitted.
        # set -o pipefail is restated anyway so this does not silently become a
        # green step if the job's shell: is ever changed.
        run: |
          set -o pipefail
          rc=0
          "$VENV_BIN/pytest" tests/unit tests/functional \
            --cov=boost_cli --cov-report=term-missing --cov-report=json -q \
            | tee /tmp/pytest.out || rc=$?
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | sed 's/^/::error::/' || true
          exit "$rc"
      - name: shell smoke suite (152 checks, sandboxed)
        run: bash tests/smoke.sh | tee /tmp/smoke.out
      - name: job summary (coverage + counts)
        if: always()
        run: |
          {
            echo "### boost CI — ${{ matrix.os }} · py${{ matrix.python }}"
            echo ""
            if [ -f coverage.json ]; then
              PCT=$("$VENV_BIN/python" -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'],1))")
              echo "- **Coverage:** ${PCT}% (gate: 80%)"
            fi
            # 2>/dev/null because the file is absent in exactly the case this
            # step exists for: the test step failed, so smoke never ran. `||
            # true` already handles the status; this drops the misleading "No
            # such file" that would otherwise sit in the log of a failed run.
            SMOKE=$(grep -Eo '[0-9]+ passed, [0-9]+ failed' /tmp/smoke.out 2>/dev/null | tail -1 || true)
            # `if`, not `[ -n "$SMOKE" ] && echo ...`: this is the last command
            # of the group, the group is the last command of the step, and the
            # step runs under `bash -eo pipefail`. With no smoke line the
            # AND-list's status of 1 became the step's exit code — so a reporting
            # step marked `if: always()` failed on its own, precisely in the case
            # it exists for (an earlier step died before smoke.sh printed).
            if [ -n "$SMOKE" ]; then
              echo "- **Smoke suite:** ${SMOKE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: publish coverage badge
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && github.ref == 'refs/heads/main'
        run: |
          PCT=$("$VENV_BIN/python" -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          mkdir /tmp/badges && cd /tmp/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"brightgreen"}\n' "$PCT" > coverage.json
          git init -q -b badges
          git add coverage.json && git commit -qm "coverage ${PCT}%"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges:badges

  # The mutation gate runs ~10.5k mutants over boost_cli/core. As one job it took
  # ~26 minutes — three times the next-longest job in CI — so it alone decided how
  # long a pull request waited, and then how long the PyPI release waited behind
  # main's own run. The same gate, charged twice per change.
  #
  # It is now three jobs:
  #   mutation-scope   can the score have changed at all? (for 38% of this
  #                    repo's merged PRs — docs, roadmap cards, other workflows
  #                    — provably not)
  #   mutation-shard   six parallel slices of the mutant set. A file heavier
  #                    than an even share is split per top-level function
  #                    (mutant names are addressable that way), so store.py —
  #                    18% of all mutants — is no longer a floor of its own.
  #                    Each shard writes results for every file it touched;
  #                    the merge unions them and fails closed on any mutant
  #                    left unrun, so a partition gap reddens the gate rather
  #                    than quietly shrinking the denominator.
  #   mutation         THE REQUIRED CHECK: merges the slices and applies the gate.
  #
  # `mutation` is the context named in .github/required-checks.txt, so it must run
  # and report on every pull request. Neither path-filtering it nor letting
  # `needs:` skip it is acceptable — a required check that never reports leaves
  # branch protection waiting for a status that is never coming, which is exactly
  # how this repo has deadlocked before. Hence `if: always()`, plus an explicit
  # inspection of what the upstream jobs did: `always()` on its own would report a
  # failed shard as a green required check.
  mutation-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # need the base commit to diff against
          persist-credentials: false
      - name: can the mutation score have changed?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # Fail safe. With no usable base commit (a first push, a force push, a
          # shallow clone) we cannot prove the score is unchanged, so run the
          # whole gate. A wasted 26 minutes is a far better outcome than a gate
          # that quietly stopped gating.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base commit ('$BASE') — running the full gate"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: with rename detection on, `git diff --name-only`
          # reports only a move's DESTINATION, so moving boost_cli/core/x.py to
          # docs/x.py would look like a docs-only change and skip the gate.
          # core.quotepath=false: otherwise a non-ASCII path comes back
          # \ooo-escaped and would not match any prefix we test for.
          git -c core.quotepath=false diff --no-renames --name-only "$BASE" "$HEAD" > changed.txt
          echo "changed files:"
          sed 's/^/  /' changed.txt
          RELEVANT="$(python3 scripts/mutation_shards.py scope --changed changed.txt)"
          echo "mutation-relevant: $RELEVANT"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"

  mutation-shard:
    needs: mutation-scope
    if: needs.mutation-scope.outputs.relevant == 'true'
    # mutmut needs 3.11+; one representative environment keeps CI fast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      # The gate needs every slice's results, so cancelling the siblings when
      # one shard fails would only turn a single failure into six — and cost a
      # rerun of the whole matrix to learn anything.
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install test deps
        run: |
          python -m venv .venv
          # Hash-pinned; a superset of test-tools.txt plus mutmut. The mutant
          # kill count depends on the pytest/mutmut versions, so pinning them
          # is what keeps the 80% gate meaning the same thing run to run.
          .venv/bin/pip -q install -r requirements/mutation-tools.txt
          # sqlite-vec so dense.py's mutants are covered by the dense tests
          .venv/bin/pip -q install sqlite-vec || true
      - name: mutate shard ${{ matrix.index }} of 6
        env:
          SHARD: ${{ matrix.index }}
        run: |
          PATTERNS="$(python3 scripts/mutation_shards.py plan --shards 6 --index "$SHARD")"
          echo "shard $SHARD patterns: $PATTERNS"
          # `mutmut run` with no arguments runs EVERY mutant. An empty plan must
          # therefore run nothing at all, not silently become a full 26-minute
          # run in six places at once.
          if [ -z "$PATTERNS" ]; then
            echo "::error::shard $SHARD planned no patterns — refusing to run unfiltered"
            exit 1
          fi
          set +e
          set -f
          # The word split is deliberate: each pattern must reach mutmut as its
          # own argument. Globbing is off (set -f) so the shell cannot expand
          # them against the working tree first.
          # shellcheck disable=SC2086
          .venv/bin/mutmut run $PATTERNS
          rc=$?
          set -e
          set +f
          # mutmut reports surviving mutants with a non-zero status. Survivors
          # are the gate's business, not a shard's — only a genuine failure to
          # run should fail this job. (Matches scripts/mutation_gate.py.)
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "::error::mutmut run failed in shard $SHARD (rc=$rc)"
            exit 1
          fi
      - name: upload shard results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.index }}
          # Only the .meta results are needed downstream: `mutmut
          # export-cicd-stats` reads mutants/<path>.meta and never looks at the
          # generated mutant sources.
          path: mutants/boost_cli/core
          retention-days: 1
          if-no-files-found: error

  mutation:
    needs: [mutation-scope, mutation-shard]
    # Required check — see the comment above mutation-scope. This must run and
    # report even when every shard was skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: upstream jobs must be conclusive
        env:
          SCOPE: ${{ needs.mutation-scope.result }}
          SHARDS: ${{ needs.mutation-shard.result }}
          RELEVANT: ${{ needs.mutation-scope.outputs.relevant }}
        run: |
          echo "scope=$SCOPE shards=$SHARDS relevant=$RELEVANT"
          # `always()` means this job runs whatever happened upstream, so it has
          # to judge for itself. Without this step a failed or cancelled shard
          # would surface as a green required check.
          if [ "$SCOPE" != "success" ]; then
            echo "::error::mutation-scope did not succeed ($SCOPE) — cannot gate"
            exit 1
          fi
          if [ "$RELEVANT" = "true" ] && [ "$SHARDS" != "success" ]; then
            echo "::error::a mutation shard did not succeed ($SHARDS)"
            exit 1
          fi
      - name: nothing mutable changed
        if: needs.mutation-scope.outputs.relevant != 'true'
        run: |
          echo "No change under boost_cli/, tests/, or the mutation configuration,"
          echo "so the mutation score is identical to the base commit's."
          echo "- **Mutation:** skipped — no mutable code changed" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.mutation-scope.outputs.relevant == 'true'
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.mutation-scope.outputs.relevant == 'true'
        with:
          python-version: "3.14"
      - name: install mutmut (for export-cicd-stats)
        if: needs.mutation-scope.outputs.relevant == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -r requirements/mutation-tools.txt
      - name: download shard results
        if: needs.mutation-scope.outputs.relevant == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: shard-results
      - name: merge shard results
        if: needs.mutation-scope.outputs.relevant == 'true'
        # Refuses on a missing or half-finished shard rather than gating on a
        # partial result: mutmut counts an unrun mutant as "not checked" and the
        # gate divides by total, so silently accepting one would quietly lower
        # the score instead of failing.
        run: python3 scripts/mutation_shards.py merge --shards 6 --into mutants --source shard-results
      - name: mutation strength gate (>=80% killed)
        if: needs.mutation-scope.outputs.relevant == 'true'
        run: .venv/bin/python scripts/mutation_gate.py --min 80
      - name: refresh balance hints
        if: needs.mutation-scope.outputs.relevant == 'true'
        # Advisory only — scripts/mutation_weights.json is an optimisation, never
        # a correctness input, so this neither gates nor commits. It is uploaded
        # so a maintainer can drop a measured file in rather than hand-editing
        # one: real per-symbol mutant counts, and the per-file DURATIONS that let
        # the planner balance on time instead of count. `|| true` because a
        # balance hint is never worth failing a green gate over.
        run: python3 scripts/mutation_shards.py weights --source mutants || true
      - name: upload balance hints
        if: needs.mutation-scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-weights
          path: scripts/mutation_weights.json
          retention-days: 7
          if-no-files-found: warn

  install-smoke:
    # Every gate above runs an editable `pip install -e .`, which cannot catch a
    # broken artifact: missing package-data, a bad entry point, or an undeclared
    # runtime dependency only surface in the built wheel. A merge to main cuts a
    # PyPI release, so build the real wheel + sdist and install what a user gets.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build wheel + sdist
        run: |
          python -m pip -q install build
          python -m build
      - name: pip install the wheel into a fresh venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip -q install dist/*.whl
          # entry point resolves and setuptools-scm baked in a real version
          /tmp/clean/bin/boost --version | grep -Eq '^boost \S+$'
          # package-data shipped: the bundled registry catalog must load from the
          # installed wheel (data/registries.json), not the source tree
          /tmp/clean/bin/boost tap --catalog --dry-run --limit 1 | grep -Eq 'items \(dry run'
      - name: pipx install the wheel (isolated end-user install)
        run: |
          python -m pip -q install pipx
          pipx install dist/*.whl
          "$(pipx environment --value PIPX_BIN_DIR)/boost" --version | grep -Eq '^boost \S+$'

  patch-coverage:
    # Coverage on the CHANGED lines of a PR: the 93%+ project number can hide a
    # PR that adds wholly-untested code, so gate the diff itself. Self-hosted —
    # diff-cover reads a Cobertura coverage.xml the suite emits, no external
    # service. PR-only: there's nothing to diff a push to main against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # JOB-level, not step-level: a secret cannot be referenced directly in an
    # `if`, and only workflow/job-level env is reliably available to a step's own
    # `if` expression. Declaring it here is what makes the Codecov skip work.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history so origin/main is a real diff base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install test deps
        run: |
          python -m venv .venv
          # Hash-pinned; test-tools.txt plus diff-cover.
          .venv/bin/pip -q install -r requirements/coverage-tools.txt
          # [rag] extra so dense.py counts the same lines the matrix does
          .venv/bin/pip -q install sqlite-vec || true
      - name: suite -> Cobertura coverage.xml
        # --cov-fail-under=0: the project 80% gate is the matrix job's to own;
        # this job gates ONLY the patch. Same suite the matrix runs.
        run: .venv/bin/pytest tests/unit tests/functional --cov=boost_cli --cov-report=xml --cov-fail-under=0 -q
      - name: diff-cover (changed-line coverage vs main)
        # 80% of each PR's changed, coverable lines must be tested — pairs with
        # the project gate so new code can't ride in untested. Tune --fail-under
        # here. A diff with no Python lines passes (nothing to measure).
        run: |
          git fetch --no-tags origin main
          .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
      - name: upload to Codecov (optional)
        # The hosted counterpart to the diff-cover gate above: same coverage.xml,
        # but Codecov turns it into PR diff-coverage comments, a file sunburst and
        # a trend line over time. The gate stays local and authoritative —
        # codecov.yml sets informational: true, so Codecov never fails a build.
        #
        # Degrades to a no-op until someone adds CODECOV_TOKEN: `if` reads it via
        # the JOB-level env below (a secret is not usable directly in an `if`, and
        # only workflow/job-level env is reliably available to a step's own `if`),
        # so with no secret the step is skipped rather than failing.
        # continue-on-error as well, because a third-party uploader being down
        # must never redden boost's CI.
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          fail_ci_if_error: false

  canary:
    # Allow-failure early-warning leg on the free-threaded (no-GIL) CPython
    # build: a GIL-removal regression surfaces here before a user on 3.14t hits
    # it on release day. boost's runtime is stdlib-only, so this should stay
    # green; `continue-on-error` keeps a red canary from blocking the gate (and
    # the release) — it's a signal, not a required check. PR-only.
    name: canary (3.14t free-threaded)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: unit + functional on free-threaded 3.14
        # Plain pytest (no coverage gate) — this leg is a compatibility signal,
        # not the coverage/mutation gate. [rag] deps with no free-threaded wheel
        # importorskip themselves, exactly as on the main matrix.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install pytest pytest-cov coverage hypothesis
          .venv/bin/pip -q install -e .
          .venv/bin/pytest tests/unit tests/functional -q

  # The behave suite (tests/bdd — 11 features, 47 scenarios) ran nowhere in CI:
  # `make bdd` only ever executed if a contributor remembered to run it. Unlike
  # the eval and mutation gates, which degrade cleanly but still execute, this
  # one was invisible — so a CLI change that broke the step glue (output-string
  # matching, mocked shutil.which) could rot across any number of merges.
  #
  # Its own job rather than a step inside `tests`: the suite is platform- and
  # version-independent glue, so running it nine times across that matrix buys
  # nothing, and a dedicated check name is what makes it requireable through the
  # documented .github/required-checks.txt path instead of quietly turning an
  # existing required check into the gate for a second suite.
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity (fixture repos)
        # environment.py builds the shared fixture tap with make_fixture.py,
        # which commits — a runner has no default identity.
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install behave
        # Unlocked and installed from the [bdd] extra rather than added to
        # requirements/*.in: behave is an optional runtime extra declared in
        # pyproject, not part of the pinned gate toolchain — the same call the
        # `tests` job makes for the [rag] extra's sqlite-vec.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[bdd]'
      - name: behave (11 features, 47 scenarios)
        # Every scenario sandboxes its own $HOME in environment.py, so this
        # touches no real agent config. --no-capture-stderr keeps a failing
        # step's own diagnostics in the log next to the scenario that failed.
        run: .venv/bin/behave tests/bdd/features --no-capture-stderr

  onnx-inference:
    # The only job that runs the real ONNX graph. Every other leg installs just
    # `sqlite-vec` from the [rag] extra, so since the local embedder shipped
    # nothing in CI has loaded the actual weights — the stubbed suite declares
    # its own tensor shapes, which is right for what it tests and blind to
    # whether onnxruntime accepts this export at all.
    #
    # One leg, not the matrix: onnxruntime has no free-threaded 3.14t wheel and
    # the value here is the model contract, which is platform-independent. The
    # matrix keeps testing that a machine WITHOUT the extra degrades cleanly,
    # which is the more common user state.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: read the pinned model revision
        # Read from localembed.py rather than duplicated here: MODEL_REV is what
        # keys the on-disk cache, so a hard-coded key would silently serve stale
        # weights for a new revision — the one cache bug that would make this
        # job pass against the wrong model.
        id: rev
        run: |
          rev=$(python -c "from boost_cli.core import localembed; print(localembed.MODEL_REV)")
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: cache the pinned BGE weights (133 MB)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.boost-home/cache/models
          # Revision-keyed, so bumping MODEL_REV misses the cache and refetches
          # instead of reusing the old graph under a new name.
          key: bge-weights-${{ steps.rev.outputs.rev }}
      - name: install the [rag] extra in full
        # Unlocked and best-effort in spirit like the other extras, but NOT
        # `|| true` here: this job exists to run inference, so a failed install
        # must fail loudly rather than skip into a green tick.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[rag]'
          .venv/bin/pip -q install -r requirements/test-tools.txt
      - name: real-weights inference contract
        # BOOST_HOME redirects the model cache into the workspace so the cache
        # action can see it; BOOST_ONNX_E2E is the opt-in the test module gates
        # on, so this is the only place the 133 MB download is ever paid for.
        #
        # The skip check matters more than it looks. Every guard in that module
        # — missing extra, failed download — degrades to *skip* by design, and a
        # fully-skipped pytest run exits 0. So the job would report green in
        # precisely the circumstances it exists to catch. Run once, then read
        # the summary: passes required, skips fatal.
        env:
          BOOST_HOME: ${{ github.workspace }}/.boost-home
          BOOST_ONNX_E2E: "1"
        run: |
          set -o pipefail
          .venv/bin/pytest tests/unit/test_localembed_e2e.py -v --no-header \
            | tee onnx-result.txt
          if grep -qE '[0-9]+ skipped' onnx-result.txt; then
            echo "::error::inference tests skipped — the [rag] extra or the pinned weights never loaded, so this job proved nothing"
            exit 1
          fi
          grep -qE '[0-9]+ passed' onnx-result.txt

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Run the full gate against each queued merge combination when the GitHub
  # merge queue is enabled, so two independently-green PRs can't land a broken
  # combination. merge_group runs on a gh-readonly-queue/* ref (not main), so it
  # never triggers the release workflow — publish still fires only on the real
  # push to main. Enabling the queue itself is a repo Setting (see CONTRIBUTING).
  merge_group:
  # The whole-codebase mutation run. A pull request's gate is moving to the
  # functions it changed, and a push to main whose tree a green PR run already
  # tested skips the suite and the shards (`proven` below), so this is where
  # the whole of boost_cli/core is still scored against 80%: the mutation jobs
  # only, always the full 24-shard plan. 09:30 UTC is clear of the 04:00-08:00
  # weekly crons and the `shards` bursts. A red or missing nightly turns the
  # proven-tree skip off (scripts/ci_proven_tree.py), and ci-failure-issue.yml
  # already watches `ci`, so a red one opens the tracking issue.
  # publish.yml ignores both events: it releases only from a `push` run.
  schedule:
    - cron: "30 9 * * *"
  # The same run by hand, e.g. to clear a red nightly without waiting a day.
  workflow_dispatch:

# Least-privilege default for any job that doesn't declare its own block. Every
# job below currently does — and a job-level block REPLACES this one rather than
# merging with it — so this changes no job's effective token today. It is the
# floor for the next job someone adds, and it satisfies Scorecard's
# TokenPermissions check, which scores a workflow 0 for having no top-level
# default at all.
permissions:
  contents: read

# Cancel a pull request's previous run when a new push supersedes it, and NEVER
# cancel anything else.
#
# Measured over six consecutive successful runs, 31% of all job time here was
# spent queueing rather than executing — 104 job-minutes against 236 — and the
# median per-job queue swung 29x between runs (0.1 min when the repo was quiet,
# 2.9 min with a dozen loop/* branches and Dependabot PRs live). The cost is
# driven by how much runner footprint is in flight at once, not by the change
# under test, and sharding the mutation gate traded one runner slot for six.
# This was the only workflow in the repo with no concurrency group at all, so
# every superseded push left ~36 checks — six of them mutation shards — running
# to completion against a commit nobody was waiting on any more.
#
# Two things keep the release path out of it, and both matter.
#
# The condition: `cancel-in-progress: true` would also cancel a push to main,
# which publish.yml gates the release on via workflow_run — a merge that
# silently never ships — and a merge_group run, where a cancelled run never
# reports its required contexts and the queue then waits on a status that is
# never coming, the deadlock the comments further down this file describe.
#
# The KEY: non-PR events group on `github.sha`, not `github.ref`. Keying main on
# its ref would put every main push in one group, and `cancel-in-progress:
# false` does not mean "never cancel" — it means a newer run waits, and GitHub
# cancels the older *pending* run when a third arrives. Three quick merges would
# then leave a main commit whose ci never completes, so workflow_run never fires
# and that commit never releases. A sha is unique per commit, so main and the
# merge queue simply never share a group.
#
# The EVENT is in the key too. A nightly runs on main's tip, which is usually
# the sha the last push ran on, and keyed on the sha alone the two would share
# a group: a release run would wait behind a two-hour whole-codebase run, and
# a dispatch arriving third would cancel whichever was pending. Per event, a
# push only ever queues behind a push of the same commit, which never happens.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# WHICH JOB RUNS ON WHICH EVENT. A nightly or a dispatch is the whole-codebase
# mutation run and nothing else, so every job outside mutation-plan,
# mutation-shard and mutation carries `github.event_name != 'schedule' &&
# github.event_name != 'workflow_dispatch'`, or is pull_request-only already.
# On a push to main, `proven` decides whether the suite, the shards and the
# coverage collection have already been done by the PR run; lint (with
# zizmor), evals, install-smoke, bdd and onnx-inference run regardless.
#
# A job that needs `proven` says `!cancelled()`, never the implicit
# `success()`: `proven` is SKIPPED on every pull request, a job whose need was
# skipped is skipped with it, and a skipped required check reads as passing.
# That implicit `success()` also looks past the direct needs at every
# ancestor (actions/runner#491), so mutation-shard, two levels down, says it
# too. tests/unit/test_ci_proven_tree.py evaluates every job's `if:` for each
# event and fails on a job that runs, or is skipped, where its table says not.
jobs:
  lint:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install linters
        # Hash-pinned (requirements/lint-tools.txt, generated from the .in by
        # scripts/lock_toolchain.py) so an upstream linter release can't
        # retroactively redden the gate — see that file's header. pip enforces
        # every sha256, so a yanked or tampered transitive dependency fails the
        # install instead of silently changing what the gate checks.
        run: python -m pip -q install -r requirements/lint-tools.txt
      - name: ruff
        # scripts/ is in scope on purpose: the 28 build-and-gate tools decide
        # whether every PR merges, and leaving them unlinted is how two
        # unguarded zip() sites survived the B905 audit (see the
        # scripts-under-the-lint-gate roadmap card).
        run: ruff check boost_cli boost_langchain tests evals scripts
      - name: mypy
        run: mypy
      - name: pyright (second type checker)
        # Independent inference over boost_cli/core — catches the None-flow and
        # narrowing bugs mypy's config lets slide (it found the `"taps": null`
        # crash in registry.list_taps()). Config: [tool.pyright] in pyproject.
        run: pyright
      - name: layering (import-linter)
        # Enforce the architecture contract: core/ (the engine) imports neither
        # commands/ nor the CLI; commands/ never reaches up into cli. Config +
        # the one allowlisted edge live in pyproject.toml [tool.importlinter].
        run: lint-imports
      - name: dead-code radar (vulture)
        # Flag unused imports / unreachable code. min-confidence 80 excludes the
        # dynamically-dispatched cmd_* functions (called via importlib in cli.py),
        # so a finding is a real dead-code smell, not a false positive.
        run: vulture boost_cli --min-confidence 80
      - name: complexity radar (xenon)
        # Ratchet cyclomatic complexity: passes today (average is B) and fails if
        # the codebase's aggregate complexity regresses. Individual grandfathered
        # blocks are allowed up to F; a module or the average degrading is not.
        run: xenon --max-absolute F --max-modules E --max-average B boost_cli
      - name: docstring coverage (interrogate)
        # core/ is the contract-heavy engine; hold its docstring floor at 90%
        # (98.5% when this landed) so new public functions ship documented.
        # Flags/carve-outs: [tool.interrogate] in pyproject.
        run: interrogate boost_cli/core
      - name: modernization smells (refurb)
        # refurb's mypy-backed FURB checks catch the dated idioms ruff's ported
        # subset misses — try/except/pass that wants contextlib.suppress,
        # redundant list()/dict()/str() casts, `x or ""` on an already
        # non-optional value. ruff carries the pyupgrade (UP) half of this gate;
        # the PEP 585/604 rules are enforced since the pep585-604 sweep landed
        # (typing.List and friends are gone). UP031 stays declined — printf
        # formatting is house style (rationale in pyproject.toml [tool.ruff.lint]).
        run: refurb boost_cli
      - name: codespell (user-facing text)
        run: codespell boost_cli boost_langchain docs README.md
      - name: secret scan (gitleaks)
        # Scan the full history + working tree for leaked tokens, keys and
        # high-entropy secrets before they can reach a release. boost's own
        # synthetic secret-scanner fixtures are allowlisted in .gitleaks.toml;
        # everything else is scanned against the upstream default ruleset. The
        # binary is pinned; the lint checkout is fetch-depth: 0, so the whole
        # history is present to scan.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml
      - name: actionlint (workflow linting + shellcheck)
        # The release is fully automated across every workflow file — a malformed
        # ${{ }} expression or a bug in a run: block is a broken publish. Pin the
        # binary.
        #
        # actionlint does not lint run: blocks itself: it shells out to
        # shellcheck, and when shellcheck is absent it skips them and still
        # exits 0. This step used to rely on the runner image happening to
        # preinstall it — an unpinned, unversioned dependency on somebody
        # else's base image, silently revocable, whose removal would look
        # exactly like a passing lint. shellcheck now comes from
        # requirements/lint-tools.txt (installed above, hash-pinned), so assert
        # it is there rather than assume it.
        run: |
          command -v shellcheck
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz | tar xz actionlint
          ./actionlint -color
      - name: workflow SAST (zizmor)
        # boost's workflows embed github-script JS/shell and drive a Trusted-
        # Publisher release — zizmor statically flags template injection,
        # unpinned actions, over-broad GITHUB_TOKEN permissions and dangerous
        # triggers. Accepted findings are documented in .github/zizmor.yml.
        env:
          GH_TOKEN: ${{ github.token }}
        # 1.27.0 was YANKED from PyPI for GHSA-f42p-wjw5-97qh; 1.28.0 is
        # the fix. Nothing in CI would have caught it: zizmor is invoked
        # through `pipx run` inside this step, so it is in no lock file,
        # pip-audit never resolves it and Dependabot never sees it. Every
        # `pipx run`/`npx` pin in .github/workflows/ has that same blind
        # spot — Scorecard's PinnedDependencies hits are about exactly
        # these invocations.
        run: pipx run zizmor==1.28.0 .github/workflows
      - name: registries.json is regenerated
        run: python scripts/build_registries.py --check
      - name: roadmap HTML is regenerated
        run: python scripts/build_roadmap.py --check
      - name: toolchain lock is regenerated
        # The hash-pinned requirements/*.txt are generated from the *.in files;
        # a stale lock means CI is installing something nobody declared. Needs
        # uv (the resolver) and the network, like the eval corpus step.
        run: |
          python -m pip -q install uv
          python scripts/lock_toolchain.py --check
      - name: accessibility gate (WCAG 2.1 AA)
        # Structural WCAG failures decidable from the markup (lang, alt, link and
        # button names, duplicate ids, heading order) plus the 1.4.3 contrast
        # ratios computed from the Aurora tokens themselves. Pure stdlib, so it
        # runs here rather than needing Node/Chrome; the axe-core sweep in
        # tests/visual covers what needs a live DOM.
        run: python scripts/a11y_check.py -v
      # Page-weight budget. `lighthouse` is NOT a required check, which is how
      # roadmap.html shipped two of three runs under its own perf floor on main
      # without anyone noticing. This cannot replace it — measured, a 33% cut in
      # laid-out body text moved that score by 0.00, so markup size is not a
      # predictor — but it is required, deterministic and pure stdlib, and it
      # turns "the board only grows" into a number printed on every run and a
      # ceiling that has to be raised on purpose.
      - name: page-weight budget (markup, DOM size, nesting)
        run: python scripts/page_budget.py -v
      - name: golden set is regenerated
        # evals/golden_set.json is generated from evals/make_golden.py's query
        # table and validated against the generated corpus, so a judgment can
        # never cite a skill the corpus does not contain.
        run: python evals/make_golden.py --check
      - name: command reference is regenerated
        # docs/commands.html is generated from the CLI's own COMMANDS + argparse
        # parsers, so it can't drift from the code. The script imports boost_cli
        # via a sys.path shim (no editable install needed, like the eval gate).
        run: python scripts/build_command_reference.py --check
      - name: VEX document is regenerated
        # docs/vex/openvex.json is generated from docs/vex/statements/*.md
        # (OSPS-VM-04.02); same shape as the roadmap/registries/command-
        # reference checks above.
        run: python scripts/build_vex.py --check
      # Startup import-time budget: a lazy-import guard. For a CLI, cold-start
      # latency is the UX; this asserts the heavy/optional stack (sqlite_vec,
      # embedding/AI SDKs, scientific-python, boost's dense/embed engines)
      # never loads for common offline commands. Name-based, so it's
      # deterministic across runners/Python versions — never timing-flaky.
      - name: startup import-time budget (lazy-import guard)
        run: python scripts/import_budget.py --list
      # Performance-regression gate: complexity scaling, not wall-clock
      # baselines. Times scan/BM25-build/retrieve at 64 vs 512 synthetic items
      # and fails when the big/small ratio exceeds 3x-of-linear — an O(n²)
      # slip lands at ~64x and is caught decisively, while runner speed
      # cancels out of the ratio. Pure stdlib, same PYTHONPATH shim as eval.
      - name: perf gate (scaling ratios)
        run: PYTHONPATH=. python scripts/perf_gate.py -v
      # Tier 1 retrieval quality gate: golden-set retrieval over a PINNED corpus.
      # The golden set grades real catalog items by name, so the repos holding
      # them (tests/eval/taps.txt) are tapped first and checked out at the commit
      # each row pins — deterministic given that set (pure-stdlib BM25; no
      # ANTHROPIC_API_KEY). Regression-vs-baseline stays relaxed
      # (--regression-eps 1); the absolute floors are the real gate.
      #
      # THE eval_retrieval.py CALL MUST MATCH `make eval`, flag for flag.
      # tests/unit/test_eval_corpus.py parses both with the script's own parser
      # and fails the build on any difference. Its first version compared the
      # floor values alone, so a -k 5 here turned this check red (recall@k
      # 0.841 -> 0.742 against 0.78) with that test still green. Before that
      # the floors themselves had drifted: this step floored recall alone at
      # 0.85, against a measured 0.863 — a buffer of 1.15 queries out of 91 —
      # and floored nothing else, not even the metrics that exist to catch a
      # ranker that finds the answer every time and never ranks it first.
      # PYTHONPATH=. makes boost_cli importable without an editable install.
      #
      # THE CLONES ARE CACHED, and it is availability this buys, not speed.
      # `ensure_eval_corpus.sh` runs under `set -euo pipefail` in this required
      # job, so one of twenty personal repositories being deleted, renamed or
      # made private reddens EVERY open pull request at once, on changes with
      # nothing to do with retrieval. A cache hit is a corpus that no longer
      # needs those repositories to still exist.
      #
      # Only `repos/` and `config.json` — third-party bytes fixed by the SHA in
      # taps.txt, and the list of which repo is where. Everything this project
      # derives (the per-tap catalog JSON, the BM25 index) is deliberately left
      # out and rebuilt every run, so a cache can never answer for code that has
      # since changed. FORCE=1 says the same thing about the sentinel: it is not
      # cached, and even if a later edit to these paths let it in, the corpus
      # would still be re-pinned and re-counted rather than trusted.
      #
      # Keyed on the tap list's content, with NO restore-keys on purpose. A
      # near-miss restore would hand this job a corpus built for a different
      # taps.txt, carrying taps this file no longer pins — and the index is
      # built from every configured tap, so those extra entries would be scored
      # as if they were the pinned corpus. An exact key or nothing.
      - name: restore the pinned eval corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.eval-home/repos
            ${{ github.workspace }}/.eval-home/config.json
          key: eval-corpus-${{ hashFiles('tests/eval/taps.txt') }}
      - name: retrieval quality gate (Tier 1 golden set)
        env:
          # The scratch home `make eval` uses, so the cached path and the
          # documented one are one thing.
          BOOST_HOME: ${{ github.workspace }}/.eval-home
        run: |
          FORCE=1 bash scripts/ensure_eval_corpus.sh
          PYTHONPATH=. python scripts/eval_retrieval.py --build -k 10 \
            --fail-under 0.78 --floor hit@1=0.40 --floor MRR=0.52 --floor nDCG@k=0.58 \
            --regression-eps 1
      # Save explicitly rather than with the combined action, so a corpus that
      # failed to materialise or failed its counts is never the thing a later
      # run restores. The key is content-addressed, so a bad entry under it
      # would persist the failure instead of retrying it.
      - name: cache the pinned eval corpus
        if: success() && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.eval-home/repos
            ${{ github.workspace }}/.eval-home/config.json
          key: eval-corpus-${{ hashFiles('tests/eval/taps.txt') }}
      # The natural-language set over the same corpus: `make eval-natural`,
      # flag for flag (tests/unit/test_eval_corpus.py). Advisory, so a red
      # here marks the step and not the job — its hit@1 floor has one query
      # of slack out of 50, too thin for a required check the monthly refresh
      # can move. Before this step nothing in the repository ran the set at
      # all. Placed after the cache save, so it can never decide what is
      # cached; --build again because the target has to work on its own.
      - name: natural-language retrieval set (advisory)
        continue-on-error: true
        env:
          BOOST_HOME: ${{ github.workspace }}/.eval-home
        run: |
          PYTHONPATH=. python scripts/eval_retrieval.py --build -k 10 \
            --golden tests/eval/golden-natural.jsonl --fail-under 0.32 \
            --floor hit@1=0.14 --floor MRR=0.21 --floor nDCG@k=0.23

  evals:
    # Evaluation-harness gate: recall@5/@10, MRR, nDCG@5/@10 with graded (3/2/1)
    # relevance over the hermetic golden set, plus a paired-bootstrap regression
    # test against the committed evals/baseline.json. Deliberately its own job
    # rather than a step in `lint`: unlike the Tier 1 gate there, it needs NO
    # network and NO API key — it generates its own corpus and taps it into a
    # disposable BOOST_HOME — so it must stay green even when GitHub is having a
    # bad day. Pure stdlib; nothing to install beyond Python and git.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Measured well under a minute (corpus + BM25 index + 36 queries x 2 engines
    # + a 10k-resample bootstrap, all stdlib); 15 is slack for a cold runner.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: evaluation harness gate (floors + significance)
        run: python scripts/eval_gate.py --run

  # Is this push to main a tree CI has already proven? In 17 of the last 17
  # merges the merge commit's tree was byte-identical to a PR head whose `ci`
  # run was green, and main ran the whole suite and every shard again before
  # publish.yml could release. scripts/ci_proven_tree.py answers yes only when
  # that tree equality holds, the PR head's own first-attempt pull_request run
  # succeeded, and the newest nightly on main is green and under 48 h old; any
  # missing fact, API error or rate limit is `skip=false`. It always exits 0,
  # so its outputs are the verdict -- and if the job fails anyway they are
  # empty, which every consumer below reads as "run everything".
  #
  # Push only. On every other event this job is skipped, which is why the
  # jobs that need it say `!cancelled()` (see the note above `lint`).
  proven:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # A handful of API calls with their own timeouts; `tests` waits on this.
    timeout-minutes: 5
    permissions:
      contents: read        # the checkout that carries the script
      actions: read         # the PR head's ci runs, and the nightly's
      pull-requests: read   # the PRs associated with this commit
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      pr_run_id: ${{ steps.decide.outputs.pr_run_id }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: did a green PR run already test this tree?
        id: decide
        # Stdlib only, so the runner's python3 is enough: no setup-python, no
        # install, nothing between the push and the verdict `tests` waits on.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_proven_tree.py --sha "$GITHUB_SHA"

  tests:
    needs: proven
    # Skipped only on an explicit `skip == 'true'`: a pull request (proven
    # skipped, output empty) and a push whose proven job failed (empty again)
    # both test. Never on a nightly or a dispatch, which are mutation only.
    if: ${{ !cancelled() && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && needs.proven.outputs.skip != 'true' }}
    runs-on: ${{ matrix.os }}
    # One cap for nine cells was one cap for three very different machines.
    # Over 40 ci runs (every attempt, 2026-09-28) the per-cell medians were
    # ubuntu 4.0-5.8 min, macOS 7.4-8.8, Windows 19.3-20.7; measured against
    # the slowest run of each OS that still passed (7.9 / 10.3 / 24.6), a flat
    # 30 left Linux 22.1 minutes of headroom, macOS 19.7 and Windows 5.4.
    # windows-3.14 ran out of it twice in one morning — run 36399947619 job
    # 108855169521 at 30.4 min, and run 36408455593 job 108882688603 at 30.3 —
    # and both logs say the job was still working rather than wedged: pytest
    # printed 11 more results in the 7 s, and 33 more in the 39 s, between its
    # last `99%` row and the cancel. The second was main's own run, so it also
    # held back the release `publish.yml` fires on a *successful* ci. Widening
    # all nine would have bought that at the price of the bound: a genuinely
    # wedged Linux job is the case a timeout exists for, and still dies in 30.
    # `startsWith` rather than `== 'windows-latest'` because the condition and
    # the `os:` list below are otherwise related only by spelling: pin that
    # list to a dated label such as windows-2025 and the equality matches
    # nothing, handing all nine cells 30 again without failing anything.
    # 45 ran out too, at a 15k-test suite: on 2026-10-21 windows-3.12 took
    # 44.9 min to pass (run 39525721662) and was cancelled at 45.3 on main
    # (run 39539922832) with no test wedged, while 3.14 on the same commit
    # took 28.6 — runner variance, not one slow test. 60 restores headroom.
    # 60 ran out at a 17.5k-test suite: on 2026-10-23 windows-3.12 printed its
    # `100%` row at 58 min and was cancelled at 60.5 on two attempts (run
    # 39915231006), while 3.13 on the same commit passed in 40.
    # macOS then ran out of 30 at the same suite: on 2026-10-23 macos-3.13
    # passed in 28.0 and macos-3.12 was cancelled at 30.0 (run 40037733470),
    # passing on rerun. So the condition names the one OS that keeps 30 —
    # Linux, the 12.7-18.3 min cells — and macOS shares Windows' cap.
    timeout-minutes: ${{ startsWith(matrix.os, 'ubuntu') && 30 || 80 }}
    # The 3.15 cells are advisory (see the matrix comment): a red one must not
    # fail the ci run, because publish.yml releases only on its `success`.
    continue-on-error: ${{ matrix.python == '3.15' }}
    # Read only: the badge push moved to `coverage-badge`, so twelve cells no
    # longer hold a token that can write the repository for one cell's step.
    permissions:
      contents: read
    defaults:
      run:
        # Windows' default runner shell is pwsh; Git for Windows ships a bash
        # on PATH, so pin bash everywhere and keep one script per step.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # floor, middle, ceiling — same shape as before, shifted by the >=3.12
        # floor. 3.13 is the middle rather than a second point near the edge.
        # 3.15 added 2026-10-28, when Homebrew's python3 became 3.15 and took
        # 3.14 away: it is now the interpreter a new user's pipx picks. Its
        # cells are a compatibility signal, not a gate, on both edges: NOT in
        # .github/required-checks.txt (no merge block), and job-level
        # `continue-on-error` above (no release block — publish.yml fires on
        # a *successful* ci run, and one red cell fails the run, as the
        # cancelled windows-3.14 cell recorded above once did). Nothing here
        # needs onnxruntime (this job installs sqlite-vec alone; the onnx
        # tests skip without the runtime), whose missing cp315 wheel is what
        # pyproject's [rag] marker is for. requirements/test-tools.txt has
        # cp315 wheels for coverage and pyyaml's sdist hash, so the hashed
        # install builds on this leg.
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'   # harden-runner is Linux-only
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: venv bin dir (Windows uses Scripts/, not bin/)
        run: echo "VENV_BIN=.venv/$( [ "$RUNNER_OS" = Windows ] && echo Scripts || echo bin )" >> "$GITHUB_ENV"
      - name: install test deps
        run: |
          python -m venv .venv
          # Hash-pinned (requirements/test-tools.txt, generated by
          # scripts/lock_toolchain.py). Resolved universally from the >=3.12
          # floor, so this ONE file covers every leg of this matrix. The
          # dual markered pins that used to give 3.9 an older release of
          # attrs/coverage/hypothesis/iniconfig/pytest/typing-extensions
          # collapse to one pin each now that nothing below 3.12 resolves.
          # hypothesis powers the property-based parser tests.
          "$VENV_BIN/pip" -q install -r requirements/test-tools.txt
          # [rag] extra so the opt-in dense backend is exercised (py3-none
          # wheel; falls back to importorskip if a platform lacks it). Left
          # unlocked and best-effort: it is an optional runtime extra, not part
          # of the toolchain, and some matrix legs have no wheel for it.
          "$VENV_BIN/pip" -q install sqlite-vec || true
      - name: unit + functional (90% coverage gate, ubuntu-3.12 only)
        # Every failing test is re-emitted as a `::error::` workflow command so
        # it lands as a check-run annotation. The step conclusion already says
        # WHICH STEP broke; the annotation is what says WHICH TEST. Without it
        # the only place that answer exists is the raw job log, which is not
        # reachable from every environment (it redirects to blob storage that
        # egress policies and proxies routinely block) — and "the suite failed
        # somewhere" costs a whole CI round-trip to narrow down.
        #
        # `shell: bash` on this job already means `-eo pipefail`, so the pipe
        # into tee reports pytest's status rather than tee's; `|| rc=$?` is what
        # keeps -e from killing the step before the annotations are emitted.
        # set -o pipefail is restated anyway so this does not silently become a
        # green step if the job's shell: is ever changed.
        #
        # `-n auto` (pytest-xdist) in every cell, and coverage in ONE cell.
        # Every cell used to trace the whole suite, and then patch-coverage ran
        # it a thirteenth time only to write the coverage.xml the ubuntu-3.12
        # cell had just discarded. Tracing is what Windows paid for most, and
        # Windows was the critical path (the 80 min cap above). So
        # ubuntu-3.12 alone measures — and alone enforces `fail_under`, which
        # pytest-cov applies only under `--cov` — and publishes the report as
        # the `coverage-report` artifact patch-coverage downloads. The cell is
        # chosen in `env:` rather than by a matrix expression in the script, so
        # the upload step's `if:` below can say the same thing the same way.
        # `-n` lives here and never in pyproject's addopts: mutmut drives the
        # same pytest and must keep one process
        # (tests/unit/test_ci_coverage_single_cell.py pins both).
        env:
          MEASURE_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          set -o pipefail
          rc=0
          cov=()
          if [ "$MEASURE_COVERAGE" = true ]; then
            cov=(--cov=boost_cli --cov-report=term-missing --cov-report=json --cov-report=xml)
          fi
          "$VENV_BIN/pytest" tests/unit tests/functional -n auto "${cov[@]}" -q \
            | tee /tmp/pytest.out || rc=$?
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | sed 's/^/::error::/' || true
          exit "$rc"
      - name: publish coverage report (for patch-coverage and the badge)
        # Default `success()` on purpose, never `always()`: a red suite must
        # leave NO artifact, so patch-coverage fails on the missing download
        # instead of gating a diff against a half-run suite's report. The
        # 14 days are also how long a proven push on main can still read a
        # PR run's report for the badge (see `coverage-badge`).
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
          retention-days: 14
      - name: shell smoke suite (sandboxed)
        run: bash tests/smoke.sh | tee /tmp/smoke.out
      - name: job summary (coverage + counts)
        if: always()
        run: |
          {
            echo "### boost CI — ${{ matrix.os }} · py${{ matrix.python }}"
            echo ""
            if [ -f coverage.json ]; then
              PCT=$("$VENV_BIN/python" -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered'],1))")
              # The gate is READ, never restated: this line said 80% while
              # pyproject.toml said 90, so a run at 90.4% read as comfortably
              # clear when it was four tenths of a point from red. The summary
              # is where the number is read without opening the log.
              # `|| GATE='?'` because this step reports, it does not gate:
              # the job runs `shell: bash`, so a failed command substitution
              # in an assignment exits under `set -e` and reddens a green
              # suite. The matrix job owns the actual threshold.
              GATE=$("$VENV_BIN/python" -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['tool']['coverage']['report']['fail_under'])") || GATE='?'
              echo "- **Coverage:** ${PCT}% (gate: ${GATE}%)"
            fi
            # 2>/dev/null because the file is absent in exactly the case this
            # step exists for: the test step failed, so smoke never ran. `||
            # true` already handles the status; this drops the misleading "No
            # such file" that would otherwise sit in the log of a failed run.
            SMOKE=$(grep -Eo '[0-9]+ passed, [0-9]+ failed' /tmp/smoke.out 2>/dev/null | tail -1 || true)
            # `if`, not `[ -n "$SMOKE" ] && echo ...`: this is the last command
            # of the group, the group is the last command of the step, and the
            # step runs under `bash -eo pipefail`. With no smoke line the
            # AND-list's status of 1 became the step's exit code — so a reporting
            # step marked `if: always()` failed on its own, precisely in the case
            # it exists for (an earlier step died before smoke.sh printed).
            if [ -n "$SMOKE" ]; then
              echo "- **Smoke suite:** ${SMOKE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The README's coverage badge: a one-file orphan `badges` branch, force-
  # pushed from main. This was the last step of the ubuntu-3.12 `tests` cell,
  # which put `contents: write` on all twelve cells and stops existing on a
  # proven push, when the suite is skipped. So it is its own job, the only one
  # in this workflow that can write, and it reads the `coverage-report`
  # artifact from wherever the suite last ran on this tree: this run, or the
  # PR run `proven` names (same tree, so the same number).
  #
  # `always()` so it runs on a proven push, where `tests` is skipped -- and
  # therefore it judges for itself, first: this run's suite succeeded, or the
  # suite was skipped because `proven` said so and named a run. Anything else
  # (a red or cancelled suite, a failed `proven`) is a red job, never a green
  # badge-less one, and so is a missing artifact: no continue-on-error. That
  # keeps today's exposure, where a failed badge push reddened the tests cell
  # and held the release, and adds one case: a PR run whose 14-day artifact
  # has expired. See the task report before relaxing it.
  coverage-badge:
    needs: [proven, tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # force-push the badges branch
      actions: read     # download coverage-report from the proving PR run
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: which run measured this tree
        id: source
        env:
          TESTS: ${{ needs.tests.result }}
          SKIP: ${{ needs.proven.outputs.skip }}
          PR_RUN_ID: ${{ needs.proven.outputs.pr_run_id }}
        run: |
          if [ "$TESTS" = success ] && [ "$SKIP" != true ]; then
            echo "from=this" >> "$GITHUB_OUTPUT"
          elif [ "$TESTS" = skipped ] && [ "$SKIP" = true ] && [ -n "$PR_RUN_ID" ]; then
            echo "coverage from PR run $PR_RUN_ID, which tested this exact tree"
            echo "from=pr" >> "$GITHUB_OUTPUT"
          else
            echo "::error::no coverage to publish: tests '$TESTS', proven skip '$SKIP', PR run '$PR_RUN_ID'"
            exit 1
          fi
      - name: coverage-report from this run
        if: steps.source.outputs.from == 'this'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
      # The same pin mutation-weights-refresh.yml downloads another run's
      # artifact with; `run-id` needs `github-token` (and `actions: read`).
      - name: coverage-report from the proving PR run
        if: steps.source.outputs.from == 'pr'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          run-id: ${{ needs.proven.outputs.pr_run_id }}
          github-token: ${{ github.token }}
      - name: publish coverage badge
        # Moved from the tests cell. Same badge, same branch, same force-push;
        # the token and repository arrive through env (zizmor's template-
        # injection rule), python3 replaces the cell's venv, and the job sets
        # its own git identity because no `git identity` step ran here.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          PCT=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          mkdir "$RUNNER_TEMP/badges" && cd "$RUNNER_TEMP/badges"
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"brightgreen"}\n' "$PCT" > coverage.json
          git init -q -b badges
          git config user.email ci@boost.test
          git config user.name "Boost CI"
          git add coverage.json && git commit -qm "coverage ${PCT}%"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${REPO}" badges:badges

  # The mutation gate runs ~10.5k mutants over boost_cli/core. As one job it took
  # ~26 minutes — three times the next-longest job in CI — so it alone decided how
  # long a pull request waited, and then how long the PyPI release waited behind
  # main's own run. The same gate, charged twice per change.
  #
  # It is now three jobs:
  #   mutation-plan    can the score have changed at all? (for 38% of this
  #                    repo's merged PRs — docs, roadmap cards, other workflows
  #                    — provably not) If so, collect mutmut's test-to-function
  #                    stats ONCE and write the plan the shards run from
  #                    (scripts/mutation_plan.py).
  #   mutation-shard   twenty-four parallel slices of the mutant set. A file heavier
  #                    than an even share is split per top-level function
  #                    (mutant names are addressable that way), so store.py —
  #                    18% of all mutants — is no longer a floor of its own.
  #                    Each shard writes results for every file it touched;
  #                    the merge unions them and fails closed on any mutant
  #                    left unrun, so a partition gap reddens the gate rather
  #                    than quietly shrinking the denominator.
  #   mutation         THE REQUIRED CHECK: merges the slices and applies the gate.
  #
  # Shadow mode: on a pull request or merge-queue entry the plan also carries a
  # diff set (the changed functions and their direct callers), sharded in the
  # same matrix. The full run still decides `mutation`; the diff set's verdict
  # and per-mutant results are compared against it in an advisory step, until
  # enough runs agree for the diff gate to bind.
  #
  # By event: a push to main that `proven` vouches for plans `none` with the
  # reason "proven by PR run <id>" and collects no stats, so no shard starts
  # and `mutation` reports the planner's reason; any other push plans full. A
  # nightly or a dispatch plans full, always: with pushes able to skip, that
  # run is where the whole codebase is held to 80%, and with an unproven push
  # it is the only full run whose `mutation-weights` the refresh workflow takes.
  #
  # `mutation` is the context named in .github/required-checks.txt, so it must run
  # and report on every pull request. Neither path-filtering it nor letting
  # `needs:` skip it is acceptable — a required check that never reports leaves
  # branch protection waiting for a status that is never coming, which is exactly
  # how this repo has deadlocked before. Hence `if: always()`, plus an explicit
  # inspection of what the upstream jobs did: `always()` on its own would report a
  # failed shard as a green required check.
  mutation-plan:
    needs: proven
    # Every event, including the ones where `proven` is skipped (all but
    # push) or failed (empty outputs, so the plan is decided as before).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # The scope check takes seconds. A relevant change then pays mutant
    # generation plus one `Running stats` pass of tests/unit -- the 5.5-8.8
    # min every shard used to pay on its own -- so 40 leaves a slow runner
    # room without letting a hung one hold up the matrix for long.
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gate_set: ${{ steps.plan.outputs.gate_set }}
      # "true" when the plan carries both a full and a diff set, which is what
      # `mutation` keys its comparison on. A step's `if:` cannot look inside
      # the matrix JSON, so the planner says it in one word.
      shadow: ${{ steps.plan.outputs.shadow }}
      # The plan's reasons on one line, for `mutation`'s summary when there is
      # nothing to run -- "proven by PR run <id>" is not "nothing changed".
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit and every blob, and no `filter:`: the base commit to
          # diff against, and the diff planner reads base and head sources
          # with `git show`. It errors on a file the tree lists but git cannot
          # produce rather than read it as deleted, so a blobless clone would
          # fail every PR's planner instead of quietly shrinking the scope.
          fetch-depth: 0
          persist-credentials: false
      - name: can the mutation score have changed?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          SKIP: ${{ needs.proven.outputs.skip }}
          PR_RUN_ID: ${{ needs.proven.outputs.pr_run_id }}
        run: |
          # A proven push: the PR run already tested this exact tree, and the
          # nightly holds the whole codebase to 80%. relevant=false is what
          # skips the stats run, the planner tests and the stats upload below.
          # Push only -- `proven` runs nowhere else, so a value seen on any
          # other event is not its verdict.
          if [ "$EVENT" = push ] && [ "$SKIP" = true ]; then
            echo "proven by PR run $PR_RUN_ID — nothing to collect"
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "proven=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole-codebase run is relevant by definition, whatever the
          # event payload happens to carry as a base.
          case "$EVENT" in
            schedule|workflow_dispatch)
              echo "whole-codebase run ($EVENT) — the full gate"
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Fail safe. With no usable base commit (a first push, a force push, a
          # shallow clone) we cannot prove the score is unchanged, so run the
          # whole gate. A wasted 26 minutes is a far better outcome than a gate
          # that quietly stopped gating.
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base commit ('$BASE') — running the full gate"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: with rename detection on, `git diff --name-only`
          # reports only a move's DESTINATION, so moving boost_cli/core/x.py to
          # docs/x.py would look like a docs-only change and skip the gate.
          # core.quotepath=false: otherwise a non-ASCII path comes back
          # \ooo-escaped and would not match any prefix we test for.
          git -c core.quotepath=false diff --no-renames --name-only "$BASE" "$HEAD" > changed.txt
          echo "changed files:"
          sed 's/^/  /' changed.txt
          RELEVANT="$(python3 scripts/mutation_shards.py scope --changed changed.txt)"
          echo "mutation-relevant: $RELEVANT"
          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
      # From here to the stats run, this job must match `mutation-shard`
      # step for step: Python, the install set, the git identity the fixture
      # repos need. Stats taken in a different environment can collect a
      # different set of test ids, and a shard that meets an id the stats
      # file lacks re-runs stats collection for it -- quietly paying back the
      # minutes this job exists to save. tests/unit/test_mutation_plan.py pins
      # the Python version and the install lines against the shard's.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.relevant == 'true'
        with:
          python-version: "3.14"
      - name: git identity (fixture repos)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install test deps
        if: steps.scope.outputs.relevant == 'true'
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -r requirements/mutation-tools.txt
          .venv/bin/pip -q install sqlite-vec || true
      - name: collect mutmut stats once
        if: steps.scope.outputs.relevant == 'true'
        # mutmut has no stats-only command: `run` generates every mutant,
        # runs `Running stats` over tests/unit, runs the clean tests for what
        # it was asked to mutate, then mutates it. So ask for ONE mutant, by
        # its exact name. Measured locally (mutmut 3.8.0): a glob such as
        # `...x__plural__mutmut_*` never matches a key in
        # tests_by_mangled_function_name (those carry no `__mutmut_` suffix),
        # so mutmut's clean run falls back to the WHOLE unit suite: 27.4 min
        # for that run, against 15.1 for the exact name -- 14.5 of it the
        # stats pass itself, 4 s after it, because the clean run is that
        # function's three tests. Only the stats file leaves this job.
        # A shard that restores it goes straight to `Listing all tests`
        # (collect_or_load_stats re-collects only for ids the file lacks):
        # 39 s from start to `Running mutation testing` locally, stats in
        # place. The name is pinned by test_mutation_plan.py, because a
        # mutant that does not exist is an assertion failure inside mutmut.
        env:
          STATS_MUTANT: "boost_cli.core.installplan.x__plural__mutmut_1"
        run: |
          set +e
          .venv/bin/mutmut run "$STATS_MUTANT"
          rc=$?
          set -e
          # 2 is "a mutant survived", which is not this job's business.
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "::error::mutmut stats run failed (rc=$rc)"
            exit 1
          fi
          test -s mutants/mutmut-stats.json
      # The tests of the planner and the diff gate that reach mutmut skip in
      # every `tests` cell, which installs requirements/test-tools.txt and so
      # has no mutmut. They run here instead, in the venv the shards mutate
      # with, where BOOST_REQUIRE_MUTMUT makes a skip an error. After the stats
      # run, so nothing they write is in the checkout mutmut took stats of;
      # before the planner, which leans on what they pin.
      - name: test the planner and the diff gate (needs mutmut)
        if: steps.scope.outputs.relevant == 'true'
        env:
          BOOST_REQUIRE_MUTMUT: "1"
        run: .venv/bin/python -m pytest -q tests/unit/test_mutation_diff.py tests/unit/test_mutation_plan.py
      # Shadow mode. A pull request or merge-queue entry plans BOTH sets: the
      # full 24-shard run, which still decides `mutation`, and the diff set
      # (the functions the branch changed plus their direct callers, see
      # scripts/mutation_diff.py), which runs alongside on the same commit so
      # `mutation` can compare the two per mutant before the diff gate is
      # trusted to bind. Anything else (a push to main) plans full. A full-run
      # trigger in the diff (a mutation script, this job, setup.cfg [mutmut],
      # ...) makes `diff --shadow` return the full plan alone -- including on
      # the PR that edits these lines.
      - name: write the plan
        id: plan
        env:
          RELEVANT: ${{ steps.scope.outputs.relevant }}
          PROVEN: ${{ steps.scope.outputs.proven }}
          PR_RUN_ID: ${{ needs.proven.outputs.pr_run_id }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          plan_full() {
            python3 scripts/mutation_plan.py full --shards 24 --reason "$1" \
              --out mutation-plan.json
          }
          if [ "$RELEVANT" != "true" ]; then
            if [ "$PROVEN" = "true" ]; then
              reason="proven by PR run $PR_RUN_ID"
            else
              reason="no change under boost_cli/, tests/, or the mutation configuration"
            fi
            python3 scripts/mutation_plan.py none --reason "$reason" \
              --out mutation-plan.json
          else
            case "$EVENT" in
              pull_request|merge_group)
                # The far end is $GITHUB_SHA, not the PR head: it is the commit
                # the stats were just taken at and every shard checks out (a
                # PR's merge commit), so the planner counts mutants of the tree
                # the shards mutate. Counting the PR head's instead would make
                # the gate refuse a shortfall whenever main had changed a
                # scoped function since the branch point. The near end is the
                # merge commit's first parent -- the PR exactly as applied --
                # else the merge base of the event's base and head (wider);
                # the queue's is its base_sha. `base` logs which it chose.
                # No base (unfetched, or an empty SHA) widens to full.
                if DIFF_BASE="$(python3 scripts/mutation_plan.py base --event "$EVENT" \
                    --sha "$GITHUB_SHA" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")"; then
                  # .venv: the diff planner imports mutmut, libcst and PyYAML.
                  .venv/bin/python scripts/mutation_plan.py diff --shadow --shards 24 \
                    --base "$DIFF_BASE" --head "$GITHUB_SHA" \
                    --stats mutants/mutmut-stats.json --out mutation-plan.json
                else
                  plan_full "no diff base for $EVENT at $GITHUB_SHA, so no diff scope"
                fi
                ;;
              schedule|workflow_dispatch)
                plan_full "whole-codebase run ($EVENT)"
                ;;
              *)
                plan_full "a mutation-relevant path changed, or there was no usable base commit"
                ;;
            esac
          fi
          cat mutation-plan.json
          MATRIX="$(python3 scripts/mutation_plan.py matrix --plan mutation-plan.json)"
          GATE_SET="$(jq -r '.gate_set // ""' mutation-plan.json)"
          SHADOW="$(jq -r '.sets | has("full") and has("diff")' mutation-plan.json)"
          # One line, whatever the reasons hold: a newline would end this
          # output and start another.
          REASON="$(jq -r '(.reasons // []) | join("; ")' mutation-plan.json)"
          REASON="${REASON//[$'\r\n']/ }"
          REASON="${REASON:0:500}"
          {
            echo "matrix=$MATRIX"
            echo "gate_set=$GATE_SET"
            echo "shadow=$SHADOW"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
      - name: upload the plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-plan
          path: mutation-plan.json
          retention-days: 1
          if-no-files-found: error
      - name: upload the stats
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-stats
          path: mutants/mutmut-stats.json
          retention-days: 1
          if-no-files-found: error

  mutation-shard:
    needs: mutation-plan
    # The planner's result is spelled out because `!cancelled()` replaces the
    # implicit `success()` -- which this job cannot keep: it would look past
    # mutation-plan to `proven`, skipped on every pull request, and skip the
    # shards there too. Same meaning as before: a green planner with work.
    if: ${{ !cancelled() && needs.mutation-plan.result == 'success' && needs.mutation-plan.outputs.matrix != '[]' }}
    # mutmut needs 3.11+; one representative environment keeps CI fast
    runs-on: ubuntu-latest
    # WHY 75 AND NOT 45 — the record from `5769dd94` (2026-09-01), past-tensed
    # because its figures are a snapshot of the pack and the weights as they
    # stood then. The retraction at the end of this block is NOT part of that
    # snapshot and is dated separately. For what the cap is worth against the
    # pack committed today, run `scripts/mutation_shards.py plan --shards 24
    # --explain --timeout-minutes 160` rather than trust a number restated here.
    #
    # The split was never the problem — the runners were. The committed pack
    # balances to within a hundredth of a percent (`--explain` prints each
    # shard's weight). That is a property of these weights and not a guarantee
    # the packer makes: on a tree whose hints are missing or stale it falls
    # back to line counts and spreads much wider. And yet identical
    # `boost_cli/core` code still measured 43.4 min on shard 4 in one run and
    # 17.0 min in the next — a 2.6x swing on the same work, against the ~24 min
    # a raw reading of the then-current six-shard weights gave. That reading is
    # not comparable to the "7391040 ms" quoted further down: the weights were
    # re-measured later and grew, so only the method is shared.
    #
    # Against that spread a 45-minute ceiling sat 3.7% above the slowest run
    # that had ever PASSED (43.4 min, on #667). That is the inverse of the
    # convention this repository applies everywhere else — an eval floor is set
    # a margin clear of its measured value precisely so ordinary drift cannot
    # flake the build. (The size of that margin is recorded in the Makefile,
    # next to the floors themselves, because it is not one number and restating
    # it here would be a second copy to go stale. The point here is the sign,
    # not the size — a ceiling 3.7% ABOVE the worst pass has no margin at all.)
    # One slow runner was enough, and on #673 it happened: shard 2 was killed
    # mid-run, `mutation` failed "upstream jobs must be conclusive", and a batch
    # whose other five shards were green could not merge.
    #
    # A ceiling costs nothing on a run that does not reach it — the shards that
    # finish early are unaffected — so the trade was a rare long job against a
    # gate that blocked merges at random, and 75 stays far under the 6-hour
    # per-job limit the shard matrix already documents.
    #
    # WHAT THAT MARGIN WAS WORTH, AND HOW IT WENT (2026-10-01, a later fit and
    # not part of the record above). The paragraph above used to close "75 …
    # and 36% above the worst run yet seen", measured against a 55.0-minute
    # observation. It was true when written. It is not now: the fit over 169
    # *successful* shard jobs puts the worst at 72.5 min (see TAIL_MULTIPLIER
    # in mutation_shards.py), and 75 sits 3.4% above that — thinner than the
    # 3.7% this same block condemns 45 for. The margin was real and the gate
    # grew into it. Splitting wider is the answer to that; raising the cap a
    # second time is not. That was eight shards when this was written and is
    # TWELVE below as of 2026-10-02 — the number moves, the conclusion does
    # not, so read it off the matrix rather than off this sentence.
    #
    # This is a ceiling, not a budget: if a shard ever genuinely approaches it,
    # the answer is to re-measure `scripts/mutation_weights.json` and re-pack,
    # not to raise this again. That re-measure is no longer a manual debt —
    # `mutation-weights-refresh.yml` follows this workflow on main, takes the
    # `mutation-weights` artifact uploaded below, and opens a PR when the
    # committed plan has fallen 5% or more behind the measured best. It has to
    # come from a CI run rather than a laptop: the tier-1 weights are
    # milliseconds, and a developer machine's durations are not the runner's.
    #
    # WHAT THE CEILING IS WORTH IS NOW A NUMBER, AND IT USED TO BE A HOPE.
    # Everything above reasons about the cap from runs that had already
    # happened, because nothing could predict one that had not: the planner
    # packs weight-milliseconds, so `plan --explain` said "7391040 ms" where
    # this line says "75 min", and no comparison between them existed anywhere
    # in the repo. On the merge of #1015 that gap cashed in — `mutation-shard
    # (4)` ran the full 75 minutes, was cancelled, the `ci` run concluded
    # `cancelled` rather than `failure`, and publish.yml (which fires only on
    # `success`) skipped. A merge to main silently did not ship.
    #
    # scripts/mutation_shards.py now converts, and the conversion is measured
    # rather than guessed: a shard's weight is work laid end to end, the runner
    # executes it 4-way parallel (mutmut's `max_children` defaults to
    # `os.cpu_count()`; ubuntu-latest is 4 vCPU), and the worst run of a
    # shard is 1.91x its own median. (The efficiency was 81.4% over 169 whole
    # jobs when this was written; it is now fitted on the mutation phase
    # alone, beside a fixed per-job preamble -- see the dated paragraph
    # below.) Every constant carries its provenance where it is defined.
    #
    # Held against this line the old six-shard pack scored 37.8 median minutes
    # x 1.91 = a 72.3-minute tail: 96% of the cap, which is the cancellation,
    # predicted. Eight was the answer to that, and it did not survive the next
    # weights refresh: on the weights of 2026-10-02 the same arithmetic gave
    # 42.7 x 1.91 = 81.5 minutes at eight, 109% of the cap — the pack would be
    # cancelled before it finished — and 28.5 x 1.91 = 54.4 at twelve, 72%.
    # That is the arithmetic the matrix below was set to TWELVE on.
    #
    # TWELVE HAS SINCE RUN TWICE, AND IT COST MORE THAN THE PLAN SAID. Over
    # the 24 jobs of those two runs the observed p50 is 34.6 min and the worst
    # job 55.8 — 74% of the cap, past the 54.4 those runs' own gate predicted.
    # That is not new: replay every run's gate as it stood and the predicted
    # tail has been beaten at four of six, the largest by 8.9 min at EIGHT
    # shards (dd416340: 54.2 predicted, 63.1 worst). The width stands: 74% is
    # measured and inside the 80% gate. What does not stand is the margin the
    # planner prints. On #1032's weights -- the pack as committed when this
    # was measured -- `plan` at twelve shards said 25.2 median and a 48.0 tail, 64%
    # of the cap, so that pack, asked about the run its own weights were
    # timed from, under-predicted that job by 7.8 minutes. (#1038 has since
    # re-timed them; `plan` now prints 26.2 / 50.1, 67%. The observed figures
    # in this block are job durations and do not move with a refresh.)
    # Score the committed
    # TAIL_MULTIPLIER against the OBSERVED median and the pack is 34.6 x 1.91
    # = 66.0 min, 88% of the cap: past the 80% gate `plan` reports it clearing
    # with 36 points in hand. The model had no per-job fixed cost, so it
    # flattered every width above the one it was fitted at; see the dated
    # paragraph below for the fixed term it now has. A unit test still
    # refuses a width nothing has run at.
    #
    # THE WIDTHS IN BETWEEN WERE MEASURED, AND EVERY RE-TIMING MOVES THEM.
    # On #1032's weights `plan --explain --timeout-minutes 75` printed eight
    # at 72.1 min / 96%, nine 64.1 / 85%, ten 57.7 / 77%, eleven 52.4 / 70%
    # and twelve 48.0 / 64% — so TEN flipped from fail to pass, 87% on the
    # generation before it against 77% then. Eleven was not a flip: it scored
    # 79% then and passed then too, and was rejected on margin rather than on
    # the gate.
    #
    # #1038 RE-TIMED THE SAME MUTANTS AND TEN FLIPPED BACK. On #1038's
    # weights: eight 75.1 / 100%, nine 66.7 / 89%, ten 60.1 /
    # 80%, eleven 54.6 / 73%, twelve 50.1 / 67%. Ten is TOO TIGHT again,
    # landing exactly on the 80% gate, and planning ten exits 1. That a
    # width crossed the gate in both directions on two re-timings of the same
    # mutants is the argument, not a footnote: the verdict for anything but
    # twelve is inside the noise of a weights refresh. Those are the same
    # optimistic figures as the 64%/67% above,
    # and on the fixed-cost arithmetic ten's honest tail is 37.5 x 1.91 = 71.5
    # min, 95% of the cap. TWELVE stays until something has been measured at
    # another width.
    #
    # Past nine, none of this is bought with a better split. The per-unit
    # *floor* stops moving at NINE, where `registry.py` joins `catalog.py`
    # and `store.py` and the largest unit drops 6,627,388 -> 3,638,539 ms;
    # every width from nine to sixteen sits on that same floor. (Which file
    # joins, and both numbers, move with the weights: the pre-#1032 pack
    # split registry.py at eight and read 7,580,730 -> 4,495,978.) So ten
    # through twelve buy exactly one thing — runner minutes — and twelve is
    # where that purchase is worth making.
    #
    # Figures re-derived 2026-10-05 against the pack committed that day, and
    # they go stale on the next weights refresh: run `plan --shards 24
    # --explain --timeout-minutes 160` for the live ones rather than trusting
    # these, and read them next to the observed 34.6 / 55.8 rather than alone.
    #
    # THE FIXED COST WAS MEASURED, AND MOST OF IT WAS A TEST (2026-10-09).
    # Every shard job's log timestamps its phases, and over 861 successful
    # jobs the preamble before `Running mutation testing` was a median 5.1
    # min at six, 10.0 at eight and 12.9 at twelve -- mutmut's baseline run
    # of tests/unit, where test_mutation_shard_count.py packed mutmut's
    # 16 MB-per-file rewritten tree (245 s locally). Those tests now skip
    # inside mutants/, and the model is FIXED_MINUTES (5.5) plus the
    # mutation phase at 0.98 of four workers -- a fit that agrees at eight
    # and twelve to 1%. Re-measure FIXED_MINUTES from the first runs after
    # that lands. The per-width figures above were computed before it and
    # are kept as the record of what `plan` said then.
    #
    # 75 -> 120, AND WHY THIS IS NOT THE RAISE THE BLOCK ABOVE FORBIDS
    # (2026-10-20). Run 39357937728 (head 525611de, cold cache) ran sixteen
    # shards from 21.8 to 73.4 min, and shard 14 was cancelled at 75 on two
    # pushes, while `plan` put the pack at a 29.3 median and a 56.0 tail.
    # The weights were wrong, not the runners: the 2026-10-19 refresh
    # (a3092119) had dropped store.py's measured time because one untested
    # mutant (mutmut exit 33, never run, never timed) made the record look
    # partial. That left 6,592 mutants at the repo mean. `weights` now
    # exempts exit 33 (NO_TESTS_EXIT in mutation_shards.py), and the
    # committed weights were rebuilt from that run's fifteen shards, with
    # main run 39330392672 filling in shard 14. The 26 `store._inside`
    # mutants are new on the train and sat in the cancelled shard, so neither
    # run timed them. They are imputed at store.py's own measured 7.11
    # s/mutant (185 s of 136.4M ms), and that is the one guessed figure in the
    # file. The next mutation-weights-refresh on main regenerates the whole
    # file with the fixed `weights`. The model then holds: each
    # shard's measured mutant time / 4 matches its mutation phase at 0.97.
    #
    # Honest weights put the total at 136.8M ms against the 89.9M that was
    # committed, and two things follow that re-packing cannot fix:
    #   * one unit, store._copy_tree, is 7,563,494 ms on its own: 120
    #     mutants at a median 72 s, because 97 of them survive and a
    #     survivor runs its whole covering test set. That is 32.2 min of
    #     mutation + 7.1 fixed = 39.3, and x 1.91 is 75.1. Its tail alone
    #     exceeds a 75-minute cap at any width. Killing those survivors is
    #     what shrinks it.
    #   * at sixteen the balanced pack is 41.9 + 1.6 = 43.5 median minutes
    #     (FIXED_MINUTES re-measured cold at 7.1), and x 1.91 is 83.0.
    # The argument above against a second raise assumed a split could always
    # get under the cap. With a single unit whose tail is past it, a split
    # cannot. 100 would put 83.0 at 83%, past the 80% gate. 120 puts it at
    # 69%, the same kind of margin the eval floors keep. A ceiling costs
    # nothing on a shard that finishes early.
    #
    # 16 -> 24 SHARDS AND 120 -> 160 (2026-10-22). Main run 39729763526
    # (head c45107e8) took three attempts and never finished shard 7:
    # 104.0 min (runner lost), then cancelled at 120.7 and 125.0. PR #1225's
    # run 39750022044 (head 553b69ae) lost shards 7, 8, 10, 14 and 15 to the
    # cap. The other shards took 27.1 to 115.7 min, on a pack `plan` called
    # flat at 43.9. The weights had gone stale again, but the model held.
    # Over the 25 successful jobs of both runs, each job's own mutant time / 4
    # matched its `Running mutation testing` phase at a median 0.973
    # (0.922-0.990). Scored on the pack it actually ran, every PR shard that
    # finished was predicted to within 5 min (26 / 27.1, 71 / 71.0,
    # 94 / 96.2). The preamble came back at a median 9.98 min (6.6-15.6), so
    # FIXED_MINUTES is now 10.0.
    #
    # The weights were rebuilt from the 26 `mutation-shard-*` artifacts of
    # the two runs, PR first and main filling the gaps: 46,088 mutants, up
    # from 36,182, and 278.0M ms against 136.4M: 1.27x the mutants, 1.60x
    # the time per mutant (3.77 -> 6.03 s). Main's
    # shard 7 was the only set neither run timed. That is 1,536 mutants:
    # all of config.py, interrupt.py, store._copy_skill and store.link_agents,
    # with parts of store.py, catalog.py and logs.py. They are IMPUTED, and
    # they are the one guessed block in the file. Each mutant starts from its
    # own function's measured mean, else that function's rate in the
    # committed weights, else its file's mean, else the 2.6 s repo mean. Then
    # the whole set is scaled by 2.92x, until it reaches the work that
    # shard's 120.7-minute cancellation proves it holds:
    # (120.7 - 9.98) x 4 x 0.973 = 431 work-minutes. That is a lower bound.
    # The real time may be higher, so the next refresh at this width
    # supersedes it.
    #
    # The floor is that guess. store._copy_skill is 140 mutants, all of them
    # in shard 7, and they impute at 88 s each, 12,330,979 ms. Its tail alone
    # is (10.0 + 52.4) x 1.91 = 119.2 min, 99% of 120. That is the "single
    # unit past the cap" case from the paragraph above, so no width fits 120.
    # Every width from 24 to 40 hits the same floor. Spread additively
    # instead of in proportion, the shortfall would put _copy_skill near
    # 6.9M, and the floor would be store.install, measured at 9.3M (79% of
    # 120). Proportional was chosen because store.py's measured functions
    # grew 1.7-2.4x per mutant (install 1.71x, check_existing 1.72x,
    # _install_rule 1.98x, _install_workflow 2.43x). The first run at this width decides between the
    # two. (store._copy_tree, the floor in the paragraph above, now measures
    # 1,934,906 ms over 121 mutants, down from 7,563,495, because most of its
    # survivors are now killed.)
    #
    # At 160, `plan --explain` gives 75% at twenty-four shards (median
    # 62.4 min on the floor shard, 59.3 ideal) and 82% at twenty (fails).
    # Twenty-eight is still 75%, on the same floor: it splits util.py and
    # buys only runner minutes. 150 would leave 79.5%, the 0.8-minute
    # margin this block refuses above. 160 also lets a median runner finish
    # _copy_skill even if the guess is 1.5x low, and that breaks the loop
    # shard 7 is in: always cancelled, so never measured. Queueing is
    # already real at sixteen. In main's first attempt nine shards started
    # within 3.2 min of the run and the last one 33.4 min after it. The PR
    # run's shards started 58.8-132.3 min in, behind main's run. Queue time
    # does not count against `timeout-minutes`, so going wider costs
    # wall-clock time, not cancellations.
    #
    # Separately, three of main's shards died with "The hosted runner lost
    # communication with the server" at 104-114 min: shard 0 (later 67.4),
    # shard 7, and shard 8 twice (later 52.0). Shard 8's units, among them
    # registry._checked at 130-144 s per mutant, also sat in PR shard 8,
    # which `plan` scores at 58 min and which was cancelled at 125. Identical
    # work running 2-2.4x slower is the runner, not the weights, and
    # TAIL_MULTIPLIER is not re-fitted on it, per its own note.
    #
    # tests/unit/test_mutation_shard_count.py pins all of it: that this number,
    # the planner's FULL_SHARDS (the matrix below is built from its plan) and
    # every `--shards` in this repo agree, and that
    # the committed pack passes `plan --timeout-minutes` against this cap with
    # 20% headroom. So the next pack that would be cancelled fails a unit test
    # instead, which is the point.
    timeout-minutes: 160
    permissions:
      contents: read
    strategy:
      # The gate needs every slice's results, so cancelling the siblings when
      # one shard fails would only turn a single failure into all of them — and cost a
      # rerun of the whole matrix to learn anything.
      fail-fast: false
      # One entry per shard of every set in the plan, {set, index}. The full
      # set is the committed 24-way pack, so its width is still pinned by
      # tests/unit/test_mutation_shard_count.py, through the planner's
      # `--shards 24`.
      matrix:
        include: ${{ fromJSON(needs.mutation-plan.outputs.matrix) }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install test deps
        run: |
          python -m venv .venv
          # Hash-pinned; a superset of test-tools.txt plus mutmut. The mutant
          # kill count depends on the pytest/mutmut versions, so pinning them
          # is what keeps the 80% gate meaning the same thing run to run.
          .venv/bin/pip -q install -r requirements/mutation-tools.txt
          # sqlite-vec so dense.py's mutants are covered by the dense tests
          .venv/bin/pip -q install sqlite-vec || true
      # Outside the workspace on purpose: mutmut's change detection lists
      # untracked non-.py files against the commit the stats were taken at,
      # and a plan or stats file in the checkout would be one.
      - name: download the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan
      - name: download the stats
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-stats
          path: ${{ runner.temp }}/mutation-stats
      - name: mutate ${{ matrix.set }} shard ${{ matrix.index }}
        # Under the job's 160 so a stalled shard fails as a step, with a log
        # the API will serve. The four "runner lost communication" losses on
        # 2026-10-22 (94-124 min into this step) all 404 on their logs.
        timeout-minutes: 145
        env:
          SET: ${{ matrix.set }}
          SHARD: ${{ matrix.index }}
        run: |
          # No per-process `ulimit -v` here: a 4 GiB address-space cap was
          # tried on 2026-10-23 and raised MemoryError inside the clean-test
          # run of mutmut (shards 0, 7 and 16 of run 40010598954), while
          # runners kept being lost with it in place, so it bought nothing.
          # The stats the planner collected, in place before mutmut starts --
          # the whole saving. Missing is an error, not a fallback: mutmut
          # would quietly re-collect and this shard would just be slow again.
          mkdir -p mutants
          cp "$RUNNER_TEMP/mutation-stats/mutmut-stats.json" mutants/mutmut-stats.json
          # `patterns` exits 1 with nothing on stdout for an empty or unknown
          # shard: `mutmut run` with no arguments runs EVERY mutant, so an
          # empty answer must stop here, not become a full 26-minute run in
          # every shard at once.
          PATTERNS="$(python3 scripts/mutation_plan.py patterns --plan "$RUNNER_TEMP/mutation-plan/mutation-plan.json" --set "$SET" --index "$SHARD")"
          echo "$SET shard $SHARD patterns: $PATTERNS"
          set +e
          set -f
          # The word split is deliberate: each pattern must reach mutmut as its
          # own argument. Globbing is off (set -f) so the shell cannot expand
          # them against the working tree first.
          # shellcheck disable=SC2086
          .venv/bin/mutmut run $PATTERNS
          rc=$?
          set -e
          set +f
          # mutmut reports surviving mutants with a non-zero status. Survivors
          # are the gate's business, not a shard's — only a genuine failure to
          # run should fail this job. (Matches scripts/mutation_gate.py.)
          if [ "$rc" != "0" ] && [ "$rc" != "2" ]; then
            echo "::error::mutmut run failed in $SET shard $SHARD (rc=$rc)"
            exit 1
          fi
      - name: upload shard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-${{ matrix.set }}-shard-${{ matrix.index }}
          # Only the .meta results are needed downstream: `mutmut
          # export-cicd-stats` reads mutants/<path>.meta and never looks at the
          # generated mutant sources.
          path: mutants/boost_cli/core
          retention-days: 1
          if-no-files-found: error

  mutation:
    needs: [mutation-plan, mutation-shard]
    # Required check — see the comment above mutation-plan. This must run and
    # report even when every shard was skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: upstream jobs must be conclusive
        env:
          PLAN: ${{ needs.mutation-plan.result }}
          SHARDS: ${{ needs.mutation-shard.result }}
          MATRIX: ${{ needs.mutation-plan.outputs.matrix }}
          GATE_SET: ${{ needs.mutation-plan.outputs.gate_set }}
          SHADOW: ${{ needs.mutation-plan.outputs.shadow }}
        run: |
          echo "plan=$PLAN shards=$SHARDS gate_set=$GATE_SET shadow=$SHADOW matrix=$MATRIX"
          # `always()` means this job runs whatever happened upstream, so it has
          # to judge for itself. Without this step a failed or cancelled shard
          # would surface as a green required check.
          #
          # The planner first: a failed planner leaves its outputs EMPTY, and
          # an empty matrix is otherwise the "nothing to run" answer.
          if [ "$PLAN" != "success" ]; then
            echo "::error::mutation-plan did not succeed ($PLAN) — cannot gate"
            exit 1
          fi
          # One matrix job runs both sets, so a failed DIFF shard in shadow
          # mode lands here too, and is red: the comparison it feeds would
          # have a hole in it, and nobody reads past a green check to notice.
          if [ "$MATRIX" != "[]" ] && [ "$SHARDS" != "success" ]; then
            echo "::error::a mutation shard did not succeed ($SHARDS)"
            exit 1
          fi
          # A full plan with no shards would score nothing and pass.
          if [ "$GATE_SET" = "full" ] && [ "$MATRIX" = "[]" ]; then
            echo "::error::the plan gates on the full set but planned no shards"
            exit 1
          fi
          # Every gating step below is keyed on a gate set it knows. One it
          # does not would skip them all and report green, so refuse it here.
          case "$GATE_SET" in
            ""|full) ;;
            # Legal in the plan schema -- `mutation_plan.py diff` without
            # --shadow writes it -- but no step below binds on it yet: this
            # workflow only ever plans diff in shadow, which gates on full.
            diff) echo "::error::gate set 'diff' is not wired to bind yet (shadow mode gates on 'full') — cannot gate"
               exit 1 ;;
            *) echo "::error::unknown gate set '$GATE_SET' — cannot gate"
               exit 1 ;;
          esac
          # The comparison steps run only beside the full gate's checkout.
          if [ "$SHADOW" = "true" ] && [ "$GATE_SET" != "full" ]; then
            echo "::error::a shadow plan must gate on the full set, not '$GATE_SET'"
            exit 1
          fi
      # Reached only past the step above, so the planner succeeded: an empty
      # gate set here is the planner's own `none`, never a failed planner's
      # empty output. Its reason is either "no change under boost_cli/ ..."
      # or "proven by PR run <id>".
      - name: nothing to mutate
        if: needs.mutation-plan.outputs.gate_set == ''
        env:
          REASON: ${{ needs.mutation-plan.outputs.reason }}
        run: |
          echo "The plan runs no mutants: $REASON"
          echo "- **Mutation:** skipped — $REASON" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.mutation-plan.outputs.gate_set == 'full'
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.mutation-plan.outputs.gate_set == 'full'
        with:
          python-version: "3.14"
      # The same venv the shards build: mutation_gate.py shells out to mutmut,
      # and mutation_diff.py imports mutmut and PyYAML.
      - name: install mutmut (for export-cicd-stats and the diff gate)
        if: needs.mutation-plan.outputs.gate_set == 'full'
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -r requirements/mutation-tools.txt
      - name: download the plan
        if: needs.mutation-plan.outputs.shadow == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-plan
          path: ${{ runner.temp }}/mutation-plan
      # One directory per set, so neither reader can pick up the other's
      # results: the merge re-derives the 24-way pack and reads only full
      # shards, and the comparison reads each set from its own side.
      - name: download full shard results
        if: needs.mutation-plan.outputs.gate_set == 'full'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-full-shard-*
          path: shard-results/full
      - name: download diff shard results
        if: needs.mutation-plan.outputs.shadow == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-diff-shard-*
          path: shard-results/diff
      - name: every planned shard uploaded results
        if: needs.mutation-plan.outputs.gate_set == 'full'
        env:
          MATRIX: ${{ needs.mutation-plan.outputs.matrix }}
        # A download by pattern that matches nothing is not an error, so check
        # each matrix entry, for both sets. A missing full shard would also stop
        # the merge below; a missing diff shard would only make the advisory
        # comparison say so, from a step allowed to fail -- so it stops here.
        #
        # And a pattern that matches exactly ONE artifact is written straight
        # into `path:`, with no <artifact-name>/ level (download-artifact
        # v8.0.2, src/download-artifact.ts: `artifacts.length === 1 ?
        # resolvedPath : path.join(resolvedPath, artifact.name)`). A one-shard
        # diff set is the commonest diff plan, so put a lone set's results back
        # under its shard's name first. Only when the set planned one shard:
        # with several planned and one arrived, which one it was is unknowable,
        # and the check below fails it.
        run: |
          while read -r set planned; do
            dir="shard-results/$set"
            one="$dir/mutation-$set-shard-0"
            if [ "$planned" = 1 ] && [ ! -d "$one" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              mv "$dir" "$dir.lone"
              mkdir -p "$dir"
              mv "$dir.lone" "$one"
            fi
          done < <(jq -r 'group_by(.set)[] | "\(.[0].set) \(length)"' <<< "$MATRIX")
          missing=0
          while read -r set index; do
            if [ ! -d "shard-results/$set/mutation-$set-shard-$index" ]; then
              echo "::error::no results from $set shard $index"
              missing=1
            fi
          done < <(jq -r '.[] | "\(.set) \(.index)"' <<< "$MATRIX")
          exit "$missing"
      # The only step here allowed to fail without failing the check. It runs
      # the diff gate and the per-mutant comparison over the same commit's
      # full and diff results; neither decides `mutation` -- the full gate
      # below does. It runs before the merge so a red full gate still leaves
      # a report: that run is the one most worth comparing. The step goes
      # red, visibly, on any disagreement or incomplete comparison; a FAIL
      # from the diff gate is the data being compared, not an error.
      - name: diff-gate shadow (advisory; the full gate below decides)
        id: shadow
        if: needs.mutation-plan.outputs.shadow == 'true'
        continue-on-error: true
        run: |
          plan="$RUNNER_TEMP/mutation-plan/mutation-plan.json"
          report=mutation-shadow-report.md
          # The diff gate writes its own summary section; send it into the
          # report, so the job summary never shows a diff verdict at top level
          # where a reader would take it for the binding one.
          gate_md="$RUNNER_TEMP/diff-gate-summary.md"
          : > "$gate_md"
          # No pipefail under this job's default shell, so exit codes are
          # captured, never read through a pipe.
          set +e
          # --no-annotations: an advisory gate posting a ::warning on every
          # changed function of every PR is noise; the report lists them.
          # --root stays, so binding it later is one flag removed.
          GITHUB_STEP_SUMMARY="$gate_md" .venv/bin/python scripts/mutation_diff.py gate \
            --plan "$plan" --source shard-results/diff --prefix mutation-diff-shard- \
            --root "$GITHUB_WORKSPACE" --no-annotations > "$RUNNER_TEMP/gate.txt" 2>&1
          gate_rc=$?
          .venv/bin/python scripts/mutation_diff.py compare --plan "$plan" \
            --full-source shard-results/full --diff-source shard-results/diff \
            > "$RUNNER_TEMP/compare.txt" 2>&1
          compare_rc=$?
          set -e
          cat "$RUNNER_TEMP/gate.txt" "$RUNNER_TEMP/compare.txt"
          {
            echo "## Diff-gate shadow"
            echo
            echo "Advisory. The full run decides this check; the diff set ran beside it on the same commit."
            echo "The bar before the diff gate binds is \`disagree 0\` (timeouts excluded and listed)."
            echo
            echo "Comparison exit $compare_rc, diff gate exit $gate_rc."
            echo
            echo '~~~text'
            cat "$RUNNER_TEMP/compare.txt"
            echo '~~~'
            echo
            cat "$gate_md"
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          # compare: 1 = disagreement, 2 = incomplete. gate: 2 = unrun or
          # missing results, anything above = it crashed.
          if [ "$compare_rc" != 0 ] || [ "$gate_rc" -gt 1 ]; then
            echo "::error::diff-gate shadow: comparison exit $compare_rc, diff gate exit $gate_rc"
            exit 1
          fi
      - name: upload the shadow report
        if: needs.mutation-plan.outputs.shadow == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-shadow-report
          path: mutation-shadow-report.md
          # Collected from the first release-train runs before the diff gate
          # is switched on, which can be some days after this one.
          retention-days: 30
          if-no-files-found: warn
      - name: merge shard results
        if: needs.mutation-plan.outputs.gate_set == 'full'
        # Refuses on a missing or half-finished shard rather than gating on a
        # partial result: mutmut counts an unrun mutant as "not checked" and the
        # gate divides by total, so silently accepting one would quietly lower
        # the score instead of failing.
        run: python3 scripts/mutation_shards.py merge --shards 24 --into mutants --source shard-results/full --prefix mutation-full-shard-
      - name: mutation strength gate (>=80% killed)
        if: needs.mutation-plan.outputs.gate_set == 'full'
        run: .venv/bin/python scripts/mutation_gate.py --min 80
      - name: refresh balance hints
        if: needs.mutation-plan.outputs.gate_set == 'full'
        # Advisory only — scripts/mutation_weights.json is an optimisation, never
        # a correctness input, so this neither gates nor commits. It is uploaded
        # so a maintainer can drop a measured file in rather than hand-editing
        # one: real per-symbol mutant counts, and the per-file DURATIONS that let
        # the planner balance on time instead of count. `|| true` because a
        # balance hint is never worth failing a green gate over. It reads the
        # merged FULL results in mutants/ only; diff results stay in
        # shard-results/diff, so a shadow run's weights are still whole-tree.
        run: python3 scripts/mutation_shards.py weights --source mutants || true
      - name: upload balance hints
        if: needs.mutation-plan.outputs.gate_set == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-weights
          path: scripts/mutation_weights.json
          retention-days: 7
          if-no-files-found: warn

  install-smoke:
    # Every gate above runs an editable `pip install -e .`, which cannot catch a
    # broken artifact: missing package-data, a bad entry point, or an undeclared
    # runtime dependency only surface in the built wheel. A merge to main cuts a
    # PyPI release, so build the real wheel + sdist and install what a user gets.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: build wheel + sdist
        run: |
          python -m pip -q install build
          python -m build
      - name: pip install the wheel into a fresh venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip -q install dist/*.whl
          # entry point resolves and setuptools-scm baked in a real version
          /tmp/clean/bin/boost --version | grep -Eq '^boost \S+$'
          # package-data shipped: the bundled registry catalog must load from the
          # installed wheel (data/registries.json), not the source tree
          /tmp/clean/bin/boost tap --catalog --dry-run --limit 1 | grep -Eq 'items \(dry run'
      - name: pipx install the wheel (isolated end-user install)
        run: |
          python -m pip -q install pipx
          pipx install dist/*.whl
          "$(pipx environment --value PIPX_BIN_DIR)/boost" --version | grep -Eq '^boost \S+$'

  patch-coverage:
    # Coverage on the CHANGED lines of a PR: the 93%+ project number can hide a
    # PR that adds wholly-untested code, so gate the diff itself. Self-hosted —
    # diff-cover reads a Cobertura coverage.xml, no external service. PR-only:
    # there's nothing to diff a push to main against.
    #
    # It runs no tests. The coverage.xml is the one `tests (ubuntu-latest,
    # 3.12)` measured, downloaded as the `coverage-report` artifact; this job
    # used to run the whole suite a second time under coverage (~20 min) to
    # produce the same file. Hence `needs: tests`, and hence `always()`: this
    # is a required check, and a plain `needs` would SKIP it when a tests cell
    # fails — and a skipped required check reads as passing. Under `always()`
    # the verdict comes from the download instead: that cell uploads only on
    # a green suite, so a failed or cancelled ubuntu-3.12 cell leaves no
    # artifact and the download step fails this job — the second line of
    # defence behind the first step, which fails on any `tests` result other
    # than success.
    needs: tests
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A download and a diff: well under 3 min. The cap exists only for a
    # wedged step, so it no longer needs the suite's 30.
    timeout-minutes: 10
    permissions:
      contents: read
    # JOB-level, not step-level: a secret cannot be referenced directly in an
    # `if`, and only workflow/job-level env is reliably available to a step's own
    # `if` expression. Declaring it here is what makes the Codecov skip work.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - name: tests must be conclusive
        # The artifact proves only that the measuring STEP passed: a red smoke
        # step in that same cell, or any red Windows/macOS cell, still leaves
        # `coverage-report` behind. So the matrix's result is read here, as a
        # step that always runs — a job-level `if:` on it would SKIP this
        # required check, and a skipped required check reads as passing.
        # TO CONFIRM on the first PR run: that a red 3.15 cell (job-level
        # continue-on-error) still reports needs.tests.result == 'success'.
        env:
          TESTS: ${{ needs.tests.result }}
        run: |
          if [ "$TESTS" != "success" ]; then
            echo "::error::tests concluded '$TESTS' — patch coverage cannot be trusted"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # full history so origin/main is a real diff base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install diff-cover
        run: |
          python -m venv .venv
          # Hash-pinned; test-tools.txt plus diff-cover.
          .venv/bin/pip -q install -r requirements/coverage-tools.txt
      - name: coverage.xml from tests (ubuntu-latest, 3.12)
        # Fails the job when the artifact is absent — which is exactly the
        # case of a red or cancelled measuring cell (see the job comment).
        # The project gate (`fail_under` in pyproject.toml) was enforced in
        # that cell; this job gates ONLY the patch.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
      - name: diff-cover (changed-line coverage vs main)
        # 80% of each PR's changed, coverable lines must be tested — pairs with
        # the project gate so new code can't ride in untested. Tune --fail-under
        # here. A diff with no Python lines passes (nothing to measure).
        run: |
          git fetch --no-tags origin main
          .venv/bin/diff-cover coverage.xml --compare-branch=origin/main --fail-under=80
      - name: upload to Codecov (optional)
        # The hosted counterpart to the diff-cover gate above: same coverage.xml,
        # but Codecov turns it into PR diff-coverage comments, a file sunburst and
        # a trend line over time. The gate stays local and authoritative —
        # codecov.yml sets informational: true, so Codecov never fails a build.
        #
        # Degrades to a no-op until someone adds CODECOV_TOKEN: `if` reads it via
        # the JOB-level env below (a secret is not usable directly in an `if`, and
        # only workflow/job-level env is reliably available to a step's own `if`),
        # so with no secret the step is skipped rather than failing.
        # continue-on-error as well, because a third-party uploader being down
        # must never redden boost's CI.
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false

  canary:
    # Allow-failure early-warning leg on the free-threaded (no-GIL) CPython
    # build: a GIL-removal regression surfaces here before a user on 3.14t hits
    # it on release day. boost's runtime is stdlib-only, so this should stay
    # green; `continue-on-error` keeps a red canary from blocking the gate (and
    # the release) — it's a signal, not a required check. PR-only.
    name: canary (3.14t free-threaded)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14t"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: unit + functional on free-threaded 3.14
        # Plain pytest (no coverage gate) — this leg is a compatibility signal,
        # not the coverage/mutation gate. [rag] deps with no free-threaded wheel
        # importorskip themselves, exactly as on the main matrix.
        run: |
          python -m venv .venv
          # setuptools is a TEST dependency here, not a build one: `pip install
          # -e .` resolves the backend in an isolated build env, so nothing it
          # does puts setuptools in .venv, and a modern `venv` seeds pip alone.
          # tests/unit/test_sdist_contents.py runs setuptools' own MANIFEST
          # matcher (`setuptools._distutils.filelist`) rather than building an
          # sdist over the network, so without this the leg is red on 17
          # ModuleNotFoundErrors and a real no-GIL regression would not change
          # its colour. tests/unit/test_canary_deps.py keeps this list in step
          # with what the suite imports unguarded.
          .venv/bin/pip -q install pytest pytest-cov coverage hypothesis setuptools pyyaml
          .venv/bin/pip -q install -e .
          .venv/bin/pytest tests/unit tests/functional -q

  # The behave suite (tests/bdd) ran nowhere in CI:
  # `make bdd` only ever executed if a contributor remembered to run it. Unlike
  # the eval and mutation gates, which degrade cleanly but still execute, this
  # one was invisible — so a CLI change that broke the step glue (output-string
  # matching, mocked shutil.which) could rot across any number of merges.
  #
  # Its own job rather than a step inside `tests`: the suite is platform- and
  # version-independent glue, so running it nine times across that matrix buys
  # nothing, and a dedicated check name is what makes it requireable through the
  # documented .github/required-checks.txt path instead of quietly turning an
  # existing required check into the gate for a second suite.
  bdd:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          # audit: record egress, never block — the runtime signal that
          # catches a compromised action exfiltrating a token, paired with
          # zizmor's static analysis. Flip to block + an allowlist to enforce.
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity (fixture repos)
        # environment.py builds the shared fixture tap with make_fixture.py,
        # which commits — a runner has no default identity.
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install behave
        # Unlocked and installed from the [bdd] extra rather than added to
        # requirements/*.in: behave is an optional runtime extra declared in
        # pyproject, not part of the pinned gate toolchain — the same call the
        # `tests` job makes for the [rag] extra's sqlite-vec.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[bdd]'
      - name: behave (tests/bdd)
        # Every scenario sandboxes its own $HOME in environment.py, so this
        # touches no real agent config. --no-capture-stderr keeps a failing
        # step's own diagnostics in the log next to the scenario that failed.
        run: .venv/bin/behave tests/bdd/features --no-capture-stderr

  onnx-inference:
    # The only job that runs the real ONNX graph. Every other leg installs just
    # `sqlite-vec` from the [rag] extra, so since the local embedder shipped
    # nothing in CI has loaded the actual weights — the stubbed suite declares
    # its own tensor shapes, which is right for what it tests and blind to
    # whether onnxruntime accepts this export at all.
    #
    # One leg, not the matrix: onnxruntime has no free-threaded 3.14t wheel and
    # the value here is the model contract, which is platform-independent. The
    # matrix keeps testing that a machine WITHOUT the extra degrades cleanly,
    # which is the more common user state.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: read the pinned model revision
        # Read from localembed.py rather than duplicated here: MODEL_REV is what
        # keys the on-disk cache, so a hard-coded key would silently serve stale
        # weights for a new revision — the one cache bug that would make this
        # job pass against the wrong model.
        id: rev
        run: |
          rev=$(python -c "from boost_cli.core import localembed; print(localembed.MODEL_REV)")
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: cache the pinned BGE weights (133 MB)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.boost-home/cache/models
          # Revision-keyed, so bumping MODEL_REV misses the cache and refetches
          # instead of reusing the old graph under a new name.
          key: bge-weights-${{ steps.rev.outputs.rev }}
      - name: install the [rag] extra in full
        # Unlocked and best-effort in spirit like the other extras, but NOT
        # `|| true` here: this job exists to run inference, so a failed install
        # must fail loudly rather than skip into a green tick.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[rag]'
          .venv/bin/pip -q install -r requirements/test-tools.txt
      - name: real-weights inference contract
        # BOOST_HOME redirects the model cache into the workspace so the cache
        # action can see it; BOOST_ONNX_E2E is the opt-in the test module gates
        # on, so this is the only place the 133 MB download is ever paid for.
        #
        # The skip check matters more than it looks. Every guard in that module
        # — missing extra, failed download — degrades to *skip* by design, and a
        # fully-skipped pytest run exits 0. So the job would report green in
        # precisely the circumstances it exists to catch. Run once, then read
        # the summary: passes required, skips fatal.
        env:
          BOOST_HOME: ${{ github.workspace }}/.boost-home
          BOOST_ONNX_E2E: "1"
        run: |
          set -o pipefail
          .venv/bin/pytest tests/unit/test_localembed_e2e.py -v --no-header \
            | tee onnx-result.txt
          if grep -qE '[0-9]+ skipped' onnx-result.txt; then
            echo "::error::inference tests skipped — the [rag] extra or the pinned weights never loaded, so this job proved nothing"
            exit 1
          fi
          grep -qE '[0-9]+ passed' onnx-result.txt

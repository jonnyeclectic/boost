name: sbom

# Ad-hoc CycloneDX SBOM of the current main, for eyeballing. Manual only.
#
# The RELEASE SBOM is generated and attached in publish.yml, not here. This
# file used to trigger on `release: published` and had 0 runs across 227
# releases: releases are created by release-drafter authenticated with
# GITHUB_TOKEN, and events created with GITHUB_TOKEN do not start workflows.
# publish.yml's own header states that rule, which is why every other release
# step already lives in that one job. The dead trigger is removed rather than
# left looking like coverage.
#
# boost's runtime is stdlib-only, so the SBOM documents a zero-third-party-
# dependency shipped artifact — a verifiable supply-chain statement that
# complements the CVE scanners already in CI (pip-audit on the resolved env,
# osv-scanner on the manifest diff).

on:
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # nothing is attached here any more — see the header
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: build the wheel and generate a CycloneDX SBOM of its install
        run: |
          python -m pip -q install build cyclonedx-bom
          python -m build --wheel
          # Scan a clean install of the shipped wheel (not the build env), so the
          # SBOM is the runtime dependency closure a user actually gets.
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip -q install dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python \
            --output-format JSON -o boost-sbom.cdx.json
          echo "----- SBOM -----"
          cat boost-sbom.cdx.json
      - name: upload the SBOM as a run artifact
        # Nothing to attach to on a manual run — the artifact is how you get
        # the file off the runner.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boost-sbom
          path: boost-sbom.cdx.json
          if-no-files-found: error

name: sbom

# CycloneDX SBOM for every release, attached to the GitHub Release as an asset.
#
# boost's runtime is stdlib-only, so the SBOM documents a zero-third-party-
# dependency shipped artifact — a verifiable supply-chain statement that
# complements the CVE scanners already in CI (pip-audit on the resolved env,
# osv-scanner on the manifest diff). Separate from publish.yml, so it can never
# redden or block the release itself; workflow_dispatch allows a manual run to
# eyeball the generated SBOM.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # attach the SBOM asset to the GitHub Release
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: build the wheel and generate a CycloneDX SBOM of its install
        run: |
          python -m pip -q install build cyclonedx-bom
          python -m build --wheel
          # Scan a clean install of the shipped wheel (not the build env), so the
          # SBOM is the runtime dependency closure a user actually gets.
          python -m venv /tmp/sbomenv
          /tmp/sbomenv/bin/pip -q install dist/*.whl
          cyclonedx-py environment /tmp/sbomenv/bin/python \
            --output-format JSON -o boost-sbom.cdx.json
          echo "----- SBOM -----"
          cat boost-sbom.cdx.json
      - name: attach the SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the tag through the environment, never spliced into the script —
          # a crafted tag name can't inject shell (zizmor: template-injection).
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" boost-sbom.cdx.json --clobber

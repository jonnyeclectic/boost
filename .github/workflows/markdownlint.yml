name: markdownlint

# Consistency for every contributor-facing Markdown surface — README,
# CLAUDE.md, CONTRIBUTING, SECURITY, docs/*.md, examples, style. Heading
# order, list/fence hygiene, labeled code fences. Config (and the rules boost
# deliberately relaxes — line length, inline HTML) lives in
# .markdownlint-cli2.jsonc at the repo root; run the same check locally with
#   npx --yes markdownlint-cli2@0.18.1

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdownlint.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdownlint.yml"]

permissions: {}

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: markdownlint (config-driven)
        # Pinned version; the repo-root .markdownlint-cli2.jsonc is auto-found.
        run: npx --yes markdownlint-cli2@0.18.1

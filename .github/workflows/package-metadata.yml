name: package-metadata

# Pre-publish validation: build the sdist + wheel and confirm the packaging
# metadata is sound before it can reach PyPI. The release path otherwise trusts
# the build blindly — a broken README renders as a broken PyPI page, an empty
# wheel ships nothing, and thin metadata degrades discoverability.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools-scm derives the version from git tags/history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build + validation tools
        # Hash-pinned (requirements/release-tools.txt, generated from the .in by
        # scripts/lock_toolchain.py) — that file already declares build, twine,
        # check-wheel-contents and pyroma for exactly this workflow. Unpinned,
        # a `twine check --strict` or `pyroma` verdict could change on an
        # upstream release, which is the thing a release gate must not do.
        run: python -m pip -q install -r requirements/release-tools.txt
      - name: Build sdist + wheel
        run: python -m build
      - name: twine check (README renders on PyPI)
        run: twine check --strict dist/*
      - name: check-wheel-contents (no empty/stray wheel)
        run: check-wheel-contents dist/*.whl
      - name: pyroma (metadata completeness)
        # 8 is today's honest baseline (author-email intentionally omitted);
        # gate blocks a regression below it.
        run: pyroma --min 8 dist/*.tar.gz

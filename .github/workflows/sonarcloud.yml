name: sonarcloud

# SonarCloud analysis — bugs, code smells, security hotspots, duplication and a
# coverage overlay in one dashboard, with a pass/fail quality gate decorating
# each PR. Free for public repositories.
#
# NON-BLOCKING, and inert until onboarded. Three things are needed, all outside
# this repo:
#
#   1. Import the repo at https://sonarcloud.io (Analysis Method: GitHub Actions).
#   2. Add the generated token as the SONAR_TOKEN repo secret.
#   3. Set the repository variable SONAR_ENABLED to `true`.
#
# Until then the job does not start. It used to start and skip only the scan
# step, because a secret cannot be read in a job-level `if`: every PR push and
# every merge still ran the whole unit + functional suite serially on one
# runner (14-20 min, inside the account's 20-job cap) to produce a report that
# nothing read. By 2026-11-02 that suite outgrew the 20-minute timeout, and
# main's run 41387655240 was cancelled, opening tracker #1302 about nothing.
# A repository variable CAN be read at job level, so it gates the runner.
#
# Settings live in sonar-project.properties. Do NOT add this to branch
# protection's required checks: boost's own gates (ruff, mypy, pyright, vulture,
# xenon, refurb, the coverage floors, the mutation gate) are the authoritative
# ones and all run offline. Sonar is the cross-cutting VIEW over them — valuable
# for spotting trends, wrong as a thing that can block a merge on somebody
# else's uptime.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `github.ref` is per-branch, so this never cancelled across pull requests the
  # way demo.yml did — but it does put every push to main in ONE group, and with
  # unconditional cancellation a quick second merge kills the first commit's
  # analysis. Main's quality history then has silent holes exactly where merges
  # came fastest. Keying non-PR runs on the commit gives each one its own group.
  group: sonarcloud-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonar-analyze:
    # See the header: no runner at all until the project is onboarded.
    if: vars.SONAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read    # PR decoration
    # JOB-level, not step-level: a secret cannot be referenced directly in an
    # `if`, and only workflow/job-level env is reliably available to a step's own
    # `if` expression. Declaring it here is what makes the skip actually work.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar attributes issues to authors and needs history for new-code
          # detection; a shallow clone makes both wrong.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install test deps
        # Hash-pinned, same file the patch-coverage job uses.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -r requirements/coverage-tools.txt
          .venv/bin/pip -q install sqlite-vec || true
      - name: suite -> Cobertura coverage.xml
        # Sonar reads a report; it does not run the tests. --cov-fail-under=0
        # because the coverage FLOOR is ci.yml's to enforce, not this job's.
        run: .venv/bin/pytest tests/unit tests/functional --cov=boost_cli --cov-report=xml --cov-fail-under=0 -q
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      - name: note when the scan was skipped
        if: env.SONAR_TOKEN == ''
        # One heredoc, not five appends: shellcheck's SC2129 flags repeated
        # individual redirects to the same file, and actionlint runs shellcheck
        # over every run: block.
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          SONAR_TOKEN is not set — SonarCloud analysis skipped.

          To enable: import the repo at https://sonarcloud.io (Analysis Method:
          GitHub Actions), then add the generated token as the SONAR_TOKEN secret.
          Project settings live in sonar-project.properties.
          EOF

name: links

# Broken-link & anchor checking over the README and the docs site. A dead link
# on the landing page is the first broken promise a visitor sees, and the
# generated roadmap boards are especially easy to break — their links come from
# item-file card copy, so a bad href hides in a small Markdown file and only
# surfaces in the rendered HTML.
#
# Two passes:
#   * lychee — external URLs (GitHub, PyPI, docs sites) + local file paths,
#     with caching and retries so a flaky third-party host doesn't redden a PR.
#   * a stdlib anchor pass — in-page and cross-page #fragments, which lychee
#     does not resolve for local HTML.
# Scheduled weekly too: external links rot without anyone touching the repo.

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", ".lycheeignore", ".github/workflows/links.yml"]
  pull_request:
    paths: ["docs/**", "README.md", ".lycheeignore", ".github/workflows/links.yml"]
  schedule:
    - cron: "0 8 * * 4"   # Thursdays 08:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: restore lychee cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      # On a pull request, a settled card's write-up link is checked against
      # this checkout, not GitHub. build_roadmap.py links it to
      # blob/main/docs/roadmap/items/<id>.md, so a PR filing a NEW card as
      # shipped always 404'd (#845): the file is not on main until the PR
      # merges. The remap sends that one prefix to the PR's own tree, where a
      # mistyped id still fails as "File not found"; pushes to main and the
      # weekly run keep fetching the real URL. tests/unit/test_roadmap_fresh.py
      # pins the pattern to build_roadmap.ITEMS_URL.
      - name: lychee (URLs + local paths)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --cache --max-cache-age 1d --no-progress
            --accept 200,206,403,429
            --max-retries 3
            ${{ github.event_name == 'pull_request' && format('--remap ''^https://github\.com/jonnyeclectic/boost/blob/main/docs/roadmap/items/ file://{0}/docs/roadmap/items/''', github.workspace) || '' }}
            README.md docs/*.html
          fail: true
      - name: anchors (in-page + cross-page fragments)
        # lychee resolves URL fragments for remote pages but not for local HTML,
        # and the roadmap boards are exactly where a dangling #anchor hides.
        run: python3 scripts/check_anchors.py

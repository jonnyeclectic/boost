name: shards

# Publish prebuilt dense-vector shards, so a keyless user gets semantic search
# without paying to embed the catalogue themselves.
#
# WHY THIS EXISTS. Embedding is ~1.2 s/chunk on CPU — measured at 4,431 s for
# 743 entries with the shipped ONNX bge-small-en-v1.5. Importing the same rows
# takes 0.12 s. Without published shards the keyless tier is available in
# principle and unreachable in practice, which is why step 2 of the
# keyless-semantic-search roadmap item is a requirement rather than an
# optimisation.
#
# TRIGGER — deliberately NOT chained off release. publish.yml already sits at
# `ci -> release -> sbom`, which is GitHub's documented three-level
# workflow_run chain limit; a fourth link would silently never fire. sbom.yml's
# header records what that failure looks like here: 253 releases, 0 runs, 0
# assets — a control that looked present and produced nothing. Shards are also
# keyed on a REGISTRY's commit, not on a boost release, so tying them to our
# release cadence would be wrong even if the chain allowed it.
#
# SCALE — one job per registry, not one job for everything. A 20-tap corpus is
# ~3.4 h of embedding against the 6 h job limit, and the full 466-registry
# catalogue is far beyond it. The matrix keeps each job to one registry and lets
# failures be per-registry rather than all-or-nothing.
#
# The largest pinned tap is `sickn33/antigravity-awesome-skills` and it is not
# "~75 min", which is what this comment used to claim: 6,309 entries become
# 77,423 chunks, and the 2026-08-16 scheduled run burned its entire
# `timeout-minutes: 330` on it and was cancelled with nothing published. Raising
# the timeout was never available — 330 is already under the 6 h ceiling.
#
# What made it fit was de-duplicating the embedding work. **68.7% of that
# registry's chunks are byte-identical repeats** (77,423 -> 24,246 distinct), and
# embeddings are deterministic, so each copy was bought at full price for the
# same vector. With that collapsed the same job **completed in 2 h 07 m** and
# published a 129 MB shard of 78,095 chunks (verified: run #4, 2026-08-17).
#
# So the per-registry budget is set by DISTINCT chunk text, not entry count. A
# registry that mirrors itself heavily is far cheaper than its size suggests;
# one that does not is the case to watch against the ceiling.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "catalog (every catalogued registry) or eval (the pinned corpus)"
        required: false
        default: "catalog"
        type: choice
        options: [catalog, eval]
      registries:
        description: "Space-separated owner/repo list, overriding scope"
        required: false
        default: ""
      jobs:
        description: "Matrix jobs to pack the catalogue into (max 256)"
        required: false
        default: "60"
  schedule:
    - cron: "0 4 * * 0"        # weekly, Sunday 04:00 UTC — registries move slowly

permissions:
  contents: read

concurrency:
  group: shards-${{ github.ref }}
  cancel-in-progress: false    # never kill a half-finished embed run

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        name: choose and pack the registries to shard
        # Bin-packed, not sliced, and packed in Python rather than shell.
        # GitHub caps a matrix at 256 jobs, so the ~460-registry catalogue
        # cannot be one job per registry; and embedding cost is wildly uneven
        # (the largest catalogued registry is 880 measured items against a
        # median of 30), so slicing would leave one job carrying several
        # giants while others idle. `shard_plan.py` does longest-processing-
        # time-first packing over the measured `est_items`, which puts the
        # biggest registry effectively alone and holds the rest within a
        # ~2x band.
        #
        # Inputs reach the shell through `env`, never through `${{ }}`
        # interpolation: a workflow_dispatch input is attacker-controlled text,
        # and interpolating it into `run:` splices it into the script itself.
        # zizmor flags this as template-injection, correctly — the first draft
        # of this file had exactly that hole.
        env:
          REGISTRIES_INPUT: ${{ inputs.registries }}
          SCOPE: ${{ inputs.scope }}
          JOBS: ${{ inputs.jobs }}
        run: |
          if [ -n "$REGISTRIES_INPUT" ]; then
            # An explicit list is one job per registry: whoever typed it chose
            # the granularity.
            json=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$REGISTRIES_INPUT")
          else
            json=$(python3 scripts/shard_plan.py \
                     --scope "${SCOPE:-catalog}" --jobs "${JOBS:-60}")
          fi
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys; m=json.loads(sys.argv[1]); print("planned %d job(s), %d registries" % (len(m), sum(len(x.split()) for x in m)))' "$json"
      - name: check both releases have room for this plan
        # A release holds at most 1,000 assets, and `shards-latest` reached
        # 999: every run after 2026-10-11 embedded for an hour and then lost
        # its upload to HTTP 422. This is the earliest job that knows how many
        # registries the run will publish, so the count is checked here,
        # against what each release already holds, before a build job starts.
        #
        # It fails closed. A release that does not exist yet (the keyword one,
        # before the first run after the split) reads as empty, and only an
        # HTTP 404 says that: a 5xx, a secondary rate limit or a dropped
        # connection is an unknown count, and reading one as an empty release
        # is exactly how a release a few assets from full would pass this
        # check and fail an hour later. Likewise the live manifest, which says which keyword
        # rows stay on `shards-latest` (a registry outside this run is carried
        # forward with its asset where it is): `capacity` refuses if the
        # listing holds a manifest.json that this fetch did not deliver.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MATRIX: ${{ steps.pick.outputs.matrix }}
        run: |
          for tag in shards-latest shards-keyword-latest; do
            if ! gh api "repos/$REPO/releases/tags/$tag" > "$tag.json" 2> "$tag.err"; then
              if ! grep -q 'HTTP 404' "$tag.err"; then
                cat "$tag.err" >&2
                echo "::error::could not list $tag, so its asset count is unknown"
                exit 1
              fi
              echo "no $tag release to count yet"
              echo '{"assets": []}' > "$tag.json"
            fi
          done
          curl -fsSL --max-time 60 -o live-manifest.json \
            "https://github.com/$REPO/releases/download/shards-latest/manifest.json" \
            || echo "no live manifest fetched; capacity decides whether that is allowed"
          python3 scripts/publish_shards.py capacity --matrix "$MATRIX" \
            --release shards-latest=shards-latest.json \
            --release shards-keyword-latest=shards-keyword-latest.json \
            --live-manifest live-manifest.json

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330        # under the 6 h ceiling, over the ~75 min worst tap
    strategy:
      fail-fast: false          # one bad registry must not lose the others' work
      # 4 was right when a job was one registry and the corpus was twenty. With
      # the catalogue packed into ~60 jobs it is the difference between a run
      # that finishes in about an hour and one that runs all day.
      max-parallel: 20
      matrix:
        registry: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install boost + the [rag] extra
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[rag]'
      - name: tap and embed
        env:
          BOOST_HOME: ${{ runner.temp }}/boost-home
          # A matrix entry is now a SPACE-SEPARATED LIST of registries, not one
          # registry. Split in Python, never by shell word-splitting — see the
          # plan job's history for what that costs.
          REGISTRIES: ${{ matrix.registry }}    # via env, not interpolation
          REPO: ${{ github.repository }}
          JOB: ${{ strategy.job-index }}
        run: |
          python3 -c 'import os,sys; print("\n".join(os.environ["REGISTRIES"].split()))' > registries.txt
          echo "this job carries $(wc -l < registries.txt) registries"
          # One `boost tap` call for the whole chunk: cloning is network
          # latency, so tapping them together is ~6x faster than one at a time
          # (measured: 24 registries, 62.9 s serial vs 11.0 s at the default 8).
          xargs .venv/bin/python -m boost_cli tap < registries.txt || true
          # The keyword (BM25) index first, while every registry is still
          # tapped: it costs seconds, needs no embedding backend, and the
          # dense step below untaps whatever it can skip. Same carry-forward
          # contract as the vectors — a registry whose keyword row already
          # names its HEAD (at this boost's index version) is listed, not
          # re-exported, and the publish job keeps last week's row for it.
          # `--hosted-on`: a row whose asset is still on `shards-latest`, from
          # before keyword shards got their own release, is not current for
          # this run, so the registry is re-exported onto the new release and
          # its old asset becomes prunable. That is the whole migration.
          .venv/bin/python scripts/publish_shards.py unchanged --kind keyword \
            --manifest-url "https://github.com/$REPO/releases/download/shards-latest/manifest.json" \
            --hosted-on shards-keyword-latest \
            --out "keyword-unchanged-$JOB.txt"
          # A crash here must not cost this chunk its dense work: the step is
          # `set -e`. A registry with no fresh shard and no unchanged line is
          # "unreported", so the publish job keeps its previous keyword row.
          .venv/bin/python scripts/publish_shards.py export-keyword \
            --out . --skip "keyword-unchanged-$JOB.txt" \
            || echo "::warning::keyword export failed in chunk $JOB; previous keyword rows carry forward"
          # Ask before embedding. The manifest pins the commit each published
          # shard was built from, so a registry whose HEAD is that commit keeps
          # last week's row instead of buying the same vectors again — every
          # run used to re-embed the whole catalogue, ~9 job-hours, although
          # registries move slowly and most of it was redundant. Unknown is not
          # equal: a tap whose commit could not be read is embedded, never
          # skipped. A first run, an unreachable release, or a manifest in
          # another embedding space all list nothing, so everything embeds.
          .venv/bin/python scripts/publish_shards.py unchanged \
            --manifest-url "https://github.com/$REPO/releases/download/shards-latest/manifest.json" \
            --out "unchanged-$JOB.txt"
          while read -r reg _; do
            .venv/bin/python -m boost_cli untap --force "$reg"
          done < "unchanged-$JOB.txt"
          # One embed pass for everything still tapped. `reindex --dense` is
          # per-tap incremental, so a chunk costs what its registries cost —
          # and a chunk with nothing left to embed skips the pass rather than
          # failing on "no taps configured".
          if [ "$(.venv/bin/python -m boost_cli taps --json)" != "[]" ]; then
            .venv/bin/python -m boost_cli reindex --dense
          else
            echo "every registry in this chunk is already published at its current commit"
          fi
      - name: export the shards
        env:
          BOOST_HOME: ${{ runner.temp }}/boost-home
          REGISTRIES: ${{ matrix.registry }}
          JOB: ${{ strategy.job-index }}
        run: |
          shopt -s nullglob
          # A registry that failed to tap has no vectors and no shard; that is
          # this job's other registries' problem only if we let it be, so the
          # loop reports and carries on. One reported unchanged has no shard
          # here either — its row is carried forward by the publish job.
          for reg in $(python3 -c 'import os; print(" ".join(os.environ["REGISTRIES"].split()))'); do
            if awk -v r="$reg" '$1 == r { found = 1 } END { exit !found }' "unchanged-$JOB.txt"; then
              echo "reusing the published shard for $reg"
              continue
            fi
            safe=$(printf '%s' "$reg" | tr '/' '__')
            if ! .venv/bin/python -m boost_cli reindex --export-shard "$reg" > "$safe.shard.json"; then
              echo "::warning::no shard for $reg"
              rm -f "$safe.shard.json"
            fi
          done
          # `./*.shard.json`, not `*.shard.json`: a bare glob can expand to a
          # name starting with `-`, which python3 would read as its own flag
          # (shellcheck SC2035).
          python3 - "unchanged-$JOB.txt" ./*.shard.json <<'PY'
          import json, sys
          # Fail here rather than publish an unusable artifact: a shard without
          # provenance cannot be validated on import and would be refused by
          # every consumer, silently, forever.
          unchanged = [l for l in open(sys.argv[1]).read().splitlines() if l.strip()]
          ok = 0
          for path in sys.argv[2:]:
              shard = json.load(open(path))
              missing = [k for k in ("provider", "model", "dim", "commit")
                         if not shard.get(k)]
              assert not missing, "%s is missing %s" % (path, missing)
              assert shard.get("chunks"), "%s has no chunks" % path
              print("shard ok: %d chunks, %s @ %s"
                    % (len(shard["chunks"]), shard["model"], shard["commit"][:8]))
              ok += 1
          assert ok or unchanged, "this job produced no shards and reused none"
          print("%d fresh shard(s), %d carried forward" % (ok, len(unchanged)))
          PY
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Still artifacts at this stage: one job per registry cannot write a
          # manifest that describes all of them, so the matrix hands its output
          # to the `publish` job below, which assembles the manifest once and
          # puts both on a release. An artifact is not a distribution channel —
          # downloading one needs a GitHub token and it expires at 90 days,
          # which is why the release exists.
          name: shard-${{ strategy.job-index }}
          path: |
            *.shard.json
            *.keyword.json.gz
            unchanged-*.txt
            keyword-unchanged-*.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    # Assemble every shard the matrix produced into one downloadable set.
    #
    # WHY A ROLLING PRERELEASE. The assets need a stable, anonymous URL, which
    # a release asset has and an artifact does not. `shards-latest` is a fixed
    # tag so the manifest URL compiled into boost never moves, and the release
    # is marked prerelease + not-latest so it stays invisible to everything
    # that reads "the latest release": release-drafter resolves the next
    # version from published non-prereleases (publish.yml), and the README's
    # shields badge excludes prereleases too. The tag carries no digit, so
    # setuptools-scm's `--match *[0-9]*` never sees it as a version either.
    #
    # WHY TWO OF THEM. A release holds at most 1,000 assets and one asset per
    # registry per kind is ~2 x 512, so `shards-latest` reached 999 and every
    # run after 2026-10-11 lost its upload to HTTP 422 ("file_count limited
    # to 1000 assets per release"). The keyword shards now live on
    # `shards-keyword-latest`, created exactly like `shards-latest` and for
    # the same reasons; the manifest stays where every boost already looks.
    # Clients accept the second tag unchanged: `core.shards.download` only
    # requires a shard URL to share the manifest's scheme and host.
    #
    # `fail-fast: false` above means some registries can fail while others
    # succeed; publishing the ones that worked is the point, so this job runs
    # on `success() || failure()` and simply publishes whatever arrived.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # 30 was enough for one upload. The first run after the split also moves
    # the keyword shards of the 511 registries in today's matrix to their new
    # release and prunes up to the 473 left on `shards-latest`, at a paced one
    # per second: eight minutes of deletes at the very least.
    timeout-minutes: 60
    permissions:
      contents: write        # create/update the rolling release + its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-*
          merge-multiple: true
          path: shards
      - name: build the manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          ls -l shards/ || { echo "no shards were produced"; exit 1; }
          # Last week's manifest, from the release itself: the rows for every
          # registry the build jobs reported unchanged are carried forward from
          # it, because their assets are still on the release byte for byte.
          # Missing on the first run — the one week nothing can be reused.
          #
          # It carries one more population, and that one is about THIS file:
          # `fail-fast: false` above means a job can die, and a job that dies
          # uploads neither shards nor an `unchanged` file, so the publish job
          # hears nothing at all about its ~10 registries. Rebuilding the
          # manifest from what arrived therefore deleted their rows while
          # `--clobber` kept their assets — 8 orphaned shards and 245.5 MB on
          # the 2026-09-20 release. A registry nobody reported on keeps its
          # published row; one that has left the bundled catalogue does not,
          # and `publish_shards.py` prints both counts, so a manifest that
          # shrinks says so in this job's log.
          carry=()
          if curl -fsSL --max-time 60 -o previous-manifest.json \
               "https://github.com/$REPO/releases/download/shards-latest/manifest.json"; then
            carry=(--carry-forward previous-manifest.json)
          else
            echo "no previous manifest — first run, nothing to carry forward"
          fi
          python3 scripts/publish_shards.py manifest \
            --shard-dir shards --repo "$REPO" --tag shards-latest \
            --keyword-tag shards-keyword-latest \
            --out shards/manifest.json "${carry[@]}" \
            --unchanged shards/unchanged-*.txt \
            --keyword-unchanged shards/keyword-unchanged-*.txt
          cat shards/manifest.json
      - name: publish to the rolling releases
        # THE ORDER IS THE CONTRACT: wherever this step stops — a failed
        # upload, the 1,000-asset cap, the API rate limit, the timeout — the
        # live manifest names only assets that exist. Nothing is pruned while
        # a published manifest names it, and a manifest is published only
        # after `verify` has checked every row against the release listings.
        # One gap is `gh`'s, not this order's: `--clobber` replaces an asset
        # by deleting it first, so a dense shard the interim manifest names
        # is absent for the length of its own upload — and until the next run
        # if that upload dies, which is how the 2026-10-11 manifest came to
        # name 4 keyword assets that no longer exist. `verify` drops such a
        # row on the next run; closing the gap needs content-addressed names.
        #
        #   1. keyword shards onto their own release, where they cost
        #      `shards-latest` nothing
        #   2. an INTERIM manifest: the live dense rows, exactly as they are
        #      live, + this run's keyword section, verified. Once it is
        #      published, the only keyword rows naming `shards-latest` are
        #      the ones carried for registries no job reported on (a failed
        #      build or export, or a scoped run), which stay where their
        #      asset is; every other keyword asset there is free to go...
        #   3. ...and only as many go now as this run's NEW dense names need
        #      room for (usually none); the rest wait for the prune step
        #   4. dense shards onto `shards-latest`
        #   5. the final manifest, verified
        #
        # Verify drops rows rather than failing on them: a row whose asset is
        # gone or was replaced by a failed run's `--clobber` is refused by
        # every client anyway (the 2026-10-11 manifest has 162 dense and 149
        # keyword rows like that), and a registry with no row is rebuilt next
        # week. It refuses outright if a listing would cost over half a
        # section, which is a wrong listing rather than a broken release. The
        # interim checks only its keyword section: its dense rows are already
        # live, so re-publishing them as they are changes nothing for a
        # client, and checking them would let a release broken past half —
        # more failed weeks of `--clobber` — refuse the interim, and with it
        # the room this run needs, every week from then on.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          ensure_release() {
            if ! gh release view "$1" --repo "$REPO" >/dev/null 2>&1; then
              gh release create "$1" --repo "$REPO" \
                --prerelease --latest=false --title "$2" --notes "$3"
            fi
          }
          listing() { gh api "repos/$REPO/releases/tags/$1" > "$1.json"; }
          verify() {
            python3 scripts/publish_shards.py verify --manifest "$1" \
              --release shards-latest=shards-latest.json \
              --release shards-keyword-latest=shards-keyword-latest.json \
              "${@:2}"
          }
          delete_listed() {
            # Paced: deletes are mutations, and GitHub's secondary rate limit
            # allows ~80 a minute. A failure is reported, not fatal — the
            # asset is unnamed either way, and the next run lists it again.
            while read -r id name; do
              if gh api -X DELETE "repos/$REPO/releases/assets/$id" >/dev/null; then
                echo "pruned $name"
              else
                echo "::warning::could not delete $name ($id); the next run retries"
              fi
              sleep 1
            done < "$1"
          }
          ensure_release shards-latest "dense vector shards" \
            "Prebuilt keyless embeddings for tapped registries. Consumed by \`boost quickstart\` and \`boost reindex --fetch-shards\` via manifest.json; not a boost release."
          ensure_release shards-keyword-latest "keyword index shards" \
            "Prebuilt BM25 keyword index shards for tapped registries, named by the manifest.json on the shards-latest release. Consumed by \`boost reindex --fetch-index\`; not a boost release."

          # --clobber: these releases are mutable indexes of the current
          # shards, so a re-run replaces an asset rather than failing on it —
          # and never deletes one it does not replace, which is what lets a
          # carried-forward row keep pointing at last week's file.
          keyword=(shards/*.keyword.json.gz)
          if [ "${#keyword[@]}" -gt 0 ]; then
            gh release upload shards-keyword-latest --repo "$REPO" --clobber "${keyword[@]}"
          fi

          if [ -f previous-manifest.json ]; then
            listing shards-latest
            listing shards-keyword-latest
            if python3 scripts/publish_shards.py splice \
                 --dense previous-manifest.json --keyword shards/manifest.json \
                 --out interim/manifest.json \
               && verify interim/manifest.json --only keyword; then
              gh release upload shards-latest --repo "$REPO" --clobber interim/manifest.json
              listing shards-latest
              python3 scripts/publish_shards.py prune \
                --manifest interim/manifest.json --tag shards-latest \
                --release-json shards-latest.json --suffix .keyword.json.gz \
                --room-for shards/*.shard.json --out room.txt
              delete_listed room.txt
            else
              echo "::warning::no interim manifest this run; the dense upload gets only the room shards-latest already has"
            fi
          fi

          dense=(shards/*.shard.json)
          if [ "${#dense[@]}" -gt 0 ]; then
            gh release upload shards-latest --repo "$REPO" --clobber "${dense[@]}"
          fi
          listing shards-latest
          listing shards-keyword-latest
          verify shards/manifest.json
          gh release upload shards-latest --repo "$REPO" --clobber shards/manifest.json
      - name: prune what the published manifest does not name
        # Last, and allowed to fail: the manifest is already published, and
        # an asset it does not name is one no client reading it can reach, so
        # a run cut short here (rate limit, timeout) costs only slots, and the
        # next run lists the rest again. Without this, nothing ever left
        # either release but the keyword shards on `shards-latest`, while
        # `capacity` counts every asset there: a registry that leaves the
        # catalogue loses its rows and keeps its assets for good. Measured on
        # 2026-11-04, 11 registries the live manifest names have left it
        # (loulanyue/awesome-claude-notes is this commit's), each with a
        # dense and a keyword asset on `shards-latest`, so each release crept
        # towards the tripwire with nothing to bring it back.
        #
        # Three passes, each on a fresh listing. Keyword shards on
        # `shards-latest` go without limit: the first run after the split
        # deletes up to all 473 of them, and a keyword shard is seconds to
        # re-export. The other two are `--bounded`, because "build the
        # manifest" reads a failed fetch of last week's manifest as a first
        # run and carries nothing forward — a manifest naming only this
        # week's rebuilds, which unbounded would cost every other dense
        # shard on the release. A pass that fails or refuses does not stop
        # the next one.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          prune_unnamed() {
            # $1 tag, $2 suffix, then any extra `prune` flags. Called under
            # `||`, where `set -e` does not reach, so each failure returns.
            gh api "repos/$REPO/releases/tags/$1" > "$1.json" || return 1
            python3 scripts/publish_shards.py prune \
              --manifest shards/manifest.json --tag "$1" \
              --release-json "$1.json" --suffix "$2" "${@:3}" \
              --out prune.txt || return 1
            while read -r id name; do
              if gh api -X DELETE "repos/$REPO/releases/assets/$id" >/dev/null; then
                echo "pruned $name"
              else
                echo "::warning::could not delete $name ($id); the next run retries"
              fi
              sleep 1
            done < prune.txt
          }
          status=0
          prune_unnamed shards-latest .keyword.json.gz || status=1
          prune_unnamed shards-latest .shard.json --bounded || status=1
          prune_unnamed shards-keyword-latest .keyword.json.gz --bounded || status=1
          exit "$status"

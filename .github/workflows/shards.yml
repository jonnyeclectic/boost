name: shards

# Publish prebuilt dense-vector shards, so a keyless user gets semantic search
# without paying to embed the catalogue themselves.
#
# WHY THIS EXISTS. Embedding is ~1.2 s/chunk on CPU — measured at 4,431 s for
# 743 entries with the shipped ONNX bge-small-en-v1.5. Importing the same rows
# takes 0.12 s. Without published shards the keyless tier is available in
# principle and unreachable in practice, which is why step 2 of the
# keyless-semantic-search roadmap item is a requirement rather than an
# optimisation.
#
# TRIGGER — deliberately NOT chained off release. publish.yml already sits at
# `ci -> release -> sbom`, which is GitHub's documented three-level
# workflow_run chain limit; a fourth link would silently never fire. sbom.yml's
# header records what that failure looks like here: 253 releases, 0 runs, 0
# assets — a control that looked present and produced nothing. Shards are also
# keyed on a REGISTRY's commit, not on a boost release, so tying them to our
# release cadence would be wrong even if the chain allowed it.
#
# SCALE — one job per registry, not one job for everything. A 20-tap corpus is
# ~3.4 h of embedding against the 6 h job limit, and the full 466-registry
# catalogue is far beyond it. The matrix keeps each job to one registry and lets
# failures be per-registry rather than all-or-nothing.
#
# The largest pinned tap is `sickn33/antigravity-awesome-skills` and it is not
# "~75 min", which is what this comment used to claim: 6,309 entries become
# 77,423 chunks, and the 2026-08-16 scheduled run burned its entire
# `timeout-minutes: 330` on it and was cancelled with nothing published. Raising
# the timeout was never available — 330 is already under the 6 h ceiling.
#
# What made it fit was de-duplicating the embedding work. **68.7% of that
# registry's chunks are byte-identical repeats** (77,423 -> 24,246 distinct), and
# embeddings are deterministic, so each copy was bought at full price for the
# same vector. With that collapsed the same job **completed in 2 h 07 m** and
# published a 129 MB shard of 78,095 chunks (verified: run #4, 2026-08-17).
#
# So the per-registry budget is set by DISTINCT chunk text, not entry count. A
# registry that mirrors itself heavily is far cheaper than its size suggests;
# one that does not is the case to watch against the ceiling.

on:
  workflow_dispatch:
    inputs:
      registries:
        description: "Space-separated owner/repo list (default: the pinned eval corpus)"
        required: false
        default: ""
  schedule:
    - cron: "0 4 * * 0"        # weekly, Sunday 04:00 UTC — registries move slowly

permissions:
  contents: read

concurrency:
  group: shards-${{ github.ref }}
  cancel-in-progress: false    # never kill a half-finished embed run

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        name: choose the registries to shard
        # Defaults to tests/eval/taps.txt because that list is already pinned,
        # already covers the golden targets, and is the corpus every other gate
        # measures against — so a shard exists for the registries a new user is
        # most likely to tap first.
        # Inputs reach the shell through `env`, never through `${{ }}`
        # interpolation: a workflow_dispatch input is attacker-controlled text,
        # and interpolating it into `run:` splices it into the script itself.
        # zizmor flags this as template-injection, correctly — the first draft
        # of this file had exactly that hole.
        env:
          REGISTRIES_INPUT: ${{ inputs.registries }}
        run: |
          if [ -n "$REGISTRIES_INPUT" ]; then
            # A dispatch input IS a space-separated list of repositories, so
            # splitting it on whitespace is correct here and only here.
            repos="$REGISTRIES_INPUT"
          else
            # NOT `grep -v '^#' tests/eval/taps.txt`. A row is
            # `owner/repo <40-char sha> <entry count>`, so splitting the file on
            # whitespace splits it into FIELDS, not rows: 20 registries became a
            # 60-entry matrix — 20 repos, 20 bare SHAs and 20 integers, each
            # dispatched to a job that ran `boost tap` on it. The 2026-08-09 run
            # is full of `build (18)` and
            # `build (b29e7cf65e5cb78a5ac33d582270551bc74a14eb)`.
            # `--list-repos` prints one name per line from the same parser the
            # eval gate uses, so the row/field distinction is made once, in
            # tested Python, instead of re-decided in shell.
            repos=$(python3 scripts/eval_corpus.py --list-repos | tr '\n' ' ')
          fi
          # Split on whitespace in Python, not the shell: `printf '%s\n' $repos`
          # relies on word-splitting that does not survive quoting, and produced
          # a ONE-entry matrix holding all 20 repos as a single string — one job
          # trying to embed every registry, straight past the 6 h job limit.
          json=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split()))' "$repos")
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "sharding: $repos"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330        # under the 6 h ceiling, over the ~75 min worst tap
    strategy:
      fail-fast: false          # one bad registry must not lose the others' work
      max-parallel: 4
      matrix:
        registry: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install boost + the [rag] extra
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[rag]'
      - name: tap and embed
        env:
          BOOST_HOME: ${{ runner.temp }}/boost-home
          REGISTRY: ${{ matrix.registry }}      # via env, not interpolation
        run: |
          .venv/bin/python -m boost_cli tap "$REGISTRY"
          .venv/bin/python -m boost_cli reindex --dense
      - name: export the shard
        env:
          BOOST_HOME: ${{ runner.temp }}/boost-home
          REGISTRY: ${{ matrix.registry }}
        run: |
          safe=$(printf '%s' "$REGISTRY" | tr '/' '__')
          .venv/bin/python -m boost_cli reindex --export-shard "$REGISTRY" > "$safe.shard.json"
          python3 - "$safe.shard.json" <<'PY'
          import json, sys
          # Fail here rather than publish an unusable artifact: a shard without
          # provenance cannot be validated on import and would be refused by
          # every consumer, silently, forever.
          shard = json.load(open(sys.argv[1]))
          missing = [k for k in ("provider", "model", "dim", "commit") if not shard.get(k)]
          assert not missing, "shard is missing %s" % missing
          assert shard.get("chunks"), "shard has no chunks"
          print("shard ok: %d chunks, %s @ %s"
                % (len(shard["chunks"]), shard["model"], shard["commit"][:8]))
          PY
      - name: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Still artifacts at this stage: one job per registry cannot write a
          # manifest that describes all of them, so the matrix hands its output
          # to the `publish` job below, which assembles the manifest once and
          # puts both on a release. An artifact is not a distribution channel —
          # downloading one needs a GitHub token and it expires at 90 days,
          # which is why the release exists.
          name: shard-${{ strategy.job-index }}
          path: "*.shard.json"
          if-no-files-found: error
          retention-days: 90

  publish:
    # Assemble every shard the matrix produced into one downloadable set.
    #
    # WHY A ROLLING PRERELEASE. The assets need a stable, anonymous URL, which
    # a release asset has and an artifact does not. `shards-latest` is a fixed
    # tag so the manifest URL compiled into boost never moves, and the release
    # is marked prerelease + not-latest so it stays invisible to everything
    # that reads "the latest release": release-drafter resolves the next
    # version from published non-prereleases (publish.yml), and the README's
    # shields badge excludes prereleases too. The tag carries no digit, so
    # setuptools-scm's `--match *[0-9]*` never sees it as a version either.
    #
    # `fail-fast: false` above means some registries can fail while others
    # succeed; publishing the ones that worked is the point, so this job runs
    # on `success() || failure()` and simply publishes whatever arrived.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # create/update the rolling release + its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-*
          merge-multiple: true
          path: shards
      - name: build the manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          ls -l shards/ || { echo "no shards were produced"; exit 1; }
          python3 scripts/publish_shards.py manifest \
            --shard-dir shards --repo "$REPO" --tag shards-latest \
            --out shards/manifest.json
          cat shards/manifest.json
      - name: publish to the rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view shards-latest --repo "$REPO" >/dev/null 2>&1; then
            gh release create shards-latest --repo "$REPO" \
              --prerelease --latest=false \
              --title "dense vector shards" \
              --notes "Prebuilt keyless embeddings for tapped registries. Consumed by \`boost quickstart\` and \`boost reindex --fetch-shards\` via manifest.json; not a boost release."
          fi
          # --clobber: this release is a mutable index of the current shards,
          # so a re-run replaces an asset rather than failing on it.
          gh release upload shards-latest --repo "$REPO" --clobber \
            shards/*.shard.json shards/manifest.json

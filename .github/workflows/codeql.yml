name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday morning UTC
  # Required by branch protection, so it must also report on the merge
  # queue's temporary ref: the queue evaluates required checks against
  # gh-readonly-queue/*, NOT against the pull request. A required context
  # whose workflow lacks this trigger simply never reports there, and every
  # enqueued PR waits on it forever. check_required_checks.py enforces this.
  merge_group:

# Least-privilege default. `analyze` declares its own block, and a job-level
# block replaces this rather than merging, so its effective token is unchanged.
permissions:
  contents: read

jobs:
  codeql-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

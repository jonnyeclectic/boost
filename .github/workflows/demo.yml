name: demo

# Re-record docs/demo.gif from docs/demo.tape whenever the CLI it demonstrates
# changes, and open a PR with the new recording.
#
# The GIF is the first thing anyone sees in the README, and it is a build output
# of the tape — but recording it needed `brew install vhs` on someone's laptop,
# so in practice it drifted: a merged PR had to fix it for showing `./boost`
# instead of `boost`, long after that changed. A generated artifact whose
# regeneration is manual is one nobody regenerates.
#
# This is NOT a `--check` drift gate like the other generated files. A GIF is
# a video encode: two runs of the same tape differ byte-for-byte (timing jitter,
# frame quantisation), so "is it stale?" is not decidable by comparison. Instead
# the recording is automated and proposed as a PR, which a human can eyeball —
# the right shape for an artifact whose correctness is visual.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # The tape itself, and the surfaces whose output it shows.
      - "docs/demo.tape"
      - "boost_cli/cli.py"
      - "boost_cli/core/output.py"
      - "boost_cli/commands/discovery.py"
      - "boost_cli/commands/pkg.py"
      - "boost_cli/commands/quality.py"
      - ".github/workflows/demo.yml"
  # Record on the PR too, without opening one. This workflow failed all six of
  # its runs because it only ever ran on `main`, where a broken recorder step is
  # a red run nobody is looking at; running it on the PR that changes the tape
  # or the recorder proves the toolchain before it lands.
  #
  # The list is duplicated rather than shared through a YAML anchor: GitHub
  # Actions' workflow parser does not support anchors or aliases, so `*name`
  # here is a workflow that fails to load at all.
  pull_request:
    paths:
      - "docs/demo.tape"
      - "boost_cli/cli.py"
      - "boost_cli/core/output.py"
      - "boost_cli/commands/discovery.py"
      - "boost_cli/commands/pkg.py"
      - "boost_cli/commands/quality.py"
      - ".github/workflows/demo.yml"

permissions:
  contents: read

concurrency:
  # Per PR, NOT one global `demo` queue. A constant group name puts every run of
  # this workflow — every pull request, and main — in one queue, and
  # `cancel-in-progress` then means each new run kills whichever OTHER PR's run
  # was in flight. On 2026-08-10 #498 and #504 both touched boost_cli/cli.py,
  # which is in the path filter above, so both triggered this workflow and both
  # showed `record CANCELLED`; neither could merge, and re-running one just
  # moved the cancellation to the other. A cancelled check reports no
  # conclusion, so at the merge button it is indistinguishable from a failure,
  # and nothing on your PR names the run that killed it.
  #
  # Non-PR runs key on the commit rather than the ref, for the reason ci.yml
  # documents: `cancel-in-progress: false` means a newer run WAITS, and GitHub
  # cancels the older pending one when a third arrives — so grouping main on
  # `github.ref` can leave a middle commit whose recording never runs.
  group: demo-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the recording branch
      pull-requests: write   # open the PR carrying it
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install the recorder toolchain (ffmpeg, ttyd, vhs)
        # charmbracelet/vhs-action is gone rather than pinned forward. Its
        # installLatestFfmpeg() scans BtbN/FFmpeg-Builds' *latest* release for
        # an asset matching `ffmpeg-n5.1…linux64-gpl-5.1….tar.xz`. BtbN moved
        # past n5.1 years ago, so the loop matches nothing, the URL stays
        # undefined and the action rejects with the exact message this workflow
        # failed with six times out of six: "Failed to install ffmpeg". It is
        # not a flake and not a version to pin around — the action has had no
        # functional commit since 2024 and is broken on Linux for everyone.
        #
        # ffmpeg comes from apt (ubuntu-24.04 ships no ffmpeg). ttyd and vhs
        # come from GitHub release *asset ids*, which are immutable, rather
        # than tag URLs, which are not. vhs also publishes a sha256 through the
        # releases API, so that one is verified outright.
        env:
          GH_TOKEN: ${{ github.token }}
          VHS_VERSION: "0.11.0"
          # sha256 of vhs_0.11.0_Linux_x86_64.tar.gz, from the releases API.
          VHS_SHA256: "99cb634587eaae0473c1ea377db80c3a048c27f99fe0a7febb1a1e8cb7ee5009"
          TTYD_ASSET_ID: "159377628"   # tsl0922/ttyd 1.7.7 · ttyd.x86_64
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-jetbrains-mono
          mkdir -p "$HOME/.local/bin"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/octet-stream" \
               -o "$HOME/.local/bin/ttyd" \
               "https://api.github.com/repos/tsl0922/ttyd/releases/assets/$TTYD_ASSET_ID"
          chmod +x "$HOME/.local/bin/ttyd"

          curl -fsSL -o /tmp/vhs.tar.gz \
               "https://github.com/charmbracelet/vhs/releases/download/v${VHS_VERSION}/vhs_${VHS_VERSION}_Linux_x86_64.tar.gz"
          echo "${VHS_SHA256}  /tmp/vhs.tar.gz" | sha256sum -c -
          tar -xzf /tmp/vhs.tar.gz -C /tmp
          install -m 0755 "/tmp/vhs_${VHS_VERSION}_Linux_x86_64/vhs" "$HOME/.local/bin/vhs"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: recorder versions
        # Printed unconditionally: when a recording looks wrong, the first
        # question is always which encoder produced it.
        run: |
          ffmpeg -version | head -1
          ttyd --version
          vhs --version
      - name: record docs/demo.gif
        # vhs drives a real PTY through ttyd and encodes with ffmpeg. The tape
        # sets its own throwaway $HOME, so the recording never touches the
        # runner's state. CI= unset and COLORTERM=truecolor are what vhs-action
        # used to export: without them termenv strips the ANSI colour the demo
        # exists to show.
        env:
          CI: ""
          COLORTERM: truecolor
        run: vhs docs/demo.tape
      - name: upload the recording (pull requests)
        # On a PR there is nothing to open a PR against — the artifact is how a
        # reviewer eyeballs what this branch's recorder actually produced.
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
      - name: open a PR if the recording changed
        # A GIF re-encode always differs byte-for-byte, so `git diff --quiet` is
        # not a meaningful staleness test — this always has something to push,
        # and the PR is where a human decides whether it looks right.
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: docs/demo.gif
          branch: bot/demo-gif
          delete-branch: true
          commit-message: "docs(demo): re-record demo.gif against the current CLI"
          title: "docs(demo): re-record demo.gif against the current CLI"
          body: |
            Automated re-recording of `docs/demo.gif` from `docs/demo.tape`,
            triggered because the CLI surfaces it demonstrates changed.

            A GIF re-encode always differs byte-for-byte, so this PR existing
            does **not** mean the demo was wrong — open the file and check that
            what it shows still matches what `boost` does. Close it if not.

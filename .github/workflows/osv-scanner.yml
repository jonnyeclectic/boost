name: osv-scanner

# OSV-Scanner, PR-diff mode: flags known vulnerabilities in dependencies a PR
# *introduces*, cross-checked against the OSV database (broader ecosystem
# coverage than a single-language audit). The SBOM/manifest complement to the
# pip-audit env scan — one scans the resolved env, the other the manifest.
#
# Scoped to pull_request on purpose: it reports only NEW vulns, so it never
# trips on the accepted, documented old-langchain pin in the `[eval]` extra
# (ragas requires it — see pyproject.toml). A full-repo scan would; this diffs
# the PR against its base and only fails on what the PR adds.

on:
  pull_request:
    branches: [main]
  # Required by branch protection, so it must also report on the merge
  # queue's temporary ref: the queue evaluates required checks against
  # gh-readonly-queue/*, NOT against the pull request. A required context
  # whose workflow lacks this trigger simply never reports there, and every
  # enqueued PR waits on it forever. check_required_checks.py enforces this.
  merge_group:

permissions: {}   # granted narrowly per-job below

jobs:
  scan-pr:
    permissions:
      actions: read
      contents: read
      security-events: write   # the reusable workflow uploads SARIF to code scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

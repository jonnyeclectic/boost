name: visual

# Visual-regression sweep: load each hand-authored docs page in headless
# Chrome at 5 responsive breakpoints and assert the invariants a CSS slip
# actually breaks — no horizontal overflow, the Aurora stylesheet applied,
# the content chrome present. This is the check that caught three real
# mobile-overflow bugs (a bare table on eval + adapters, a grid min-width
# blowout on mcp-hub) when it landed. Screenshots upload on failure.
# Harness: tests/visual/visual_check.mjs (puppeteer-core over pipe transport).

on:
  push:
    branches: [main]
    paths: ["docs/**.html", "style/**", "tests/visual/**", ".github/workflows/visual.yml"]
  pull_request:
    paths: ["docs/**.html", "style/**", "tests/visual/**", ".github/workflows/visual.yml"]

permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # `npm ci` from tests/visual/package-lock.json. package.json pins the two
      # direct deps exactly, but their 79 transitive packages resolved fresh on
      # every run until the lock was committed.
      - name: install harness deps (hash-pinned)
        working-directory: tests/visual
        run: npm ci --no-audit --no-fund
      - name: render sweep (system Chrome)
        # ubuntu-latest images ship google-chrome stable at /usr/bin.
        run: node tests/visual/visual_check.mjs
      - name: axe-core sweep (WCAG 2.1 A/AA)
        # The half of the a11y audit that needs a live DOM: contrast as
        # RENDERED (text over the glass panels and the gradient, which no
        # token-pair table can predict), ARIA validity against the computed
        # tree, landmarks, focusable-but-hidden elements. The markup-decidable
        # half is scripts/a11y_check.py in the required lint job.
        # `if: always()` so a render failure doesn't hide an a11y failure.
        if: always()
        run: node tests/visual/a11y_check.mjs
      - name: upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-sweep-screenshots
          path: tests/visual/out/

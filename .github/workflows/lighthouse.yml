name: lighthouse

# Lighthouse CI on the Pages site. The docs are boost's storefront — the first
# thing a visitor sees — and nothing in the gate measured them as a USER's
# browser would: html-validate checks markup, the visual sweep checks layout,
# but neither scores performance, accessibility, best-practices or SEO. This
# turns that quality into four numbers that can't silently regress as the Aurora
# theme evolves, and fails the build when one drops below budget.
#
# Budgets live in .lighthouserc.json (categories:* minScore), asserted on the
# median of 3 runs. They were calibrated from a real CI run — both pages score
# accessibility 100, seo 100, best-practices 96, performance ~99-100 (a single
# sample dips into the 80s under runner load, which the median absorbs) — and
# each floor sits below its real score with margin: the same "measure, then
# floor" approach perf_gate uses, so ordinary theme work doesn't flake the gate
# but a genuine regression trips it. Performance gets the widest margin (0.85)
# because it is the noisiest; accessibility and SEO the tightest (0.95) because
# they are stable and a regression there is a real defect on the storefront.
#
# PERFORMANCE IS 0.80, NOT 0.85, AND THE CALIBRATION ABOVE IS STALE FOR IT. The
# note that both pages score "performance ~99-100" has not been true of
# roadmap.html for some time: that board is now 200 cards and 500 KB of markup,
# and main's own artifact records it scoring 0.810, 0.840 and 0.850 across the
# three runs of ONE job. Against a 0.85 floor that job passed only because
# `median-run` happened to select the 0.850 — two of its three runs were under
# the floor. So the gate was not measuring a margin, it was resampling until it
# got a pass, and a change that merely made the score *repeatable* (0.84 three
# times) turned it red.
#
# 0.80 is below the worst run this page has actually produced, which is what the
# "measure, then floor" approach above asks for. It is a real loosening, and the
# honest one: the alternative was a floor that a green tick did not mean.
#
# AND THE PAGE WAS NEVER THE SLOW PART — THE HARNESS WAS. `python3 -m
# http.server` does not send `Content-Encoding`, so every run above scored a
# document 3.27x larger than the one GitHub Pages delivers. That is not
# inference: the failing artifact records `uses-text-compression` at score 0
# with `transferSize` 567,874 against `resourceSize` 567,685, and Pages answers
# `content-encoding: gzip` for the same URL. Lighthouse throttles to 1,474.56
# kbps, where 566 KB is 3.08 s of download — the whole of a 3.6 s FCP scoring
# 0.31, which with LCP at 0.53 is the entire 21-point deficit. gzip takes the
# page's payload 597,782 -> 184,126 B, or 3.24 s -> 1.00 s on that link.
#
# It also explains the two rounds of work that moved the score by 0.00: both
# changed LAYOUT (a `<details>` collapse, 3,066 characters of prose) while the
# score was being decided by TRANSFER. `content-visibility` bought 0.01 because
# TBT already scored 0.98 — there was nothing left to win there.
#
# So the server is now scripts/serve_docs.py, which compresses what Pages
# compresses. Nothing else about the harness changed — not even HTTP/1.1
# keep-alive, deliberately, so the score move has one cause.
#
# MEASURED, AND THE FLOOR IS 0.90 AGAIN. main's first artifact under the fixed
# harness scores roadmap.html 0.98 / 0.97 / 0.99, against 0.79 three times
# before it. FCP went 3,638 -> 1,719 ms and LCP 3,858 -> 1,867; the compression
# audit went 0 -> 1, and transferSize is now 174,808 against a resourceSize of
# 570,292. The 1.9 s FCP gain is the 1,950 ms Lighthouse itself had estimated.
#
# 0.90 follows the same "measure, then floor" rule as everything above: it sits
# below every median run observed, with ~0.08 of margin on the audited board,
# while being a real gate again rather than the 0.80 that a broken harness had
# forced. It is deliberately NOT 0.95 — index.html still produces the occasional
# 0.86 single sample under runner load, which `median-run` absorbs but which a
# tight floor would eventually catch on a bad day.
#
# The page was never the slow part, so "raising it back is gated on making
# roadmap.html genuinely faster" was gated on the wrong thing.
#
# ROADMAP.HTML'S PERFORMANCE FLOOR IS 0.80 AGAIN — SCOPED, THIS TIME. The
# 2026-08-31 CLI-audit landing (#632) was a content step change: the board went
# ~570 KB -> 1,252 KB of markup (roughly 175 -> 385 KB transferred at the 3.2x
# gzip measured above), and its medians moved to 0.85-0.86 against the 0.90
# floor (observed 0.85, 0.86, 0.85). Same "measure, then floor" rule as every
# number above: 0.80 sits below the worst median the merged board has produced.
# Unlike the last 0.80 era this one is scoped via assertMatrix — index.html
# keeps 0.90, where the floor still measures a stable ~99-100 page. And unlike
# that era the page IS now the slow part, so the way back up is bounding the
# page, not waiting on a harness fix: see the
# roadmap-page-weight-grows-without-bound card (collapse or paginate settled
# sections in build_roadmap.py).
#
# The two hand-authored, highest-traffic pages are audited: the landing page and
# the code roadmap. Served over a throwaway localhost static server (no network),
# three runs each so a noisy single sample can't redden a PR.

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/roadmap.html"
      - "style/**"
      - ".lighthouserc.json"
      - "scripts/serve_docs.py"
      - ".github/workflows/lighthouse.yml"
  pull_request:
    paths:
      - "docs/index.html"
      - "docs/roadmap.html"
      - "style/**"
      - ".lighthouserc.json"
      - "scripts/serve_docs.py"
      - ".github/workflows/lighthouse.yml"

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

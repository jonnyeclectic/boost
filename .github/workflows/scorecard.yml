name: scorecard

# OpenSSF Scorecard: scores the repo's supply-chain security posture — branch
# protection, pinned dependencies, token permissions, dangerous workflows,
# maintained-ness — and uploads the findings to the Security tab. A holistic
# complement to the per-issue scanners already in CI (CodeQL, zizmor, gitleaks,
# pip-audit). It reports a score; it does not gate a merge.
#
# Runs on main + weekly (where it publishes the public score badge), NOT on
# pull_request: Scorecard's SARIF carries error-level findings for posture gaps
# boost has by design (e.g. no fuzzing), which code-scanning surfaces as a red
# `Scorecard` check on every PR — noise, since the score is informational.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish the score to the OpenSSF API (non-PR)
      contents: read           # checkout
      actions: read            # read workflow run data for the checks
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the public score (badge) — all triggers here run on the
          # default branch context, so publishing is always valid.
          publish_results: true
      - name: upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4.37.2
        with:
          sarif_file: results.sarif

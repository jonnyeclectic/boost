name: boost-langchain

# Opt-in: does the LangChain integration — the boost_langchain package that
# ships INSIDE the boost-skill-cli wheel, behind the [langchain] extra —
# still install, pass its tests, and package cleanly against the live
# langchain stack?
#
# This is deliberately OUT of the release gate (ci.yml). boost's default
# install stays zero-dependency and its own suite proves that; the required
# gate never imports boost_langchain (import-linter forbids the CLI from
# reaching into it, and tests/langchain skips itself without the extra).
# This leg is the ONLY place the real langchain-core/langgraph stack is
# installed, so coupling boost's PyPI release to whether that stack resolves
# today would let upstream drift redden a release whose runtime never
# imports it — the same reasoning adapter-conformance.yml documents for
# CrewAI and the Agents SDK. Run it manually before shipping a change under
# boost_langchain/, and weekly to catch upstream breakage early. It never
# blocks a merge.
on:
  workflow_dispatch:
  # Also on PRs that touch the thing under test — the adapter-conformance
  # lesson: a leg nothing exercises on its own pull request merges broken and
  # sits until the weekly cron is the first thing to run it. Deliberately
  # narrow: this job installs the langchain/langgraph stack, far too slow to
  # hang off every PR. pyproject.toml is NOT in the filter on purpose — the
  # [langchain] extra lives there, but so does every other config table, and
  # a leg that fires on each ruff-ignore edit stops being narrow; the weekly
  # cron bounds how long an extra-pin regression can hide.
  #
  # This stays path-filtered, which means it MUST NOT be added to the required
  # status checks (.github/required-checks.txt explains the rule): a required
  # context that does not report on a given PR leaves that PR pending forever.
  # It is early signal, never a gate.
  pull_request:
    paths:
      - "boost_langchain/**"
      - "tests/langchain/**"
      - ".github/workflows/boost-langchain.yml"
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC — early warning on upstream drift

# Least-privilege default. `conformance` declares its own block, and a job-level
# block replaces this rather than merging, so its effective token is unchanged.
permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    name: boost-langchain conformance
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # boost's floor. The main suite already proves 3.12-3.14; running the
          # integration on the floor means a green run here can't be hiding a
          # syntax or stdlib feature the oldest supported interpreter lacks.
          python-version: "3.12"
      - name: git identity (fixture repos)
        # The integration tests build their corpus with tests/make_fixture.py +
        # `boost tap`, which commit a fixture repo — commits need an identity.
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install boost with the [langchain] extra + suite deps
        # langgraph is not in the extra (the graph node is langchain_core-only
        # by design); the StateGraph smoke test needs the real thing, so this
        # leg installs it alongside, with the same bounds the test targets.
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[langchain]' 'langgraph>=1,<2' 'pytest>=8'
      - name: run the integration test suite
        # Explicit path, root config: tests/langchain sits inside the main
        # suite's tree now, so the root pyproject's pytest configuration
        # (filterwarnings, addopts) governs — and the suite must be green
        # under it, because that is exactly how a contributor runs it.
        run: .venv/bin/pytest tests/langchain -q
      - name: assert the suite RAN rather than skipped itself
        # tests/langchain importorskips langchain_core, so a broken extra
        # install would make the previous step pass with 0 tests — the
        # exact "green means nothing" failure this leg exists to prevent.
        run: |
          count="$(.venv/bin/pytest tests/langchain -q --collect-only 2>/dev/null | grep -c '::' || true)"
          echo "collected $count tests"
          if [ "$count" -lt 10 ]; then
            echo "only $count tests collected — the langchain suite is skipping itself"; exit 1
          fi
      - name: build the dist and prove the wheel carries the integration
        # Tooling from the hash-pinned release-tools lock, same reasoning as
        # package-metadata.yml: a twine verdict that changes on an upstream
        # release of twine is a verdict about twine. Installed AFTER the test
        # run so the lock's exact pins can never quietly repin something the
        # langchain stack resolved for the tests. The zipgrep assertions are
        # the point of the fold: the SAME wheel that publishes on every merge
        # must contain boost_langchain and declare the [langchain] extra.
        run: |
          .venv/bin/pip -q install -r requirements/release-tools.txt
          .venv/bin/python -m build
          .venv/bin/twine check dist/*
          whl=(dist/*.whl); whl="${whl[0]}"
          unzip -l "$whl" | grep -q "boost_langchain/__init__.py" \
            || { echo "wheel is missing boost_langchain"; exit 1; }
          unzip -l "$whl" | grep -q "boost_langchain/py.typed" \
            || { echo "wheel is missing py.typed"; exit 1; }
          unzip -p "$whl" '*.dist-info/METADATA' | grep -q '^Provides-Extra: langchain$' \
            || { echo "wheel METADATA does not declare the [langchain] extra"; exit 1; }
          echo "wheel carries boost_langchain + py.typed + the [langchain] extra"

name: pip-audit

# CVE gate: fail when a resolved dependency matches a known OSV / PyPI advisory.
# Dependabot opens update PRs but never blocks a merge on a live CVE — this does.
# Audits the project dependency closure (`pip-audit .`), not the ambient runner
# environment, so the result is deterministic (no flaky pip/setuptools noise).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-disclosed CVE against an already-merged dep surfaces
    # without waiting for the next code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        # Hash-pinned (requirements/release-tools.txt, generated from the .in by
        # scripts/lock_toolchain.py) — that file exists to mirror exactly this
        # workflow. An unpinned `pip install pip-audit` meant the auditor itself
        # floated, so a gate verdict could change with no commit behind it.
        run: python -m pip -q install -r requirements/release-tools.txt
      - name: Audit project dependencies
        run: pip-audit --strict --progress-spinner off .

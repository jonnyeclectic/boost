name: pip-audit

# CVE gate: fail when a resolved dependency matches a known OSV / PyPI advisory.
# Dependabot opens update PRs but never blocks a merge on a live CVE — this does.
# Audits the project dependency closure (`pip-audit .`), not the ambient runner
# environment, so the result is deterministic (no flaky pip/setuptools noise).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly-disclosed CVE against an already-merged dep surfaces
    # without waiting for the next code change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit project dependencies
        run: pip-audit --strict --progress-spinner off .

name: ci-failure-alert

# Free, GitHub-native alerting: when a watched workflow fails on the default
# branch, open (or update) a tracking issue so a red main is impossible to miss
# without any paid monitoring service. `workflow_run` only fires from the
# default branch, so this never nags on PR-branch failures.
#
# `demo` is watched because it was the case this alerting missed entirely: it
# failed six runs out of six on main, alerted nobody, and was found by a manual
# audit instead. Any workflow that runs on main and nobody watches belongs here.
#
# That rule was written here and then not applied: the list stayed at `ci` and
# `demo` while TWENTY-FOUR other workflows ran unattended, fourteen of them on a
# cron. It cost exactly what you would expect. `fuzz` failed three scheduled
# runs out of three (2026-07-25/08-01/08-08), each time writing the same
# libFuzzer reproducer for a real defect in registry.parse_spec, and nobody
# looked for three weeks. `shards` failed both of its scheduled runs and
# published zero artifacts, which is how a feature reached a state where it had
# never once worked. Neither produced a notification: a cron job's failure is a
# red square on a page nobody opens.
#
# The list is now ENFORCED, not curated —
# tests/unit/test_failure_alerting_covers_unattended.py fails the build when a
# workflow runs unattended and is neither watched here nor listed in that file's
# EXPECTED_UNWATCHED with a reason. So a new scheduled workflow cannot quietly
# join the blind spot.

on:
  workflow_run:
    workflows: ["adapter-conformance", "boost-langchain", "ci", "codeql",
      "demo", "eval-corpus-refresh", "eval-explain", "eval-scale",
      "eval-stats", "floors", "fuzz", "html-validate", "licenses",
      "lighthouse", "links", "lock-refresh", "markdownlint",
      "package-metadata", "pip-audit", "post-deploy", "prose-lint",
      "scorecard", "shards", "sonarcloud", "theme-lint", "visual"]
    types: [completed]

# Nothing at the workflow level: `issues: write` granted here reaches every job,
# and zizmor's excessive-permissions audit is right that a second job made that
# visible. Each job asks for it on its own.
permissions: {}

jobs:
  open-issue:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: open or update the CI-failure tracking issue
        # (see close-issue below: this half only ever opens)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const label = 'ci-failure';
            // Keyed by workflow: with one shared marker, a `demo` failure
            // would comment on an open `ci` tracker and read as the same
            // outage. Pre-existing issues carry the unkeyed marker and simply
            // stop matching — they are closed by hand once, not migrated.
            const marker = `<!-- ci-failure-tracker:${run.name} -->`;

            // Ensure the label exists (creating an issue with a missing label errors).
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'Automated tracker for CI failures on main',
              });
            }

            const note =
              `\`${run.name}\` failed on \`main\` — commit ${run.head_sha}\n` +
              `run: ${run.html_url} (attempt ${run.run_attempt})`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            });
            const hit = open.data.find(i => (i.body || '').includes(marker));

            if (hit) {
              // Already tracking — append a comment instead of opening a duplicate.
              await github.rest.issues.createComment({
                owner, repo, issue_number: hit.number,
                body: `Still failing — ${note}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo, labels: [label],
                title: `CI failing on main (${run.name})`,
                body: [
                  marker,
                  `The **${run.name}** workflow is failing on \`main\`.`,
                  '',
                  note,
                  '',
                  'Opened automatically; updated on repeat failures, and ' +
                  'closed automatically once this workflow is green on main.',
                ].join('\n'),
              });
            }

  # The other half, and it was missing. The tracker opened issues and commented
  # on them and never closed one, so its own instruction — "close this once CI
  # is green again" — was a manual step nobody had a reason to take. The result
  # is an issue list that reads as a list of live outages and is not: `visual`
  # was fixed and green for four consecutive runs while its tracker stayed open,
  # which makes every OTHER open tracker look equally suspect. An alert that
  # cannot stand down is only half an alert.
  close-issue:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - name: close the tracking issue once this workflow is green again
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            // The same key the opener writes, so a `ci` success can never close
            // a `demo` tracker. Issues carrying the older unkeyed marker do not
            // match and are still closed by hand, exactly as the opener says.
            const marker = `<!-- ci-failure-tracker:${run.name} -->`;

            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ci-failure', per_page: 20,
            });
            const hit = open.data.find(i => (i.body || '').includes(marker));
            if (!hit) return;   // nothing tracking this workflow — the normal case

            await github.rest.issues.createComment({
              owner, repo, issue_number: hit.number,
              body: `Green again — \`${run.name}\` passed on \`main\` ` +
                    `(commit ${run.head_sha})\nrun: ${run.html_url}`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: hit.number,
              state: 'closed', state_reason: 'completed',
            });

name: theme-lint

# Lint the shared theme assets — style/boost.css (stylelint) and
# style/boost.js (eslint). The stylesheet is the single source of the Aurora
# design system (docs pages + the token-parity test build on it), so a syntax
# slip or inconsistent notation propagates everywhere at once.
#
# Config notes (.stylelintrc.json): extends stylelint-config-standard with the
# file's deliberate idioms switched off —
#   - compact multi-declaration lines + section-comment organization
#     (single-line-max-declarations, *-empty-line-before, duplicate/descending
#     selectors: the sheet is organized by concern-section on purpose);
#   - -webkit- prefixes (Safari still needs them for backdrop-filter and
#     background-clip: text);
#   - classic media-query prefix notation is ENFORCED ("prefix") rather than
#     range syntax, which older Safari silently ignores;
#   - value-keyword-case off so font names keep conventional casing
#     (BlinkMacSystemFont, SFMono-Regular).
# Everything else — modern color notation, shorthand hex, real syntax errors,
# duplicate properties — is enforced.

on:
  push:
    branches: [main]
    paths: ["style/**", ".stylelintrc.json", "eslint.config.mjs", "package.json", "package-lock.json", ".github/workflows/theme-lint.yml"]
  pull_request:
    paths: ["style/**", ".stylelintrc.json", "eslint.config.mjs", "package.json", "package-lock.json", ".github/workflows/theme-lint.yml"]

permissions: {}

jobs:
  theme-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # `npm ci` from the committed package-lock.json, NOT `npm install <pkg>@16`:
      # a major-range install re-resolves the whole transitive tree on every run,
      # so the linter CI executes was never the linter anyone reviewed. The lock
      # pins all 181 packages by integrity hash. It lives at the repo root
      # because .stylelintrc.json's `extends: stylelint-config-standard` resolves
      # modules from the config file's directory — a node_modules under tests/
      # would not be found.
      - name: install linters (hash-pinned)
        run: npm ci --no-audit --no-fund
      - name: stylelint (style/boost.css)
        run: ./node_modules/.bin/stylelint "style/**/*.css"
      - name: eslint (style/boost.js)
        run: ./node_modules/.bin/eslint style/

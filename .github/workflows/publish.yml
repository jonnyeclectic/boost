name: publish

# Publishes boost-cli to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secret needed, but it
# requires one-time setup on PyPI by the project owner:
#   pypi.org → your account → Publishing → add a "pending publisher":
#     project:     boost-cli
#     owner:       jonnyeclectic
#     repository:  boost
#     workflow:    publish.yml
#     environment: pypi
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist + wheel
        run: |
          python -m pip -q install build twine
          python -m build
          twine check dist/*
      - name: smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip -q install dist/*.whl
          /tmp/wheel-venv/bin/boost --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

name: release

# Fully automated release. When CI passes on main, this:
#   1. resolves the next version (release-drafter, from PR labels; patch by
#      default) and publishes a GitHub Release + tag,
#   2. builds that exact version (setuptools-scm reads the version from the
#      tag — no constant to bump, no drift), and
#   3. pushes it to PyPI via Trusted Publishing (OIDC).
# All three happen in one job, so we never rely on the release event to
# trigger a second workflow (events created with GITHUB_TOKEN don't do that).
# No manual "publish release" click.
#
# NOTE: the filename must stay `publish.yml` — PyPI's Trusted Publisher is
# matched on the workflow filename. The PyPI config (already set up for 1.0.1):
#   pypi.org -> Publishing -> Trusted Publisher
#   project boost-skill-cli, owner jonnyeclectic, repo boost,
#   workflow publish.yml, environment pypi

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}   # manual release button, same pipeline

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the tag + GitHub Release
  id-token: write   # OIDC for PyPI Trusted Publishing

jobs:
  release:
    # gate on CI success; workflow_dispatch carries no workflow_run payload
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0    # full history + tags for setuptools-scm
          persist-credentials: false

      - name: publish GitHub release (creates the tag)
        id: release
        uses: release-drafter/release-drafter@eada3c96a64734dd381cfbda23511034e328ddb0 # v7.6.0
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: build the tagged version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.release.outputs.resolved_version }}
        run: |
          python -m pip -q install build twine
          python -m build
          twine check dist/*

      - name: smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip -q install dist/*.whl
          /tmp/wheel-venv/bin/boost --version

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

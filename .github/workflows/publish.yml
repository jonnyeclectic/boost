name: release

# Fully automated release. When CI passes on main, this:
#   1. resolves the next version (release-drafter, from PR labels; patch by
#      default) and publishes a GitHub Release + tag,
#   2. builds that exact version (setuptools-scm reads the version from the
#      tag — no constant to bump, no drift), and
#   3. pushes it to PyPI via Trusted Publishing (OIDC).
# All three happen in one job, so we never rely on the release event to
# trigger a second workflow (events created with GITHUB_TOKEN don't do that).
# No manual "publish release" click.
#
# NOTE: the filename must stay `publish.yml` — PyPI's Trusted Publisher is
# matched on the workflow filename. The PyPI config (already set up for 1.0.1):
#   pypi.org -> Publishing -> Trusted Publisher
#   project boost-skill-cli, owner jonnyeclectic, repo boost,
#   workflow publish.yml, environment pypi

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}   # manual release button, same pipeline

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege at the workflow level. While this workflow had exactly one
# job the distinction did not exist — the workflow-level block *was* that job's
# block — so the release's write scopes lived here harmlessly. With `guard`
# alongside it they would also be handed to a job that only reads tags, which is
# what zizmor's excessive-permissions audit flags. Every write scope now sits on
# the job that actually needs it.
permissions:
  contents: read

jobs:
  guard:
    # Gate on CI success; workflow_dispatch carries no workflow_run payload.
    #
    # The other two conditions are what keep this trigger from being reachable
    # by anyone with a fork. `branches: [main]` above filters on the TRIGGERING
    # run's head_branch, not on the event type and not on the repository — and
    # ci.yml runs on `pull_request`, so a fork PR opened from a branch that
    # happens to be named `main` produces a ci run whose head_branch is `main`
    # and satisfies that filter. If it went green, this job fired with
    # contents:write and PyPI Trusted-Publishing OIDC and cut a real release.
    # Nothing else stood in the way: the `pypi` environment has no protection
    # rules and no deployment branch policy.
    #
    # It was never code execution — the checkout below pins `ref: main` — but an
    # outsider could force an unreviewed version bump, tag and PyPI upload at
    # will. Requiring the triggering run to be a `push` from THIS repository
    # closes it; releases are cut by pushes to main, never by pull requests.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.event == 'push'
              && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # only reads tags; the release job keeps the write scopes
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0    # all tags — the guard reads them
          persist-credentials: false

      - name: skip a commit PyPI already has
        id: guard
        # `ref: main` above is deliberate — a release ships the tip, not the
        # commit that fired the trigger. What that costs is idempotence: two
        # merges landing minutes apart produce two ci runs, both of which
        # resolve main to the SAME tip, so the second run releases a commit the
        # first already shipped, under a second version number. 1.0.282/1.0.283
        # were kept apart by spacing the merges by hand.
        #
        # The guard asks PyPI rather than looking for a tag, because the
        # documented recovery from a failed upload is to re-run the failed
        # release run — and at that point HEAD *is* tagged from the first
        # attempt. Only PyPI distinguishes "already published" from "tagged but
        # the upload died". See scripts/release_guard.py.
        #
        # A separate job (not a step) so a skip costs one short runner rather
        # than an `if:` on every step of the release job, where one forgotten
        # condition would mean a half-executed release.
        run: python3 scripts/release_guard.py --project boost-skill-cli

  release:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: pypi
    permissions:
      contents: write      # create the tag + GitHub Release
      id-token: write      # OIDC for PyPI Trusted Publishing
      attestations: write  # sign SLSA build-provenance for the dist artifacts
      actions: read        # read the sibling gate workflows' run status (preflight)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0    # full history + tags for setuptools-scm
          persist-credentials: false

      - name: require the sibling release gates to be green
        # Verify the gates against the commit THIS JOB CHECKED OUT, which is not
        # necessarily the commit whose ci fired the trigger. `ref: main` above
        # resolves to main's tip at checkout time, so when two merges land close
        # together the trigger can carry commit A's verdict while the job builds
        # commit B. Observed: ci for ecfe38bc completed 20:19:05Z, this workflow
        # started 20:19:07Z, and it shipped c1727bac as v1.0.271 while
        # c1727bac's own ci was still running. Hence `git rev-parse HEAD` — not
        # the trigger sha — because that is the commit about to be built.
        #
        # The --require list is every required context's workflow that actually
        # runs on a push to main, so the release waits for the shipped sha's own
        # verdicts rather than inheriting another commit's:
        #   ci.yml               14 of the 18 required contexts
        #   codeql.yml           codeql-analyze
        #   pip-audit.yml        live CVEs in the dependency closure
        #   package-metadata.yml twine --strict + wheel contents
        # osv-scanner.yml is deliberately NOT here. It is pull_request-scoped by
        # design (it uses the -reusable-pr diff workflow so it reports only what
        # a PR *adds*, and a full-repo scan would trip the accepted old-langchain
        # pin in the [eval] extra). `scan-pr / osv-scan` therefore cannot report
        # for any commit on main, and requiring it would fail every release.
        #
        # Runs BEFORE release-drafter: a blocked release must leave no published
        # GitHub Release or tag behind. The timeout is generous because ci now
        # has to finish for the shipped sha, and ci's wall clock is dominated by
        # runner queueing when several branches are in flight; failing closed on
        # a slow-but-green ci would be a worse outcome than waiting.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_preflight.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$(git rev-parse HEAD)" \
            --timeout-seconds 3600 \
            --require ci.yml \
            --require codeql.yml \
            --require pip-audit.yml \
            --require package-metadata.yml

      - name: publish GitHub release (creates the tag)
        id: release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: build the tagged version
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.release.outputs.resolved_version }}
        run: |
          python -m pip -q install build twine
          python -m build
          twine check dist/*

      - name: attest build provenance (SLSA)
        # A cryptographically signed, verifiable record of WHICH workflow built
        # WHICH artifact from WHICH commit, layered on top of PyPI Trusted
        # Publishing. Consumers can then run
        #   gh attestation verify <file> --repo jonnyeclectic/boost
        # on the wheel/sdist they installed. No paid signing service. Runs after
        # `twine check` so only a valid dist is ever attested, and before the
        # PyPI upload so the exact bytes that get published are the ones signed.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip -q install dist/*.whl
          /tmp/wheel-venv/bin/boost --version

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

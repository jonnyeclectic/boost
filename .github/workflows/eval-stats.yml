name: eval-stats

# Tier 1b: retrieval-significance monitor (ranx paired t-test, `--stats`).
#
# The required PR gate floors BM25 recall@k (deterministic, pure-stdlib). This
# is the complementary question that floor can't answer: is one engine's lead
# over another *statistically significant*, or just numerically higher on the
# golden set? A NON-BLOCKING monitor — it runs on a schedule and on demand,
# reports each metric's p-value to the run summary, and never gates a merge.
# Unlike eval-explain it needs NO secrets: BM25 + the ranx t-test are fully
# offline, so it always runs (given network to tap the pinned corpus).
#
# Do NOT add this to branch protection's required checks.

on:
  workflow_dispatch:            # run manually from the Actions tab
  schedule:
    - cron: "0 6 * * 2"         # weekly, Tuesday 06:00 UTC (a day off eval-explain)
  pull_request:
    types: [labeled]            # or run on a PR by adding the 'check-stats' label

permissions:
  contents: read

concurrency:
  group: eval-stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  significance:
    # schedule/dispatch always run; the pull_request trigger only fires for the
    # 'check-stats' label so a random label doesn't spend a CI minute.
    if: github.event_name != 'pull_request' || github.event.label.name == 'check-stats'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write            # push the branch carrying the refreshed metrics
      pull-requests: write       # open the PR that carries it
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # tags for setuptools-scm version resolution
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: git identity (fixture repos)
        run: |
          git config --global user.email ci@boost.test
          git config --global user.name "Boost CI"
      - name: install boost + the [eval] extra (ranx)
        run: |
          python -m venv .venv
          .venv/bin/pip -q install -e '.[eval]'
      - name: tap the pinned corpus (so the golden skills exist)
        run: BOOST_HOME="$PWD/.eval-home" bash scripts/ensure_eval_corpus.sh
      - name: run the significance test (ranx)
        run: |
          # No fail-under: a monitor, not a gate. The script exits 0 and prints
          # a hint when ranx is somehow absent (nothing to compare).
          BOOST_HOME="$PWD/.eval-home" .venv/bin/python scripts/eval_retrieval.py \
            --build -k 10 --stats --json > stats.json 2> stats.err || true
          cat stats.err || true
      - name: report to run summary
        if: always()
        run: .venv/bin/python scripts/eval_stats_summary.py stats.json >> "$GITHUB_STEP_SUMMARY"

      # ---- publish the numbers -------------------------------------------
      # docs/eval-latest.json is the small public payload the docs site and the
      # portfolio read, so the figures either page shows are the ones this run
      # measured rather than whatever was hand-typed when the page was written.
      # Scheduled runs only: a pull_request run must not commit to main, and a
      # PR's numbers are not "the current state" anyway.
      - name: refresh docs/eval-latest.json
        if: github.event_name != 'pull_request'
        run: |
          .venv/bin/python scripts/publish_eval_json.py \
            --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      # It used to `git push … HEAD:main` from here, and could never work. main
      # carries a ruleset with a `pull_request` rule and an EMPTY bypass list, so
      # no token — not this one, not a PAT, not any bot — can push to it, and
      # every scheduled run died on `GH013: Repository rule violations found for
      # refs/heads/main`. Adding a bypass actor to publish a metrics file would
      # open the protection guarding every other change to main, which is a bad
      # trade for a docs payload.
      #
      # So it goes through a pull request, the same way eval-corpus-refresh.yml
      # lands its moved pins — one long-lived branch that each run updates in
      # place, rather than a new PR a week.
      - name: say what will be published
        id: body
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "text<<PRBODY"
            echo "The weekly significance run measured new numbers for"
            echo "\`docs/eval-latest.json\`, the payload the docs site and the"
            echo "portfolio read. Merging republishes the figures those pages"
            echo "show; declining leaves them at the previous run's."
            echo
            echo "Measured by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "**This PR arrives with no check runs.** \`create-pull-request\`"
            echo "pushes with \`GITHUB_TOKEN\`, and a \`GITHUB_TOKEN\` push never"
            echo "triggers workflows, so required contexts will not report until"
            echo "someone presses **Update branch**. An empty check list looks"
            echo "identical to \"CI has not started yet\" — make CI actually run"
            echo "before merging."
            echo
            echo "Close it if the refresh is not wanted; the next scheduled run"
            echo "reopens it from the current measurement."
            echo "PRBODY"
          } >> "$GITHUB_OUTPUT"
      - name: open a PR if the numbers moved
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # DCO + signing. Two separate problems, one place to fix both.
          #
          # `author` defaults to `${{ github.actor }}` — the human whose push
          # triggered the run — so a commit this action generated arrived
          # authored by them, without their sign-off, and `scripts/check_dco.py`
          # failed the PR it had just opened (#617). Nobody can fix that by
          # signing off: the trailer must name the commit's own author, and the
          # human never wrote this content. Naming the bot is both truthful and
          # what check_dco already exempts — an account that cannot agree to a
          # certificate must not be asked for one.
          #
          # `sign-commits` then has GitHub create the commit through its API and
          # sign it with its own key, so these land "Verified" like any other
          # bot commit rather than unsigned. It needs the `contents: write` this
          # job already declares.
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          sign-commits: true
          add-paths: docs/eval-latest.json
          branch: bot/eval-metrics
          delete-branch: true
          commit-message: "chore(eval): refresh published metrics"
          title: "chore(eval): refresh published metrics"
          body: ${{ steps.body.outputs.text }}

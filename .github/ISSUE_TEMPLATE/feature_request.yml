name: Feature request
description: Propose a change to the CLI, the gates, or the docs
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        boost is deliberately small and **stdlib-only at runtime** — no
        third-party imports in `boost_cli/`. Proposals that need a runtime
        dependency are a much harder sell than ones that don't, so it's worth
        saying up front which yours is.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that boost makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: >
        A command, flag, or behaviour change. Concrete beats abstract — show
        the invocation and the output you want.
      placeholder: |
        $ boost list --json --stale
        [{"name": "brainstorming", "behind": 3}]
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which part of boost?
      options:
        - a command (boost_cli/commands/)
        - the engine — catalog, install, search (boost_cli/core/)
        - taps and registries
        - CI, the quality gates, or packaging
        - docs and the site
        - not sure
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      options:
        - label: This needs no third-party runtime dependency.
        - label: I'd be willing to open the PR.

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Existing commands, workarounds, or other tools — and why they fall short.

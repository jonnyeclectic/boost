version: 2
updates:
  # The shipped runtime is stdlib-only ([project].dependencies is empty), so
  # Actions and the dev/CI toolchain are the only dependencies boost has.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The hash-pinned dev/CI toolchain (requirements/*.txt, generated from the
  # *.in files by scripts/lock_toolchain.py).
  #
  # `open-pull-requests-limit: 0` switches off *version* updates here, and it is
  # not rate-limiting — Dependabot cannot regenerate these files correctly.
  # It re-resolves on Linux and commits that resolution, which drops every pin
  # whose environment marker excludes it there. The locks install with
  # --require-hashes on Windows and macOS too, so a dropped pin is an install
  # failure on the platform that needed it: one scheduled run deleted
  # `colorama ; sys_platform == 'win32'` (pytest's Windows terminal dependency)
  # from three locks and `pywin32-ctypes` (keyring's Windows backend, and
  # keyring is twine's own dependency) from release-tools, killing both Windows
  # test legs and the `metadata` job in their install step — 2 of 2 pip PRs in
  # that run were unmergeable. scripts/lock_toolchain.py resolves --universal
  # for every supported platform, which is why it is the source of truth.
  #
  # So a bump here is reproduced, not merged: take the version Dependabot would
  # have proposed and run `python3 scripts/lock_toolchain.py -P <name>`, which
  # re-resolves that one package universally and leaves every other pin, markers
  # included, exactly as committed.
  #
  # The entry stays because **security** updates ignore this limit and keep
  # firing, and they are what it is actually worth. Should one arrive it will be
  # regenerated the same broken way — but `lock_toolchain.py --audit`, which
  # `make lint` runs before it resolves anything, now fails naming the lost
  # package instead of letting it surface as an unexplained install error.
  #
  # This does give up *proactive* freshness for the dev toolchain, which is what
  # the entry was originally added for. That is a bounded trade, not a silent
  # one: security updates still fire here, pip-audit.yml runs weekly against the
  # resolved closure and blocks on a live CVE, and osv-scanner.yml covers what a
  # PR introduces. What is left is stale-but-not-vulnerable tooling, and the
  # replacement — regenerating on a schedule with `lock_toolchain.py --upgrade`
  # and opening the PR from that — is tracked as its own roadmap item
  # (scheduled-toolchain-lock-regeneration).
  - package-ecosystem: pip
    directory: /requirements
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  # pyproject.toml's optional extras. Dependabot only scans manifests under the
  # declared `directory`, so the /requirements entry above never sees the repo
  # root — [rag], [bdd] and [perf] got no proactive bump PRs at all, only
  # reactive pip-audit CVE flags. Contributor-facing only: [project].dependencies
  # is empty, so none of this reaches anyone who `pip install boost-skill-cli`.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The [eval] extra is deliberately held at the langchain 0.3 stack:
      # ragas 0.2.x hard-imports a ChatVertexAI path that langchain>=1.0 and
      # langchain-community>=0.4 removed. A bump PR here cannot be merged until
      # ragas itself catches up, so Dependabot must not raise one — the whole
      # reason this entry did not already exist. Drop these four ignores in the
      # same change that lifts the `ragas>=0.2,<0.3` ceiling in pyproject.toml.
      - dependency-name: ragas
      - dependency-name: langchain-core
      - dependency-name: langchain-community
      - dependency-name: langchain-openai
  # The two npm trees, for the same reason the pip entries exist: both are now
  # hash-pinned by a committed package-lock.json, and a pin with no update path
  # is only half the job. Dependabot scans one `directory` at a time and neither
  # manifest is under the other, so both need their own entry.
  #
  # /            — stylelint + eslint for the theme assets (theme-lint.yml)
  # /tests/visual — puppeteer-core + axe-core for the render/a11y/console sweeps
  #
  # Contributor-facing only: none of this ships. The runtime is stdlib Python and
  # MANIFEST.in keeps both manifests out of the sdist.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /tests/visual
    schedule:
      interval: weekly

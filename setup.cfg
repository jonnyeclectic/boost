# mutmut (mutation testing) reads its config from here.
# Strength gate: >=80% of generated mutants in boost_cli/core must be killed
# by the unit suite (see scripts/mutation_gate.py, `make mutation`).
# (mutmut copies tests/, setup.cfg and pyproject.toml into mutants/ by itself.)
[mutmut]
source_paths = boost_cli/core/
pytest_add_cli_args_test_selection = tests/unit/
also_copy =
    boost_cli/
    # tests/unit/test_toolchain_lock.py asserts the hash-pinned locks and their
    # .in declarations agree, and tests/unit/test_registries_fresh.py and
    # friends read their generators — mutmut runs the unit suite inside
    # mutants/, so those trees have to exist there too or the baseline run
    # fails to collect and the gate never starts.
    requirements/
    scripts/
    # test_a11y_check.py audits style/boost.css and the docs pages,
    # test_roadmap_fresh.py / test_docsite_chrome.py read the generated boards,
    # test_post_deploy_smoke.py asserts every page it checks still exists in the
    # repo (including the root redirect stub), and test_marketing_counts.py reads
    # README.md. Same reason for all of them: the unit suite runs inside mutants/,
    # so what it reads has to be there. A missing tree fails baseline COLLECTION,
    # which reads as "mutation gate: `mutmut run` failed to execute" — not as a
    # test failure.
    docs/
    style/
    index.html
    README.md
    # test_required_checks.py runs scripts/check_required_checks.py against the
    # real tree, which reads every workflow file.
    .github/
    # test_community_health_files.py asserts CODE_OF_CONDUCT.md exists and is
    # linked from CONTRIBUTING.md. .github/ above is already copied, so the
    # module's "repo root not reachable" skip does NOT fire in mutants/ — the
    # test runs there for real and needs these two files present.
    CONTRIBUTING.md
    CODE_OF_CONDUCT.md
    # tests/unit/test_eval_metrics.py imports evals.metrics / evals.make_golden
    # and reads evals/*.json. Same reason as the trees above: the unit suite
    # runs inside mutants/, so what it reads has to be there. Copied, NOT
    # mutated — source_paths stays boost_cli/core/.
    evals/
    # tests/unit/test_eval_corpus.py compares the eval gate's floors as spelled
    # in the Makefile against the ones in .github/workflows/ci.yml, so BOTH have
    # to be here. Omitting it fails the whole mutation gate — with every shard
    # red and no mention of boost_cli — on a change that touched no product code
    # at all, which is a confusing way to learn about a missing file.
    Makefile
    # tests/unit/test_serve_docs.py asserts the Lighthouse rc still starts
    # scripts/serve_docs.py and still waits for the banner it prints — two
    # numbers and a string in one file that have to agree. It did exactly what
    # the note above describes: six red shards, none naming boost_cli, for a
    # PR that touched no product code.
    .lighthouserc.json
    # tests/unit/test_langchain_packaging.py imports boost_langchain (the
    # guard test) and reads MANIFEST.in (the sdist assertion) — the Makefile
    # and .github/ it also reads are copied above. Landed red the same way
    # test_eval_corpus.py's Makefile did: four shards down, zero boost_cli
    # mentions, FileNotFoundError on mutants/MANIFEST.in.
    boost_langchain/
    MANIFEST.in

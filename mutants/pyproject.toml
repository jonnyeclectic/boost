[project]
name = "boost-skill-cli"
version = "2.3.3"
description = "boost — Homebrew for AI coding skills"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:boost_cli.*"]

[tool.coverage.run]
source = ["boost_cli"]
parallel = false

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
